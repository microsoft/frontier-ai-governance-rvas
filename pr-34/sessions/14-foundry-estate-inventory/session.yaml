schema_version: 2
session:
  id: "14"
  slug: "foundry-estate-inventory"
  title: "Foundry estate and lifecycle operations"
  duration_minutes: 180
  status: "draft"
  last_verified: "2026-09-03"
  audience:
    - "Cloud and AI platform engineers"
    - "FinOps and cost owners"
    - "Security and governance reviewers who need an estate-wide view"
  prerequisites:
    - "Session 01 has recorded the required tag keys, owner tag, and cost tag used across the AI estate."
    - "The operator has the Reader role at every management group or subscription listed in the estate scope."
    - "The Azure CLI resource-graph extension is installed, or the operator may install it."
    - "A cost owner can read Microsoft Cost Management for the same subscriptions."
  dependencies:
    - "Session 01 - Microsoft Foundry platform baseline, inventory, and landing-zone guardrails"
    - "Session 03 - Model governance, data residency, quota, and lifecycle"
    - "Session 11 - Observability, cost, and operational controls"
  services_in_scope:
    - "azure-ai-foundry"
    - "azure-openai"
    - "azure-cost-management"
  control_objective: "Deploy an Azure Workbook and run an estate report that reads every Azure AI account across the approved management groups, checks each in-scope deployment against the live Models API, and reports estate, model lifecycle, Service Health, and Azure Advisor retirement findings."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Record the approved estate scope, in-scope account kinds, required tags, approved regions, and known exceptions."
  - "Run one Resource Graph query that returns every Azure AI account with its kind, SKU, region, network setting, and tags."
  - "Add the model deployment layer for each in-scope account, then check its live lifecycle and retirement data."
  - "Deploy a shared Azure Workbook that gives operators a live estate, lifecycle, retirement, and health dashboard."
  - "Report estate, model lifecycle, Service Health, and Azure Advisor retirement findings to the named owner."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/estate-scope.json"
    - "implementation/artifacts/queries/foundry-accounts.kql"
    - "implementation/artifacts/queries/service-health-retirements.kql"
    - "implementation/artifacts/queries/advisor-retirement-findings.kql"
    - "implementation/artifacts/infra/main.bicep"
    - "implementation/artifacts/monitoring/estate-lifecycle-workbook.json"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
    - "implementation/scripts/build-estate-report.ps1"
    - "implementation/scripts/build-estate-report.sh"
    - "implementation/scripts/build-estate-report.py"
    - "implementation/scripts/deploy-workbook.ps1"
    - "implementation/scripts/deploy-workbook.sh"
retained_files:
  - path: "implementation/artifacts/estate-scope.json"
    consumer: "The platform inventory owner and the estate report scripts"
    operational_purpose: "Define which management groups the report reads, which account kinds and regions are approved, which tags are required, and which accounts are recorded exceptions."
  - path: "implementation/artifacts/queries/foundry-accounts.kql"
    consumer: "The estate report scripts and Azure Resource Graph Explorer"
    operational_purpose: "Return every Azure AI account with the kind, SKU, region, network setting, tags, and subscription name the report classifies."
  - path: "implementation/artifacts/queries/service-health-retirements.kql"
    consumer: "The estate report scripts and Azure Resource Graph Explorer"
    operational_purpose: "Return active Azure AI and machine-learning Service Health retirement advisories for lifecycle-owner review."
  - path: "implementation/artifacts/queries/advisor-retirement-findings.kql"
    consumer: "The estate report scripts and Azure Resource Graph Explorer"
    operational_purpose: "Return open Azure Advisor service upgrade and retirement recommendations for in-scope accounts."
  - path: "implementation/artifacts/infra/main.bicep"
    consumer: "The workbook deployment operator"
    operational_purpose: "Deploy the shared Azure AI estate and lifecycle Workbook in the approved resource group."
  - path: "implementation/artifacts/monitoring/estate-lifecycle-workbook.json"
    consumer: "The shared Azure Workbook"
    operational_purpose: "Render live account, deployment, model catalog, workspace, Service Health, Advisor, and resource-health views."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The PowerShell Session 14 delivery operator"
    operational_purpose: "Reject unresolved scope decisions and confirm Resource Graph access before the estate read."
  - path: "implementation/scripts/preflight.sh"
    consumer: "The Bash Session 14 delivery operator"
    operational_purpose: "Apply the same scope, extension, and access checks outside Windows."
  - path: "implementation/scripts/build-estate-report.ps1"
    consumer: "The PowerShell platform inventory owner"
    operational_purpose: "Read the estate with Resource Graph, add the model deployment layer per account, and report tag, region, and kind findings."
  - path: "implementation/scripts/build-estate-report.sh"
    consumer: "The Bash platform inventory owner"
    operational_purpose: "Produce the same estate report during scheduled reviews and after a subscription is added to scope."
  - path: "implementation/scripts/build-estate-report.py"
    consumer: "The PowerShell and Bash estate report entry points"
    operational_purpose: "Join live account, deployment, model lifecycle, Service Health, and Advisor data into one report."
  - path: "implementation/scripts/deploy-workbook.ps1"
    consumer: "The PowerShell Session 14 delivery operator"
    operational_purpose: "Run preflight and deploy the shared workbook to the approved Azure resource group."
  - path: "implementation/scripts/deploy-workbook.sh"
    consumer: "The Bash Session 14 delivery operator"
    operational_purpose: "Run the same workbook deployment path outside Windows."
sources:
  - title: "Azure Resource Graph table and resource type reference"
    url: "https://learn.microsoft.com/azure/governance/resource-graph/reference/supported-tables-resources"
    accessed: "2026-09-03"
    supports: "Resource Graph exposes microsoft.CognitiveServices/accounts in the resources table and does not list accounts/deployments or accounts/projects as queryable resource types."
  - title: "Quickstart: Run Resource Graph query using Azure CLI"
    url: "https://learn.microsoft.com/azure/governance/resource-graph/first-query-azurecli"
    accessed: "2026-09-03"
    supports: "The resource-graph CLI extension, az graph query, and the --management-groups and --subscriptions scoping arguments."
  - title: "Deploy models using Azure CLI and Bicep"
    url: "https://learn.microsoft.com/azure/foundry/foundry-models/how-to/create-model-deployments"
    accessed: "2026-09-03"
    supports: "az cognitiveservices account deployment list returns the active model deployments on an account."
  - title: "Understanding the Azure Resource Graph query language"
    url: "https://learn.microsoft.com/azure/governance/resource-graph/concepts/query-language"
    accessed: "2026-09-03"
    supports: "Joining the Resources table to ResourceContainers on subscriptionId to resolve subscription names."
  - title: "Microsoft Foundry Models lifecycle and support policy"
    url: "https://learn.microsoft.com/azure/foundry/openai/concepts/model-retirements"
    accessed: "2026-09-03"
    supports: "The Models API returns lifecycle and deprecation fields for regional model catalog entries, and Azure Service Health carries model retirement notices."
  - title: "Identify impacted resources for service retirements by using Azure Resource Graph"
    url: "https://learn.microsoft.com/azure/service-health/service-retirement-unified-impact-queries"
    accessed: "2026-09-03"
    supports: "ServiceHealthResources provides retirement signals and AdvisorResources provides retirement recommendations for impacted resources."
