schema_version: 2
session:
  id: "03"
  slug: "model-governance-lifecycle"
  title: "Model governance, data residency, quota, and lifecycle"
  duration_minutes: 330
  status: "draft"
  last_verified: "2026-08-28"
  audience:
    - "AI product owners and AI engineers"
    - "Cloud engineers who run Microsoft Foundry"
    - "Data, privacy, procurement, and security reviewers"
    - "Azure Policy owners"
  prerequisites:
    - "An `AIServices` Microsoft Foundry resource and project exist in the approved nonproduction subscription and resource group. The platform owner confirms the resource and project names, and that the approved execution host reaches the project through the recorded private path. (Sessions 01-02.)"
    - "Record the existing Microsoft Foundry resource and project names, and confirm that the resource `kind` is `AIServices`."
    - "Give the deployment operator time-bound Cognitive Services Contributor on the exact Microsoft Foundry resource."
    - "Give the policy operator time-bound Owner or Resource Policy Contributor on the approved resource group."
    - "The model decision authority approves the exact model coordinates, workload purpose, processing-location requirement, and external decision reference through the customer model-change process."
    - "Confirm that the platform owner can read model availability and quota, and that the named Responsible AI policy exists under the exact Foundry resource."
  dependencies:
    - "Session 01 - Microsoft Foundry platform baseline, inventory, and landing-zone guardrails"
    - "Session 02 - Private networking, DNS, and controlled egress"
  services_in_scope:
    - "azure-ai-foundry"
    - "azure-openai"
  control_objective: "Record each approved model, deploy its exact serverless API version through version-controlled profiles and Bicep, then assign the built-in Foundry model-deployment policies from the same approval register."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Record the approval reference and exact model deployment settings in the deployment profile."
  - "Check scope, access, model lifecycle, Responsible AI policy, processing location, live quota, and the Bicep preview before deployment."
  - "Deploy the approved serverless API model version and confirm that the live child deployment matches the profile."
  - "Record approved publishers, model asset IDs, source, hosting route, and review decisions in the policy register."
  - "Assign the built-in approved-model and eligibility policies from the register, review Audit results, and move to Deny through the approved change path."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/infra/models/main.bicep"
    - "implementation/artifacts/environments/sandbox.bicepparam"
    - "implementation/artifacts/models/deployment-profiles.json"
    - "implementation/artifacts/model-approval-register.json"
    - "implementation/artifacts/policy/model-governance.bicep"
    - "implementation/artifacts/policy/model-governance.bicepparam"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
    - "implementation/scripts/preflight-model-policy.ps1"
    - "implementation/scripts/preflight-model-policy.sh"
    - "implementation/scripts/check-model-policy.ps1"
    - "implementation/scripts/check-model-policy.sh"
retained_files:
  - path: "implementation/artifacts/infra/models/main.bicep"
    consumer: "The Azure deployment pipeline operated by the Foundry platform team"
    operational_purpose: "Create or update approved model child deployments under the existing AIServices resource."
  - path: "implementation/artifacts/environments/sandbox.bicepparam"
    consumer: "The Azure deployment pipeline operated by the Foundry platform team"
    operational_purpose: "Name the nonproduction AIServices resource for the Bicep deployment."
  - path: "implementation/artifacts/models/deployment-profiles.json"
    consumer: "The Session 03 Bicep entrypoint and preflight scripts"
    operational_purpose: "Supply each deployment's approval reference, model, SKU, capacity, filter, processing location, review date, quota headroom, and fixed no-auto-upgrade setting."
  - path: "implementation/artifacts/model-approval-register.json"
    consumer: "The model reviewers, policy owner, and policy parameter file"
    operational_purpose: "Record the approval decision behind each allowed publisher and model asset ID, then supply those values to the policy assignment."
  - path: "implementation/artifacts/policy/model-governance.bicep"
    consumer: "The platform deployment pipeline"
    operational_purpose: "Deploy and reconcile the two built-in Foundry model-deployment policy assignments at the approved resource group."
  - path: "implementation/artifacts/policy/model-governance.bicepparam"
    consumer: "The platform deployment pipeline"
    operational_purpose: "Bind the policy assignments to the approved scope, the resolved built-in definition IDs, and the allowed values in the approval register."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The PowerShell-based Foundry deployment operator"
    operational_purpose: "Stop a model change when approval, scope, access, live lifecycle, location, quota, Bicep, or what-if checks fail."
  - path: "implementation/scripts/preflight.sh"
    consumer: "The Bash-based Foundry deployment operator"
    operational_purpose: "Stop a model change when approval, scope, access, live lifecycle, location, quota, Bicep, or what-if checks fail."
  - path: "implementation/scripts/preflight-model-policy.ps1"
    consumer: "The PowerShell policy deployment operator"
    operational_purpose: "Reject unresolved policy decisions and register-to-parameter mismatches before the policy assignments are deployed."
  - path: "implementation/scripts/preflight-model-policy.sh"
    consumer: "The Bash policy deployment operator"
    operational_purpose: "Apply the same register, scope, effect, and asset-ID checks outside Windows."
  - path: "implementation/scripts/check-model-policy.ps1"
    consumer: "The PowerShell policy owner"
    operational_purpose: "Read the live policy assignments and confirm their effect and allowed values match the approval register."
  - path: "implementation/scripts/check-model-policy.sh"
    consumer: "The Bash policy owner"
    operational_purpose: "Run the same live assignment comparison during review and after an approval-register change."
