site_name: Frontier AI Governance — RVAS
site_description: Governing AI agents in your tenant, session by session.
site_author: RVAS Delivery
docs_dir: docs
theme:
  name: material
  language: en
  logo: assets/logos/logo-mark.png
  favicon: assets/logos/logo-mark-white.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - toc.follow
extra_css:
  - assets/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - Home: index.md
  - How to Deliver: how-to-deliver.md
  - Readiness Assessment: assessment/index.md
  - Sessions:
      - S0 · Foundations & Operating Model: s0-foundations/index.md
      - S1 · Identity & Access: s1-identity/index.md
      - S2 · Data & Compliance: s2-data-compliance/index.md
      - S3 · Security Posture & Runtime: s3-security-runtime/index.md
      - S4 · Quality & Safety Evaluation: s4-evaluation/index.md
      - S5 · Adversarial Testing: s5-red-teaming/index.md
      - S6 · Control Plane & Operationalization: s6-control-plane/index.md
  - Reference:
      - Landscape: reference/index.md
      - Reference Architectures: reference/reference-architectures.md
      - Product Status: reference/product-status.md
      - Governance Mapping: reference/governance-mapping.md
