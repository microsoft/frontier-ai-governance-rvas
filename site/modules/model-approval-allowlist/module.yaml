schema_version: 2
module:
  slug: "model-approval-allowlist"
  title: "Model approval decisions and the Foundry deployment allowlist"
  duration_minutes: 180
  status: "draft"
  last_verified: "2026-09-03"
  audience:
    - "AI platform and cloud governance engineers"
    - "Security, privacy, and legal reviewers who approve model use"
    - "Azure Policy owners"
  prerequisites:
    - "Session 01 has deployed the Microsoft Foundry baseline in the approved nonproduction resource group."
    - "Session 03 has recorded the workload's processing-location requirement and the deployment types allowed for it."
    - "The policy owner holds Owner or Resource Policy Contributor at the exact resource group where the assignments are created."
    - "The model reviewers can read a model card in the Foundry model catalog and copy its publisher name and model asset ID."
    - "The approved change system holds any earlier model-deployment policy assignment that this module replaces."
  related_content:
    - "Session 01 - Microsoft Foundry platform baseline, inventory, and landing-zone guardrails"
    - "Session 03 - Model governance, data residency, quota, and lifecycle"
    - "Session 09 - Foundry evaluations and release quality gates"
  services_in_scope:
    - "azure-ai-foundry"
    - "azure-openai"
    - "azure-policy"
  control_objective: "Record why each model is approved, then assign the two built-in Foundry model-deployment policies so that the approved publishers, model asset IDs, model source, and lifecycle status in the register are the ones Azure Policy evaluates at the approved resource group."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Record each approved model with its publisher, asset ID, source category, hosting route, processing location, approvers, and review date."
  - "Assign the built-in approved-models and eligibility policies at the approved resource group with parameters taken from the register."
  - "Start in Audit, review compliance, and move to Deny through the approved change path."
  - "Confirm that the live assignment parameters match the register and that the register contains no unreviewed model."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/model-approval-register.json"
    - "implementation/artifacts/policy/model-governance.bicep"
    - "implementation/artifacts/policy/model-governance.bicepparam"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
    - "implementation/scripts/check-model-policy.ps1"
    - "implementation/scripts/check-model-policy.sh"
retained_files:
  - path: "implementation/artifacts/model-approval-register.json"
    consumer: "The model reviewers, the policy owner, and the policy parameter file"
    operational_purpose: "Record the approval decision behind every allowed publisher and model asset ID, and supply those values to the policy assignment."
  - path: "implementation/artifacts/policy/model-governance.bicep"
    consumer: "The platform deployment pipeline"
    operational_purpose: "Deploy and reconcile the two built-in model-deployment policy assignments at the approved resource group."
  - path: "implementation/artifacts/policy/model-governance.bicepparam"
    consumer: "The platform deployment pipeline"
    operational_purpose: "Bind the assignment to the approved scope, the resolved built-in definition IDs, and the allowed values held in the register."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The PowerShell module delivery operator"
    operational_purpose: "Reject unresolved decisions and register-to-parameter mismatches before the policy assignment is deployed."
  - path: "implementation/scripts/preflight.sh"
    consumer: "The Bash module delivery operator"
    operational_purpose: "Apply the same register, scope, effect, and asset-ID checks outside Windows."
  - path: "implementation/scripts/check-model-policy.ps1"
    consumer: "The PowerShell policy owner"
    operational_purpose: "Read the live policy assignments and confirm their effect and allowed values still match the approval register."
  - path: "implementation/scripts/check-model-policy.sh"
    consumer: "The Bash policy owner"
    operational_purpose: "Run the same live assignment comparison during review and after any register change."
sources:
  - title: "Built-in policies for model deployment in Microsoft Foundry portal"
    url: "https://learn.microsoft.com/azure/foundry/how-to/model-deployment-policy"
    accessed: "2026-09-03"
    supports: "Both built-in policies, their display names, the allowedPublishers and allowedAssetIds parameters, the onlyAllowDirectFromAzure and denyPreviewModels parameters, prefix matching on asset IDs, deployment-time evaluation, the Owner or Resource Policy Contributor requirement, and the 15-minute propagation delay."
  - title: "Overview of Microsoft Foundry Models"
    url: "https://learn.microsoft.com/azure/foundry/concepts/foundry-models-overview"
    accessed: "2026-09-03"
    supports: "The split between Foundry Models sold by Azure and Foundry Models from partners and community, provider-set license terms, managed compute and serverless deployment options, and Microsoft acting as data processor for serverless deployments."
  - title: "Foundry Models sold by Azure"
    url: "https://learn.microsoft.com/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure"
    accessed: "2026-09-03"
    supports: "Models sold by Azure are hosted and operated by Azure, billed through the Azure subscription, covered by Azure service-level agreements, and supported by Microsoft."
  - title: "Azure Policy built-in policy definitions"
    url: "https://learn.microsoft.com/azure/governance/policy/samples/built-in-policies"
    accessed: "2026-09-03"
    supports: "The Cognitive Services entry for the approved-models definition, its Audit, Deny, and Disabled effects, and its definition ID aafe3651-cb78-4f68-9f81-e7e41509110f."
