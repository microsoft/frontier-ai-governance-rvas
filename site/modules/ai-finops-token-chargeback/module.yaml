schema_version: 2
module:
  slug: "ai-finops-token-chargeback"
  title: "AI cost allocation, budgets, and gateway token chargeback"
  duration_minutes: 270
  status: "draft"
  last_verified: "2026-10-05"
  audience:
    - "FinOps and cloud platform engineers"
    - "Azure API Management gateway owners"
    - "Application Insights and Log Analytics operators"
    - "AI product owners and finance partners"
  prerequisites:
    - "Session 06 has an approved Azure API Management route for the AI API, and the gateway owner controls the versioned policy source."
    - "Session 11 has the approved Application Insights or Log Analytics telemetry boundary, action group, and cost-notification owner."
    - "The target Azure subscription is recorded as a full Azure subscription resource ID, and the cost owner approves the filtered budget scope."
    - "The required cost-allocation tag names, cost-center taxonomy, APIM products, consumer mapping, and monthly token quota are agreed with finance."
    - "API Management is integrated with Application Insights, custom metrics with dimensions are enabled, and the LLM API diagnostic settings can support the chargeback query."
  related_content:
    - "Session 06 - Azure API Management AI gateway design and implementation"
    - "Session 11 - Observability, cost, and operational controls"
    - "Azure Policy guardrails for Microsoft Foundry AI services"
  services_in_scope:
    - "azure-cost-management"
    - "azure-api-management"
    - "azure-policy"
    - "application-insights"
  control_objective: "Assign staged subscription cost-allocation tag policy, deploy filtered AI budget notifications, add gateway token metrics and per-product token quotas, and keep the finance-approved token rate table used to attribute tokens by cost center."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Deploy subscription cost-allocation tag assignments that stage resource-group tag requirements and inherit those tags to AI resources."
  - "Deploy filtered AI budget notifications for the approved scope and action group."
  - "Merge an API Management policy that emits low-cardinality token metrics and applies a per-product token quota."
  - "Record the finance-approved token-to-cost rates used by the chargeback query."
  - "Confirm that the KQL query attributes prompt, completion, and total tokens by cost center and consumer."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/policy/tag-allocation.bicep"
    - "implementation/artifacts/policy/tag-allocation.bicepparam"
    - "implementation/artifacts/cost/ai-budget-with-filters.bicep"
    - "implementation/artifacts/cost/ai-budget-with-filters.bicepparam"
    - "implementation/artifacts/apim/token-chargeback-policy.xml"
    - "implementation/artifacts/queries/token-chargeback.kql"
    - "implementation/artifacts/finance/chargeback-decisions.json"
    - "implementation/artifacts/finance/token-rate-table.json"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
retained_files:
  - path: "implementation/artifacts/policy/tag-allocation.bicep"
    consumer: "The subscription policy deployment pipeline"
    operational_purpose: "Assign the subscription-wide cost-allocation tag policies and managed identities used to keep AI resource tags aligned with resource-group ownership."
  - path: "implementation/artifacts/policy/tag-allocation.bicepparam"
    consumer: "The subscription policy deployment pipeline"
    operational_purpose: "Supply the approved subscription scope, tag names, assignment prefix, and identity location for the cost-allocation policy deployment."
  - path: "implementation/artifacts/cost/ai-budget-with-filters.bicep"
    consumer: "The subscription budget deployment pipeline and cost owner"
    operational_purpose: "Deploy filtered AI budget notifications for the approved resource groups, meter categories, contacts, and action group."
  - path: "implementation/artifacts/cost/ai-budget-with-filters.bicepparam"
    consumer: "The subscription budget deployment pipeline"
    operational_purpose: "Supply the budget name, amount, dates, filters, thresholds, emails, and action-group IDs approved by finance."
  - path: "implementation/artifacts/apim/token-chargeback-policy.xml"
    consumer: "The API Management gateway policy repository"
    operational_purpose: "Emit token metrics with cost-center and consumer dimensions and apply the per-product token quota in the existing AI gateway route."
  - path: "implementation/artifacts/queries/token-chargeback.kql"
    consumer: "The FinOps analyst and Application Insights or Log Analytics operator"
    operational_purpose: "Attribute prompt, completion, and total tokens by cost center, consumer, product, API, and model for showback or chargeback review."
  - path: "implementation/artifacts/finance/chargeback-decisions.json"
    consumer: "The cost owner, gateway owner, and module preflight scripts"
    operational_purpose: "Record the approved scope, budget, tag taxonomy, APIM product mapping, metric dimensions, query owner, and restore references that live service state does not hold together."
  - path: "implementation/artifacts/finance/token-rate-table.json"
    consumer: "The FinOps analyst and chargeback reporting pipeline"
    operational_purpose: "Hold the finance-approved token rate table used to convert attributed token usage into showback or chargeback amounts."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The PowerShell module delivery operator"
    operational_purpose: "Reject unresolved finance and platform decisions, validate artifact syntax, check the approved target scope, and run read-only Bicep previews before deployment."
  - path: "implementation/scripts/preflight.sh"
    consumer: "The Bash module delivery operator"
    operational_purpose: "Apply the same decision, syntax, scope, and read-only preview checks outside Windows."
sources:
  - title: "Require a tag on resource groups"
    url: "https://github.com/Azure/azure-policy/blob/master/built-in-policies/policyDefinitions/Tags/ResourceGroupRequireTag_Deny.json"
    accessed: "2026-10-05"
    supports: "Built-in policy display name, mode, rule shape, and policy definition ID for requiring a tag on resource groups."
  - title: "Inherit a tag from the resource group"
    url: "https://github.com/Azure/azure-policy/blob/master/built-in-policies/policyDefinitions/Tags/InheritTag_AddOrReplace_Modify.json"
    accessed: "2026-10-05"
    supports: "Built-in policy display name, rule shape, modify effect, policy definition ID, and Contributor role requirement for inherited tag remediation."
  - title: "Details of the policy assignment structure"
    url: "https://learn.microsoft.com/en-us/azure/governance/policy/concepts/assignment-structure"
    accessed: "2026-10-05"
    supports: "Policy assignment parameters, metadata, identity, location, enforcement mode, and scope behavior."
  - title: "Quickstart - Create a budget with Bicep"
    url: "https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/quick-create-budget-bicep"
    accessed: "2026-10-05"
    supports: "Budget Bicep deployment, notifications, filters, forecasted thresholds, and the fact that budget notifications do not stop resources."
  - title: "Microsoft.Consumption/budgets"
    url: "https://learn.microsoft.com/en-us/azure/templates/microsoft.consumption/budgets"
    accessed: "2026-10-05"
    supports: "Current Bicep schema for Microsoft.Consumption budget resources."
  - title: "Bicep What-If: Preview Changes Before Deployment"
    url: "https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-what-if"
    accessed: "2026-10-05"
    supports: "Read-only what-if support for subscription deployments before Bicep deployment."
  - title: "Azure API Management policy reference - llm-emit-token-metric"
    url: "https://learn.microsoft.com/en-us/azure/api-management/llm-emit-token-metric-policy"
    accessed: "2026-10-05"
    supports: "Token metric policy syntax, Application Insights metric emission, custom-dimension limits, streaming token-count caveats, and include_usage guidance."
  - title: "Azure API Management policy reference - llm-token-limit"
    url: "https://learn.microsoft.com/en-us/azure/api-management/llm-token-limit-policy"
    accessed: "2026-10-05"
    supports: "Per-key token rate and quota behavior, counter keys, quota periods, and 429 or 403 outcomes."
  - title: "Integrate Azure API Management with Application Insights"
    url: "https://learn.microsoft.com/en-us/azure/api-management/api-management-howto-app-insights"
    accessed: "2026-10-05"
    supports: "Application Insights integration and custom metrics prerequisites for API Management."
  - title: "Implement Advanced Monitoring for Foundry Models Through a Gateway"
    url: "https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/azure-openai-gateway-monitoring"
    accessed: "2026-10-05"
    supports: "Gateway-based model usage attribution, APIM gateway log requirements, and example usage queries over token fields."
  - title: "Set Up Logging for Language Model APIs"
    url: "https://learn.microsoft.com/en-us/azure/api-management/api-management-howto-llm-logs"
    accessed: "2026-10-05"
    supports: "Generative AI gateway logs, token usage caveats, Log Analytics destination, and correlation between LLM log entries."
  - title: "Azure Monitor Logs reference - ApiManagementGatewayLlmLog"
    url: "https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/apimanagementgatewayllmlog"
    accessed: "2026-10-05"
    supports: "Current LLM gateway log table columns for prompt tokens, completion tokens, total tokens, model name, deployment name, and correlation ID."
  - title: "Azure Monitor Logs reference - ApiManagementGatewayLogs"
    url: "https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/apimanagementgatewaylogs"
    accessed: "2026-10-05"
    supports: "Current API Management gateway log table columns for product ID, APIM subscription ID, API ID, operation ID, and correlation ID."
  - title: "AI-Gateway FinOps Framework"
    url: "https://github.com/Azure-Samples/AI-Gateway/tree/main/labs/finops-framework"
    accessed: "2026-10-05"
    supports: "Per-product token limits, token usage cost controls, Azure Monitor alert integration, and APIM subscription response patterns for FinOps."
  - title: "Regulation (EU) 2024/1689 (Artificial Intelligence Act)"
    url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng"
    accessed: "2026-10-05"
    supports: "No article requires cost allocation. Article 12 (record-keeping) requires high-risk AI systems to allow automatic recording of events, which the per-consumer token records can support. Cited in the module's EU AI Act line."
