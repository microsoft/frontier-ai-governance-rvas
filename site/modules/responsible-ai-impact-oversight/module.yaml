schema_version: 2
module:
  slug: "responsible-ai-impact-oversight"
  title: "Responsible AI impact assessment, transparency, and human oversight"
  duration_minutes: 300
  status: "draft"
  last_verified: "2026-10-05"
  audience:
    - "Responsible AI and AI governance leads"
    - "Microsoft Foundry agent product owners"
    - "Legal, compliance, privacy, and risk reviewers"
    - "Foundry platform and agent runtime engineers"
    - "Delivery owners who approve consequential agent actions"
  prerequisites:
    - "Session 04 has created the approved nonproduction Foundry agent, and the agent owner can identify its project, deployment, version, tools, and lifecycle path."
    - "The product owner can complete the use-case intake, Article 5 prohibited-practice screen, EU AI Act risk class, and Article 50 transparency obligation fields for one AI system."
    - "Legal or compliance counsel can review the classification and the transparency wording. This module records the decision path; it does not provide legal advice."
    - "The runtime owner can deploy the approval gate to the approved agent application path and protect any tool execution endpoint outside this repository."
    - "One approver role, one consequential tool, and one synthetic approved and rejected tool-call payload are available for the delivery checks."
  related_content:
    - "Session 04 - Governed Microsoft Foundry agent baseline"
    - "Session 09 - Foundry evaluations and release quality gates"
    - "Session 10 - Red teaming, prompt injection, and Defender"
    - "Session 14 - Foundry estate and lifecycle operations"
  services_in_scope:
    - "azure-ai-foundry"
    - "foundry-agent-service"
  control_objective: "Record the responsible-AI decision file for one governed Foundry agent, add a human approval gate to one consequential tool, and confirm approved and rejected tool-call paths."
implementation:
  mode: "extended"
  extended_reason: "Human oversight must be confirmed for both an approved and a rejected consequential tool call before the agent keeps that tool enabled."
implementation_outcomes:
  - "Record the AI system inventory entry, use-case intake result, Article 5 screen, EU AI Act risk class, and Article 50 transparency obligations in one schema-checked record."
  - "Complete the impact assessment and transparency note records for the selected Foundry agent."
  - "Configure a pause-and-resume human approval gate for one consequential agent tool."
  - "Confirm that an approved tool call executes and a rejected tool call does not execute."
  - "Keep owners, retention, stop-mechanism, and restore decisions with the module artifacts."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/records/ai-system-inventory-entry.schema.json"
    - "implementation/artifacts/records/ai-system-inventory-entry.json"
    - "implementation/artifacts/records/impact-assessment.md"
    - "implementation/artifacts/records/transparency-note.md"
    - "implementation/artifacts/oversight/oversight-decision.json"
    - "implementation/artifacts/runtime/foundry_human_approval_gate.py"
    - "implementation/artifacts/runtime/requirements.txt"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
    - "implementation/scripts/verify.ps1"
    - "implementation/scripts/verify.sh"
retained_files:
  - path: "implementation/artifacts/records/ai-system-inventory-entry.schema.json"
    consumer: "The responsible-AI inventory workflow and preflight scripts"
    operational_purpose: "Validate the enum values used for system type, autonomy level, AI Act role, risk class, Article 5 screen, and Article 50 obligations."
  - path: "implementation/artifacts/records/ai-system-inventory-entry.json"
    consumer: "The responsible-AI inventory owner and preflight scripts"
    operational_purpose: "Record the selected Foundry agent, use-case intake, Article 5 screen, EU AI Act classification, Article 50 obligations, owners, and next review date."
  - path: "implementation/artifacts/records/impact-assessment.md"
    consumer: "The product owner, responsible-AI lead, and legal or privacy reviewers"
    operational_purpose: "Capture the system purpose, affected groups, harms, mitigations, data categories, role-of-humans decision, and sign-off path for the selected agent."
  - path: "implementation/artifacts/records/transparency-note.md"
    consumer: "The product owner, communications reviewer, and transparency owner"
    operational_purpose: "Hold the system transparency note, first-interaction disclosure, limitations, user notice channel, upstream documentation, and review cadence."
  - path: "implementation/artifacts/oversight/oversight-decision.json"
    consumer: "The runtime owner, approver role, delivery owner, and preflight scripts"
    operational_purpose: "Name the consequential tool, approver role, approval mode, decision store, retention, stop mechanism, and expected approved and rejected results."
  - path: "implementation/artifacts/runtime/foundry_human_approval_gate.py"
    consumer: "The approved Foundry agent runtime"
    operational_purpose: "Pause a consequential tool call for human approval, execute it only after approval, and reject it without tool execution when the approver denies it."
  - path: "implementation/artifacts/runtime/requirements.txt"
    consumer: "The agent runtime build process"
    operational_purpose: "Install the packages used by the approval-gate runtime component."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The PowerShell module delivery operator"
    operational_purpose: "Reject unresolved responsible-AI decisions, invalid enum values, unsafe target scope, blocked Article 5 screens, and incomplete oversight settings before runtime deployment."
  - path: "implementation/scripts/preflight.sh"
    consumer: "The Bash module delivery operator"
    operational_purpose: "Apply the same artifact, scope, classification, and oversight checks outside Windows."
  - path: "implementation/scripts/verify.ps1"
    consumer: "The PowerShell delivery owner"
    operational_purpose: "Run the approved and rejected tool-call checks against the deployed approval gate without printing payloads or tokens."
  - path: "implementation/scripts/verify.sh"
    consumer: "The Bash delivery owner"
    operational_purpose: "Run the same approved and rejected tool-call checks without calling PowerShell."
sources:
  - title: "Transparency Note for Foundry Agent Service"
    url: "https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/agents/transparency-note"
    accessed: "2026-10-05"
    supports: "Agent Service capabilities, agentic autonomy, human oversight cautions, irreversible or consequential action cautions, and transparency-note purpose."
  - title: "Add a human-in-the-loop approval step (preview)"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/add-human-in-the-loop"
    accessed: "2026-10-05"
    supports: "Foundry hosted-agent pause-and-resume approval pattern, preview status, durable task behavior, and metadata guidance."
  - title: "tasks Package - Functions"
    url: "https://learn.microsoft.com/python/api/azure-ai-agentserver-core/azure.ai.agentserver.core.tasks?view=azure-python"
    accessed: "2026-10-05"
    supports: "`azure-ai-agentserver-core` exposes `multi_turn_task`, `TaskContext`, entry modes, and the resilient task API used by the hosted approval path."
  - title: "Using function tools with human in the loop approvals"
    url: "https://learn.microsoft.com/en-us/agent-framework/agents/tools/tool-approval"
    accessed: "2026-10-05"
    supports: "Microsoft Agent Framework approval-required tools, `ApprovalRequiredAIFunction`, `approval_mode=\"always_require\"`, approval requests, and approval responses."
  - title: "Code of Conduct for Microsoft AI Services"
    url: "https://learn.microsoft.com/en-us/legal/ai-code-of-conduct"
    accessed: "2026-10-05"
    supports: "Customer requirements for disclosure, testing, appropriate human oversight, feedback channels, and restrictions on consequential decisions without oversight."
  - title: "Work with user identities in Azure App Service authentication"
    url: "https://learn.microsoft.com/azure/app-service/configure-authentication-user-identities"
    accessed: "2026-10-05"
    supports: "Built-in App Service authentication injects user-identity request headers and external requests cannot set those headers; `X-MS-CLIENT-PRINCIPAL` carries base64 JSON claims, while `X-MS-CLIENT-PRINCIPAL-ID` and `X-MS-CLIENT-PRINCIPAL-NAME` identify the caller."
  - title: "Responsible AI Impact Assessment Template"
    url: "https://msblogs.thesourcemediaassets.com/sites/5/2022/06/Microsoft-RAI-Impact-Assessment-Template.pdf"
    accessed: "2026-10-05"
    supports: "Responsible AI impact-assessment structure used for the module record."
  - title: "Responsible AI Impact Assessment Guide"
    url: "https://msblogs.thesourcemediaassets.com/sites/5/2022/06/Microsoft-RAI-Impact-Assessment-Guide.pdf"
    accessed: "2026-10-05"
    supports: "Impact-assessment guidance for intended uses, affected groups, harms, mitigations, and role of humans."
  - title: "Regulation (EU) 2024/1689"
    url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng"
    accessed: "2026-10-05"
    supports: "Official EU AI Act text for Article 5 (prohibited practices), Article 6 and Annex III (high-risk classification), Article 9 (risk management system), Article 13 (transparency to deployers), Article 14 (human oversight), Article 26(2) (deployers assign human oversight), Article 27 (fundamental rights impact assessment), Article 50 (transparency obligations), and the risk-class labels used in the records."
  - title: "Regulation (EU) 2026/1744 (Digital Omnibus on AI)"
    url: "https://eur-lex.europa.eu/eli/reg/2026/1744/oj/eng"
    accessed: "2026-10-05"
    supports: "Amends Articles 5, 6, 27, and 50(7) of Regulation (EU) 2024/1689 without renumbering them."
