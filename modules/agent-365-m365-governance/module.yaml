    accessed: "2026-08-27"
    supports: "Copilot Studio environment, security scan, connector dependency, and governance controls."
  - title: "Data loss prevention for Copilot Studio"
    url: "https://learn.microsoft.com/en-us/microsoft-copilot-studio/admin-data-loss-prevention"
    accessed: "2026-08-27"
    supports: "Power Platform DLP connector grouping and Copilot Studio connector controls."
  - title: "Advanced connector policies"
    url: "https://learn.microsoft.com/en-us/power-platform/admin/advanced-connector-policies"
