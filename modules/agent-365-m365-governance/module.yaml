schema_version: 2
module:
  slug: "agent-365-m365-governance"
  title: "Microsoft Agent 365 and Microsoft 365 agent governance"
  duration_minutes: 270
  status: "draft"
  last_verified: "2026-08-27"
  audience:
    - "Microsoft 365, Copilot Studio, and Agent 365 administrators"
    - "Microsoft Entra identity and access governance owners"
    - "Security, data, and AI platform owners"
  prerequisites:
    - "An approved nonproduction Microsoft 365 tenant has Microsoft Agent 365, Microsoft 365 Copilot extensibility, Copilot Studio, Power Platform, Microsoft Entra, Microsoft Purview, SharePoint, and Microsoft Defender XDR access available for review."
    - "One nonproduction agent or pilot agent family is approved for inventory, publishing, connector, identity, oversharing, and Defender posture review."
    - "The tenant owner has recorded the Agent 365 administrator, Entra identity owner, Copilot Studio environment owner, Power Platform DLP owner, SharePoint owner, Defender owner, and publishing approver roles."
    - "No production-wide agent publishing, connector blocking, Conditional Access enforcement, or SharePoint sharing change is made during this module."
  related_sessions:
    - "Session 03 - Entra identity, RBAC, PIM, and workload identities"
    - "Session 08 - Azure API Center and the AI/MCP inventory"
    - "Session 09 - MCP and tool security"
    - "Session 10 - Purview data governance and Agent 365 data controls"
    - "Session 12 - Red teaming, prompt injection, and Defender"
    - "Session 15 - Agent fleet governance, multi-region design, and production rehearsal"
  services_in_scope:
    - "agent-365"
    - "microsoft-365-copilot"
    - "microsoft-copilot-studio"
    - "power-platform"
    - "microsoft-entra-id"
    - "microsoft-entra-agent-id"
    - "microsoft-purview"
    - "sharepoint"
    - "microsoft-defender-xdr"
  control_objective: "Create the owner review packet for one Agent 365 or Microsoft 365 pilot agent without changing production access."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Record the Agent 365 inventory, map, owner, sponsor, and lifecycle decisions for the approved nonproduction scope."
  - "Define the publishing, Copilot Studio, connector, Entra Agent ID, SharePoint oversharing, and Defender XDR checks that must be completed before wider rollout."
  - "Use templates and validation queries for portal controls instead of fragile tenant-wide automation."
  - "Confirm that each module artifact gives the responsible owner enough detail to act outside the repository."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/governance/agent-inventory-template.csv"
    - "implementation/artifacts/governance/agent-publishing-approval-checklist.md"
    - "implementation/artifacts/identity/entra-agent-id-policy-template.json"
    - "implementation/artifacts/connectors/connector-governance-matrix.csv"
    - "implementation/artifacts/data/sharepoint-oversharing-assessment.md"
    - "implementation/artifacts/defender/agent-security-hunting-queries.kql"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
retained_files:
  - path: "implementation/artifacts/governance/agent-inventory-template.csv"
    consumer: "The Agent 365 administrator and agent owner"
    operational_purpose: "Capture the approved agent inventory, registry, map, owner, sponsor, lifecycle, and publishing state."
  - path: "implementation/artifacts/governance/agent-publishing-approval-checklist.md"
    consumer: "The publishing approver and Agent 365 administrator"
    operational_purpose: "Record the pre-publishing checks for agent metadata, access, identity, connector, data, security, and restore readiness."
  - path: "implementation/artifacts/identity/entra-agent-id-policy-template.json"
    consumer: "The Entra identity owner"
    operational_purpose: "Define the Agent ID sponsorship, Conditional Access, expiry, and access-review decisions to configure in Microsoft Entra."
  - path: "implementation/artifacts/connectors/connector-governance-matrix.csv"
    consumer: "The Power Platform DLP owner and Copilot Studio environment owner"
    operational_purpose: "Classify connectors, MCP endpoints, tool actions, authentication mode, data movement risk, and approval state."
  - path: "implementation/artifacts/data/sharepoint-oversharing-assessment.md"
    consumer: "The SharePoint owner and data owner"
    operational_purpose: "Record broad-sharing findings, remediation owner, grounding-source decision, and residual oversharing risk."
  - path: "implementation/artifacts/defender/agent-security-hunting-queries.kql"
    consumer: "The Defender owner and SOC analyst"
    operational_purpose: "Provide payload-free hunting query templates for agent inventory, runtime protection, prompt injection, and tool misuse review."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The module delivery operator"
    operational_purpose: "Check that required module artifacts exist and every decision field is filled in before owner review."
  - path: "implementation/scripts/preflight.sh"
    consumer: "The module delivery operator"
    operational_purpose: "Apply the same artifact and decision checks outside Windows."
sources:
