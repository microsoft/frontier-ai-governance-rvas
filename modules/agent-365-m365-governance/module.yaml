    accessed: "2026-08-27"
    supports: "Agent 365 tenant-level observe, govern, and secure capabilities."
  - title: "Manage Microsoft 365 Copilot agents in Integrated Apps"
    url: "https://learn.microsoft.com/en-us/microsoft-365/admin/manage/manage-copilot-agents-integrated-apps"
    accessed: "2026-08-27"
    supports: "Microsoft 365 Admin Center agent publishing, approval, enablement, blocking, and removal paths."
  - title: "Manage Microsoft 365 Copilot extensibility"
    url: "https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/manage"
    accessed: "2026-08-27"
    supports: "Microsoft 365 Copilot agent and extension management surfaces, including SharePoint agent file behavior."
  - title: "Microsoft Copilot Studio security and governance"
