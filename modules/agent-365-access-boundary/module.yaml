schema_version: 2
module:
  slug: "agent-365-access-boundary"
  title: "Microsoft Agent 365 access and data controls"
  duration_minutes: 270
  status: "draft"
  last_verified: "2026-09-04"
  audience:
    - "Microsoft 365 and Microsoft Agent 365 administrators"
    - "Data, Purview, Entra, source-platform, and audit owners"
  prerequisites:
    - "An approved nonproduction Foundry, Copilot Studio, or Agent Builder agent appears in Agent Registry and supports the selected installation path."
    - "The delivery owner has approved one test group, host product, synthetic labelled item, DLP action, audit query, and restore route."
    - "The DLP, label, installation, and audit operators have the current required Microsoft 365 roles."
  related_content:
    - "Session 03 - Deploy a Citadel Agent Spoke and governed agent"
    - "Session 05 - Evaluation, red-team, and threat release gates"
  services_in_scope:
    - "agent-365"
    - "microsoft-purview"
    - "microsoft-entra-id"
    - "microsoft-365-copilot"
    - "azure-ai-foundry"
  control_objective: "Apply a scoped Purview DLP policy, install one approved agent for a test group, check included and excluded access, and query payload-free Agent 365 activity."
implementation:
  mode: "extended"
  extended_reason: "The delivery owner must observe the intended labelled interaction and an excluded or out-of-scope path before the rollout remains enabled."
implementation_outcomes:
  - "Record the approved agent, group, host product, consent, DLP boundary, audit query, and restore action."
  - "Simulate and enable the scoped DLP policy before installation."
  - "Install the agent for the approved group and confirm excluded access remains denied."
  - "Run the payload-free Agent 365 activity query."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/agent-deployment.json"
    - "implementation/artifacts/governance/coverage-handoff.md"
    - "implementation/artifacts/operations/agent-activity-audit-query.json"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
    - "implementation/scripts/query-agent-activity.ps1"
    - "implementation/scripts/query-agent-activity.sh"
retained_files:
  - path: "implementation/artifacts/agent-deployment.json"
    consumer: "Microsoft 365 administrator and module preflight scripts"
    operational_purpose: "Record the agent, test group, host product, consent, DLP readiness, installation, and restore action."
  - path: "implementation/artifacts/governance/coverage-handoff.md"
    consumer: "data, Agent 365, source-platform, and audit owners"
    operational_purpose: "Assign cross-product control ownership and document the Foundry and Microsoft 365 boundary."
  - path: "implementation/artifacts/operations/agent-activity-audit-query.json"
    consumer: "Agent 365 audit-query scripts"
    operational_purpose: "Define approved operations and payload-free fields for recurring activity review."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "PowerShell-based module operator"
    operational_purpose: "Check deployment, DLP readiness, audit permission, and retained query settings before a change."
  - path: "implementation/scripts/preflight.sh"
    consumer: "Bash-based module operator"
    operational_purpose: "Apply the same Agent 365 readiness checks outside Windows."
  - path: "implementation/scripts/query-agent-activity.ps1"
    consumer: "Agent 365 audit owner"
    operational_purpose: "Run the scoped unified audit search and display approved payload-free fields."
  - path: "implementation/scripts/query-agent-activity.sh"
    consumer: "Agent 365 audit owner"
    operational_purpose: "Run the scoped Microsoft Graph Audit Search outside Windows."
sources:
  - title: "Governance and lifecycle actions for agents"
    url: "https://learn.microsoft.com/microsoft-365/admin/manage/agent-actions"
    accessed: "2026-09-04"
    supports: "Agent Registry installation, permission consent, availability actions, and uninstall path."
  - title: "Use Microsoft Purview to manage data security and compliance for Microsoft Agent 365"
    url: "https://learn.microsoft.com/purview/ai-agent-365"
    accessed: "2026-09-04"
    supports: "Current DLP targeting, directions, locations, labels, and audit coverage."
  - title: "Audit log activities"
    url: "https://learn.microsoft.com/purview/audit-log-activities"
    accessed: "2026-09-04"
    supports: "Current Agent 365 audit operations and searchable records."
