schema_version: 2
module:
  slug: "a2a-api-center-discovery"
  title: "A2A agent discovery in Azure API Center"
  duration_minutes: 60
  status: "draft"
  last_verified: "2026-08-28"
  audience:
    - "API platform and developer-experience engineers"
    - "A2A runtime owners and Agent 365 administrators"
  prerequisites:
    - "The A2A agent has a live Microsoft Agent 365 record from a supported onboarding route."
    - "Developers have a documented need to discover the agent's A2A interface through Azure API Center."
    - "The runtime owner controls an approved Git or API Management source integration that can publish the A2A asset without a manual duplicate record."
    - "The API Center owner can review the source integration and resulting Agent asset in the approved nonproduction API Center."
  related_content:
    - "Session 08 - Azure API Center and the AI/MCP inventory"
    - "A2A agent inventory in Microsoft Agent 365"
  services_in_scope:
    - "azure-api-center"
    - "agent-365"
    - "azure-api-management"
  control_objective: "Expose an already-governed A2A agent for developer discovery in Azure API Center through a supported Git or API Management integration maintained by the runtime owner, then review the live catalog asset."
implementation:
  mode: "standard"
  live_only: true
implementation_outcomes:
  - "Confirm that developers need A2A discovery for the approved agent."
  - "Select a supported Git or API Management source that the runtime owner maintains."
  - "Create or refresh the live API Center asset through that source without a manual duplicate registration."
  - "Review the catalog asset and confirm that it still points to the current A2A interface."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind: []
retained_files: []
sources:
  - title: "Register and manage agents in Azure API Center"
    url: "https://learn.microsoft.com/en-us/azure/api-center/register-manage-agents"
    accessed: "2026-08-28"
    supports: "Current agent registration, A2A protocol, agent-card, and source synchronization boundaries."
  - title: "Synchronize API assets from a Git repo to Azure API Center"
    url: "https://learn.microsoft.com/en-us/azure/api-center/synchronize-assets-git"
    accessed: "2026-08-28"
    supports: "Current Git-source synchronization requirements for API Center assets, including agents."
  - title: "Synchronize APIs from an API Management instance"
    url: "https://learn.microsoft.com/en-us/azure/api-center/synchronize-api-management-apis"
    accessed: "2026-08-28"
    supports: "Current API Management synchronization behavior for A2A agent APIs and source-owned fields."
