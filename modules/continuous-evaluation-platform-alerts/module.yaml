schema_version: 2
module:
  slug: "continuous-evaluation-platform-alerts"
  title: "Continuous evaluation and Foundry platform alerts"
  duration_minutes: 210
  status: "draft"
  last_verified: "2026-10-05"
  audience:
    - "Microsoft Foundry platform and agent owners"
    - "Azure Monitor, Application Insights, and Log Analytics operators"
    - "AI quality owners who operate continuous evaluation"
    - "Service owners who respond to throttling, latency, and token-use alerts"
  prerequisites:
    - "Session 04 has produced one governed Foundry agent in an approved nonproduction project."
    - "Session 09 has selected the evaluator set and quality thresholds for the same agent."
    - "Session 11 has named the Log Analytics workspace, Application Insights resource, alert owner, and operating route."
    - "Session 12 or the approved deployment path can run Bicep what-if and deploy to the exact resource group that contains the Foundry account."
    - "The operator has Monitoring Contributor on the approved resource group and the Foundry project managed identity can receive the Foundry User role through the customer's access process."
  related_content:
    - "Session 04 - Governed Microsoft Foundry agent baseline"
    - "Session 09 - Foundry evaluations and release quality gates"
    - "Session 11 - Observability, cost, and operational controls"
    - "Session 12 - CI/CD, policy as code, and controlled promotion"
  services_in_scope:
    - "azure-ai-foundry"
    - "application-insights"
    - "azure-monitor"
    - "log-analytics"
  control_objective: "Configure diagnostic settings, platform metric alerts, and one continuous evaluation rule for a governed Foundry project, then confirm the alert rules are enabled and evaluation results appear in the connected monitoring store."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Route the Foundry account's platform logs and metrics to the approved Log Analytics workspace."
  - "Deploy enabled Azure Monitor metric alerts for throttling, response latency, and token volume, with one owned action group."
  - "Record the continuous evaluation rule, evaluators, sampling cap, owners, and stop conditions in a machine-readable decision file."
  - "Create or update the continuous evaluation rule for the governed agent by using the Foundry SDK."
  - "Confirm the alert rules are enabled and evaluation runs are visible after sampled traffic arrives."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/monitoring/foundry-platform-monitoring.bicep"
    - "implementation/artifacts/monitoring/foundry-platform-monitoring.bicepparam"
    - "implementation/artifacts/evaluation/continuous-evaluation-decision.json"
    - "implementation/artifacts/evaluation/continuous-evaluation-rule.py"
    - "implementation/artifacts/evaluation/requirements.txt"
    - "implementation/artifacts/queries/foundry-token-and-throttling.kql"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
retained_files:
  - path: "implementation/artifacts/monitoring/foundry-platform-monitoring.bicep"
    consumer: "The Azure monitoring deployment pipeline"
    operational_purpose: "Deploy and reconcile the diagnostic setting, action group, and Foundry platform metric alerts owned by this module."
  - path: "implementation/artifacts/monitoring/foundry-platform-monitoring.bicepparam"
    consumer: "The Azure monitoring deployment pipeline"
    operational_purpose: "Supply the approved Foundry account, workspace, action route, metric thresholds, and implementation marker for the monitoring deployment."
  - path: "implementation/artifacts/evaluation/continuous-evaluation-decision.json"
    consumer: "The AI quality owner, Foundry operator, and module preflight scripts"
    operational_purpose: "Record the governed agent, continuous evaluation rule, evaluator set, sampling cap, thresholds, owner roles, and restore route that the platform does not reconstruct from alert resources."
  - path: "implementation/artifacts/evaluation/continuous-evaluation-rule.py"
    consumer: "The Foundry evaluation operator"
    operational_purpose: "Create or update the continuous evaluation rule and list recent evaluation runs without storing prompts, responses, tokens, or customer data."
  - path: "implementation/artifacts/evaluation/requirements.txt"
    consumer: "The Foundry evaluation operator and Python build process"
    operational_purpose: "Install the bounded Python packages used by the continuous-evaluation operational script."
  - path: "implementation/artifacts/queries/foundry-token-and-throttling.kql"
    consumer: "The Azure Monitor operations owner"
    operational_purpose: "Check that diagnostic data arrives and inspect token, throttling, and latency signals after deployment."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The PowerShell module delivery operator"
    operational_purpose: "Reject unresolved monitoring and evaluation decisions, validate syntax, and run the resource-group what-if before Azure changes."
  - path: "implementation/scripts/preflight.sh"
    consumer: "The Bash module delivery operator"
    operational_purpose: "Apply the same artifact, scope, syntax, and deployment-preview checks outside Windows."
sources:
  - title: "Monitor agents with the Agent Monitoring Dashboard"
    url: "https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard"
    accessed: "2026-10-05"
    supports: "Application Insights storage for agent monitoring, preview status for recurring evaluations and alerts, Foundry User role requirement, and the Python continuous evaluation rule surface."
  - title: "Monitoring data reference for Azure OpenAI"
    url: "https://learn.microsoft.com/en-us/azure/foundry/openai/monitor-openai-reference"
    accessed: "2026-10-05"
    supports: "Current Azure OpenAI metric names, dimensions, DS export status, throttling behavior at PTU saturation, and the warning against the legacy Latency metric."
  - title: "Diagnostic Settings in Azure Monitor"
    url: "https://learn.microsoft.com/en-us/azure/azure-monitor/data-collection/diagnostic-settings"
    accessed: "2026-10-05"
    supports: "Diagnostic settings collect resource logs and platform metrics and send them to destinations such as Log Analytics."
  - title: "Microsoft.Insights/diagnosticSettings"
    url: "https://learn.microsoft.com/en-us/azure/templates/microsoft.insights/diagnosticsettings"
    accessed: "2026-10-05"
    supports: "Bicep resource type and 2021-05-01-preview API for diagnostic settings."
  - title: "Microsoft.Insights/metricAlerts"
    url: "https://learn.microsoft.com/en-us/azure/templates/microsoft.insights/metricalerts"
    accessed: "2026-10-05"
    supports: "Bicep resource type, current template properties, and metric alert criteria shape."
  - title: "Microsoft.Insights/actionGroups"
    url: "https://learn.microsoft.com/en-us/azure/templates/microsoft.insights/actiongroups"
    accessed: "2026-10-05"
    supports: "Bicep resource type, action group enablement, short name, and email receiver properties."
  - title: "Resource Manager Template Samples for Metric Alerts"
    url: "https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/resource-manager-alerts-metric"
    accessed: "2026-10-05"
    supports: "Metric alert Bicep sample shape, scopes, criteria, dimensions, action group references, evaluation frequency, and window size."
  - title: "Bicep What-If: Preview Changes Before Deployment"
    url: "https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-what-if"
    accessed: "2026-10-05"
    supports: "Use of Azure Resource Manager what-if to preview Bicep deployment changes before applying them."
  - title: "Regulation (EU) 2024/1689 (Artificial Intelligence Act)"
    url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng"
    accessed: "2026-10-05"
    supports: "Article 12 (record-keeping), Article 26(5) (deployers monitor operation of high-risk AI systems), and Article 72 (post-market monitoring by providers), cited in the module's EU AI Act line."
  - title: "Regulation (EU) 2026/1744 (Digital Omnibus on AI)"
    url: "https://eur-lex.europa.eu/eli/reg/2026/1744/oj/eng"
    accessed: "2026-10-05"
    supports: "Replaces Article 72(3) of Regulation (EU) 2024/1689 without renumbering the article."
