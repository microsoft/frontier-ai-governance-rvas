schema_version: 2
module:
  slug: "enterprise-agent-portfolio-standards"
  title: "Enterprise agent portfolio standards"
  duration_minutes: 180
  status: "draft"
  last_verified: "2026-09-02"
  audience:
    - "AI platform, Agent 365, and API platform owners"
    - "Agent engineering and developer-experience leads"
    - "Security, data, release, and business owners"
  prerequisites:
    - "The organization has an approved nonproduction Agent 365 or Azure API Center inventory path."
    - "The portfolio owner has selected one candidate agent with stable references in the enterprise inventory, API catalog, identity system, gateway, and source platform."
    - "The Agent 365, API Center, API Management, source-platform, security, data, and release owners can decide the standards that apply to the candidate."
    - "The candidate agent remains outside production until the portfolio decision passes the module check."
  related_content:
    - "Session 04 - Governed Microsoft Foundry agent baseline"
    - "Session 06 - Azure API Management AI gateway design and implementation"
    - "Session 07 - Azure API Center and the AI/MCP inventory"
    - "Session 08 - MCP and tool security"
    - "Session 12 - CI/CD, policy as code, and controlled promotion"
    - "A2A agent inventory in Microsoft Agent 365"
  services_in_scope:
    - "agent-365"
    - "azure-api-center"
    - "azure-api-management"
    - "azure-ai-foundry"
    - "microsoft-entra-agent-id"
  control_objective: "Define one enterprise standard for agent classification, ownership, framework and runtime choice, API publication, lifecycle, and retirement. Apply it to one candidate agent before production."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Define the portfolio taxonomy, framework paths, ownership roles, and lifecycle states."
  - "Link one candidate to its authoritative inventory, catalog, identity, gateway, and source-platform records."
  - "Record and check the classification, duplicate review, framework path, lifecycle approval, and retirement coordination."
  - "Use the approved decision in the release process without copying live agent metadata into another inventory."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/portfolio-standard.json"
    - "implementation/artifacts/portfolio-decision.json"
    - "implementation/artifacts/governance/operating-model.md"
retained_files:
  - path: "implementation/artifacts/portfolio-standard.json"
    consumer: "The portfolio governance process and module preflight scripts"
    operational_purpose: "Define the required taxonomy, ownership, lifecycle, architecture decisions, API publication fields, duplicate review, and retirement contract."
  - path: "implementation/artifacts/portfolio-decision.json"
    consumer: "The portfolio owner and release process"
    operational_purpose: "Link one candidate to its authoritative records and retain the cross-platform decisions required before production."
  - path: "implementation/artifacts/governance/operating-model.md"
    consumer: "The AI portfolio, platform, security, data, release, and business owners"
    operational_purpose: "Assign the decisions and handoffs that Agent 365, API Center, API Management, and the source platform do not hold in one shared record."
sources:
  - title: "Manage agents in the Microsoft 365 admin center"
    url: "https://learn.microsoft.com/en-us/microsoft-365/admin/manage/agent-registry"
    accessed: "2026-09-02"
    supports: "Agent Registry inventory, ownerless and unmanaged agent visibility, filtering, and lifecycle actions."
  - title: "Use metadata to organize and govern APIs in Azure API Center"
    url: "https://learn.microsoft.com/en-us/azure/api-center/metadata"
    accessed: "2026-09-02"
    supports: "Required custom metadata for inventory entities and governance checks."
  - title: "What is Microsoft Foundry Agent Service?"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/overview"
    accessed: "2026-09-02"
    supports: "Current prompt, hosted, and workflow agent choices, tools, identity, publishing, and observability boundaries."
