schema_version: 2
module:
  slug: "foundry-tool-catalog-integration"
  title: "API Center private tool catalog to Foundry Toolbox"
  duration_minutes: 180
  status: "draft"
  last_verified: "2026-08-28"
  audience:
    - "Azure API Center and Microsoft Foundry platform engineers"
    - "Agent and MCP tool owners"
    - "Security and release owners responsible for reusable agent tools"
  prerequisites:
    - "Session 05 has an approved Microsoft Foundry project and an agent owner ready to consume a Toolbox endpoint."
    - "Session 07 has an approved remote MCP server in Azure API Center with a version, deployment, runtime URL, owner, lifecycle state, and authentication decision."
    - "Session 08 has approved the MCP server's exposed tool surface, authentication boundary, and runtime safety controls."
    - "The module operator has Azure API Center Data Reader on the exact API Center resource, Foundry User on the exact Foundry project, and Foundry Project Manager if a project connection must be created."
    - "The approved execution host has Azure CLI, Azure Developer CLI 1.25 or later, the microsoft.foundry extension, Python 3, and network access to the Foundry project and MCP server."
  related_content:
    - "Session 05 - Governed Microsoft Foundry agent baseline"
    - "Session 07 - Azure API Center and the AI/MCP inventory"
    - "Session 08 - MCP and tool security"
  services_in_scope:
    - "azure-api-center"
    - "azure-ai-foundry"
    - "foundry-agent-service"
  control_objective: "Connect an approved remote MCP server in Azure API Center to a dedicated versioned Toolbox in Microsoft Foundry, then reconcile the catalog record, project connection, allowed tool, and live Toolbox tool list."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Approve the public-preview private tool catalog path for the exact nonproduction Foundry project."
  - "Discover and configure the MCP server record in API Center through Foundry Tools without storing credentials in the repository."
  - "Create a dedicated Toolbox version that exposes the allow-listed MCP tool and requires approval for every call."
  - "Confirm that the version-specific Toolbox endpoint lists exactly the approved namespaced tool."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/governance/catalog-toolbox-binding.json"
    - "implementation/artifacts/toolbox/toolbox-version.json"
    - "implementation/artifacts/operations/check_toolbox.py"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
retained_files:
  - path: "implementation/artifacts/governance/catalog-toolbox-binding.json"
    consumer: "The API catalog owner and Foundry tool owner"
    operational_purpose: "Record the MCP server, preview decision, project connection, Toolbox name, expected tool, and restore owner so the API catalog and Foundry owners can compare them."
  - path: "implementation/artifacts/toolbox/toolbox-version.json"
    consumer: "The Foundry Toolbox deployment process"
    operational_purpose: "Create the dedicated immutable Toolbox version that connects the MCP server, exposes the approved tool, and requires approval for every call."
  - path: "implementation/artifacts/operations/check_toolbox.py"
    consumer: "The Foundry tool owner"
    operational_purpose: "Query a version-specific Toolbox MCP endpoint and fail unless it exposes exactly the approved namespaced tool with approval required."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The PowerShell module operator"
    operational_purpose: "Reject unresolved decisions, confirm the exact project scope and portal-preview approval, reconcile the endpoint hash and Toolbox payload, and inspect the project connection before change."
  - path: "implementation/scripts/preflight.sh"
    consumer: "The Bash module operator"
    operational_purpose: "Apply the same scope, preview-decision, reconciliation, connection, and no-collision checks outside Windows."
sources:
  - title: "Create a private tool catalog (preview)"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/private-tool-catalog"
    accessed: "2026-08-28"
    supports: "The public-preview Azure API Center private catalog, Foundry Tools discovery path, Azure API Center Data Reader requirement, portal-only authentication and access steps, and possible 24-hour RBAC propagation delay."
  - title: "Create and manage a toolbox in Foundry"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/toolbox"
    accessed: "2026-08-28"
    supports: "Current Toolbox version creation, immutable versions, default-version behavior, MCP endpoint forms, REST API v1, Microsoft Foundry Toolkit, Azure Developer CLI requirements, and tools/list check."
  - title: "Connect agents to Model Context Protocol servers"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/model-context-protocol"
    accessed: "2026-08-28"
    supports: "MCP project connections, allowed_tools, approval settings, Toolbox reuse, Foundry role requirements, and the requirement to treat remote tool metadata and results as untrusted input."
