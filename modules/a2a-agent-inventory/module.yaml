schema_version: 2
module:
  slug: "a2a-agent-inventory"
  title: "A2A agent inventory in Microsoft Agent 365"
  duration_minutes: 150
  status: "draft"
  last_verified: "2026-08-28"
  audience:
    - "Microsoft Agent 365 administrators and AI platform engineers"
    - "A2A runtime owners and Microsoft Entra identity owners"
    - "Agent owners responsible for lifecycle and retirement"
  prerequisites:
    - "An A2A agent runs in an approved nonproduction runtime, and its runtime owner controls the source repository or supported platform integration."
    - "The Agent 365 administrator has confirmed licensing, administrator access, and Agent Registry availability."
    - "The delivery team has selected a supported onboarding route: built-in integration, Registry sync from a supported platform, or a runtime-owned Agent 365 SDK integration."
    - "The agent owner, runtime owner, and retirement owner can review the live Agent 365 record."
  related_content:
    - "Session 05 - Governed Microsoft Foundry agent baseline"
    - "Session 10 - Purview data governance and Agent 365 data controls"
    - "Session 15 - Agent fleet governance, multi-region design, and production rehearsal"
  services_in_scope:
    - "agent-365"
    - "microsoft-entra-agent-id"
  control_objective: "Onboard or confirm an approved A2A agent in Microsoft Agent 365 through a supported integration route, then review its live inventory record, owner, and lifecycle state."
implementation:
  mode: "standard"
  live_only: true
implementation_outcomes:
  - "Select the supported Agent 365 onboarding route for the existing A2A agent."
  - "Complete the approved built-in, Registry sync, or runtime-owned SDK path without copying the agent definition or card into this repository."
  - "Review the live Agent 365 record, its owner, and its lifecycle state."
  - "Confirm the runtime owner can maintain the selected integration and remove or retire the agent through the approved platform path."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind: []
retained_files: []
