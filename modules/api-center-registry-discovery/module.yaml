schema_version: 2
module:
  slug: "api-center-registry-discovery"
  title: "Azure API Center registry discovery for approved MCP servers"
  duration_minutes: 150
  status: "draft"
  last_verified: "2026-08-28"
  audience:
    - "API platform and developer-experience engineers"
    - "MCP server owners and application security owners"
    - "Developers who configure MCP-capable clients"
  prerequisites:
    - "Session 07 has registered the approved remote or local MCP server in an existing Azure API Center default workspace."
    - "Session 08 has completed the runtime authorization, tool-boundary, and telemetry decisions for every MCP server that will be discoverable."
    - "The API Center portal uses Microsoft Entra ID authentication; anonymous access is disabled."
    - "The developer access group has the Azure API Center Data Reader role at the exact API Center resource scope."
    - "An API Center configuration owner can update API visibility and MCP Registry settings through the approved Azure portal change path."
    - "The client owner has a supported MCP registry integration or an approved adapter that reads `registry-client-settings.json`."
  related_content:
    - "Session 07 - Azure API Center and the AI/MCP inventory"
    - "Session 08 - MCP and tool security"
  services_in_scope:
    - "azure-api-center"
    - "microsoft-entra-id"
  control_objective: "Configure Microsoft Entra-protected Azure API Center MCP registry discovery for MCP servers at the approved `Production` lifecycle stage and check that the registry returns no other server names."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Record the default-workspace MCP registry endpoint, Microsoft Entra access requirements, and the client or adapter that uses the settings."
  - "Configure Data API visibility so related consumption features expose MCP records in the approved lifecycle stage."
  - "Keep the approved server names, owners, review date, and restore reference in an operational record."
  - "Confirm that the complete registry response contains every approved server name and no unexpected server name."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/registry-client-settings.json"
    - "implementation/artifacts/registry-ownership.json"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
    - "implementation/scripts/check-discovery.ps1"
    - "implementation/scripts/check-discovery.sh"
retained_files:
  - path: "implementation/artifacts/registry-client-settings.json"
    consumer: "The developer-client configuration pipeline or approved client adapter"
    operational_purpose: "Supply the documented API Center MCP registry endpoint and authentication settings to the approved client adapter without storing tokens or directory identifiers."
  - path: "implementation/artifacts/registry-ownership.json"
    consumer: "The API Center configuration owner and MCP server owners"
    operational_purpose: "Record the approved discoverable server names, global visibility decision, owner roles, review date, and restore reference."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The PowerShell module delivery operator"
    operational_purpose: "Reject unresolved decisions and unsafe discovery settings before the portal-led change."
  - path: "implementation/scripts/preflight.sh"
    consumer: "The Bash module delivery operator"
    operational_purpose: "Apply the same scope, endpoint, access, visibility, and ownership checks outside Windows."
  - path: "implementation/scripts/check-discovery.ps1"
    consumer: "The PowerShell API Center operations owner"
    operational_purpose: "Read the live registry with an environment-provided token and confirm the approved server allowlist across all returned pages."
  - path: "implementation/scripts/check-discovery.sh"
    consumer: "The Bash API Center operations owner"
    operational_purpose: "Run the same live registry allowlist check without writing the response or access token to the repository."
sources:
  - title: "Register and discover MCP servers in your API inventory"
    url: "https://learn.microsoft.com/en-us/azure/api-center/register-discover-mcp-server"
    accessed: "2026-08-28"
    supports: "Remote and local MCP registration, default-workspace registry discovery, the documented registry endpoint format, supported client categories, and custom registry metadata."
  - title: "Set up and customize your API Center portal"
    url: "https://learn.microsoft.com/en-us/azure/api-center/set-up-api-center-portal"
    accessed: "2026-08-28"
    supports: "Microsoft Entra ID is the recommended portal access method; Azure API Center Data Reader grants data-plane read access; visibility conditions apply globally to portal users and related data-plane consumption features."
  - title: "Enable and view Azure API Center portal view - VS Code extension"
    url: "https://learn.microsoft.com/en-us/azure/api-center/enable-api-center-portal-vs-code-extension"
    accessed: "2026-08-28"
    supports: "Visual Studio Code developer connection inputs, Azure API Center Data Reader access, and GitHub Copilot agent-mode discovery through the API Center extension."
  - title: "Self-host your API Center portal"
    url: "https://learn.microsoft.com/en-us/azure/api-center/self-host-api-center-portal"
    accessed: "2026-08-28"
    supports: "The Azure API Center data-plane delegated scope https://azure-apicenter.net/Data.Read.All and Microsoft Entra application configuration."
  - title: "Discover APIs with the Azure API Center MCP server"
    url: "https://learn.microsoft.com/en-us/azure/api-center/discover-catalog-mcp-server"
    accessed: "2026-08-28"
    supports: "The separate API Center MCP server endpoint, its supported clients, inherited portal authentication, and its Standard-tier limitation."
  - title: "MCP Server Registry API"
    url: "https://github.com/modelcontextprotocol/registry/blob/main/docs/reference/api/openapi.yaml"
    accessed: "2026-08-28"
    supports: "The frozen v0.1 server-list response envelope, server name location, and cursor pagination used by the operational check."
