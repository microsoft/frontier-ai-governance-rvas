schema_version: 2
module:
  slug: "obo-delegated-access"
  title: "Delegated API access with OAuth on-behalf-of"
  duration_minutes: 270
  status: "draft"
  last_verified: "2026-08-25"
  audience:
    - "Application and API engineers"
    - "Microsoft Entra identity and application security engineers"
    - "Owners of APIs that authorize each signed-in user"
  prerequisites:
    - "An approved nonproduction tenant has an existing client, confidential Python middle tier, and protected downstream API."
    - "The downstream API exposes one narrow delegated read scope and enforces resource authorization for each user."
    - "An exportable Azure Key Vault certificate is approved for middle-tier client authentication and can be exposed as a protected PFX through the approved runtime integration."
    - "The identity owner can approve exact delegated permissions and consent."
    - "One permitted user and one user without downstream resource authority can run the delivery checks."
  related_content:
    - "Session 02 - Entra identity, RBAC, PIM, and workload identities"
    - "Session 05 - Governed Microsoft Foundry agent baseline"
    - "Session 09 - MCP and tool security"
  services_in_scope:
    - "microsoft-entra-id"
    - "azure-key-vault"
  control_objective: "A trusted middle tier preserves signed-in user authority through an OBO exchange, while the downstream API still authorizes each user."
implementation:
  mode: "extended"
  extended_reason: "The delivery owner must observe one permitted delegated call and one denial caused by missing downstream user authority before the OBO path is used."
implementation_outcomes:
  - "Record the client, middle tier, downstream audience, delegated scope, and consent boundaries."
  - "Configure exact delegated permissions without replacing unrelated application registration settings."
  - "Run a Python middle tier that validates the user assertion and uses a Key Vault-held certificate for OBO."
  - "Confirm a permitted user succeeds and a user without downstream resource authority is denied."
  - "Keep payload-free diagnostics, the threat model, and manual restore guidance in the module files."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/control-definition.json"
    - "implementation/artifacts/identity/app-registrations.json"
    - "implementation/artifacts/identity/key-vault-certificate-binding.json"
    - "implementation/artifacts/governance/authorization-matrix.md"
    - "implementation/artifacts/governance/token-claim-contract.json"
    - "implementation/artifacts/governance/threat-model.md"
    - "implementation/artifacts/runtime/settings.json"
    - "implementation/artifacts/runtime/obo_proxy.py"
    - "implementation/artifacts/runtime/requirements.txt"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
    - "implementation/scripts/configure.ps1"
    - "implementation/scripts/configure.sh"
    - "implementation/scripts/verify.ps1"
    - "implementation/scripts/verify.sh"
retained_files:
  - path: "implementation/artifacts/control-definition.json"
    consumer: "The preflight and configuration scripts"
    operational_purpose: "Bind the module to the approved tenant, application aliases, owners, and implementation marker."
  - path: "implementation/artifacts/identity/app-registrations.json"
    consumer: "The preflight and configuration scripts"
    operational_purpose: "Define the exact client, middle-tier, downstream API, delegated permission, and consent changes."
  - path: "implementation/artifacts/identity/key-vault-certificate-binding.json"
    consumer: "The preflight scripts and Python middle tier"
    operational_purpose: "Reference the approved Key Vault certificate and protected runtime PFX path without retaining key material."
  - path: "implementation/artifacts/governance/authorization-matrix.md"
    consumer: "The identity owner and delivery owner"
    operational_purpose: "Record which component authenticates each hop and where user-specific authorization is enforced."
  - path: "implementation/artifacts/governance/token-claim-contract.json"
    consumer: "The Python middle tier and verification scripts"
    operational_purpose: "Define the inbound and downstream token audiences, delegated scope, and required claim checks."
  - path: "implementation/artifacts/governance/threat-model.md"
    consumer: "The application security owner and delivery owner"
    operational_purpose: "Document the approved token-handling threats, mitigations, and stop conditions for the OBO path."
  - path: "implementation/artifacts/runtime/settings.json"
    consumer: "The Python middle tier"
    operational_purpose: "Supply non-secret runtime aliases for the tenant, applications, scope, certificate binding, and diagnostics."
  - path: "implementation/artifacts/runtime/obo_proxy.py"
    consumer: "The approved middle-tier runtime"
    operational_purpose: "Validate the inbound assertion, perform the OBO exchange, and call the downstream API with delegated authority."
  - path: "implementation/artifacts/runtime/requirements.txt"
    consumer: "The middle-tier build process"
    operational_purpose: "Install the bounded Python dependencies used by the operational OBO implementation."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The PowerShell delivery operator"
    operational_purpose: "Inspect live Entra application state and print the exact delegated-permission change plan."
  - path: "implementation/scripts/preflight.sh"
    consumer: "The Bash delivery operator"
    operational_purpose: "Inspect live Entra application state and print the exact delegated-permission change plan."
  - path: "implementation/scripts/configure.ps1"
    consumer: "The PowerShell identity operator"
    operational_purpose: "Apply only the approved delegated permission and consent changes."
  - path: "implementation/scripts/configure.sh"
    consumer: "The Bash identity operator"
    operational_purpose: "Apply only the approved delegated permission and consent changes."
  - path: "implementation/scripts/verify.ps1"
    consumer: "The PowerShell delivery operator"
    operational_purpose: "Run the permitted and denied delegated calls without retaining tokens or payloads."
  - path: "implementation/scripts/verify.sh"
    consumer: "The Bash delivery operator"
    operational_purpose: "Run the permitted and denied delegated calls without retaining tokens or payloads."
sources:
  - title: "Microsoft identity platform and OAuth 2.0 On-Behalf-Of flow"
    url: "https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-on-behalf-of-flow"
    accessed: "2026-08-25"
    supports: "OBO protocol, middle-tier token audience, delegated user assertion, consent, client authentication, and Conditional Access claims-challenge behavior."
  - title: "Web API that calls web APIs"
    url: "https://learn.microsoft.com/en-us/entra/identity-platform/scenario-web-api-call-api-overview"
    accessed: "2026-08-25"
    supports: "Trusted web API architecture for acquiring a downstream token on behalf of the signed-in user."
  - title: "ClientApplication class"
    url: "https://learn.microsoft.com/en-us/python/api/msal/msal.application.clientapplication"
    accessed: "2026-08-25"
    supports: "MSAL Python confidential-client certificate options, PFX path support, OBO token acquisition, and claims-challenge inputs."
  - title: "Configure an app to access a web API"
    url: "https://learn.microsoft.com/en-us/entra/identity-platform/quickstart-configure-app-access-web-apis"
    accessed: "2026-08-25"
    supports: "Delegated API permissions, exposed scopes, preauthorization, and consent configuration."
  - title: "Update application"
    url: "https://learn.microsoft.com/en-us/graph/api/application-update"
    accessed: "2026-08-25"
    supports: "Microsoft Graph application update semantics and the need to preserve existing collection values when adding permissions or scopes."
  - title: "oauth2PermissionGrant resource type"
    url: "https://learn.microsoft.com/en-us/graph/api/resources/oauth2permissiongrant"
    accessed: "2026-08-25"
    supports: "Delegated permission grant model, consent type, client service principal, resource service principal, principal, and scope fields."
  - title: "Claims challenges, claims requests, and client capabilities"
    url: "https://learn.microsoft.com/en-us/entra/identity-platform/claims-challenge"
    accessed: "2026-08-25"
    supports: "HTTP 401 insufficient-claims challenge format and the client remediation path for Conditional Access."
  - title: "Export certificates from Azure Key Vault"
    url: "https://learn.microsoft.com/en-us/azure/key-vault/certificates/how-to-export-certificate"
    accessed: "2026-08-25"
    supports: "Private-key retrieval through the certificate secret, exportable-key requirement, PFX or PEM formats, and nonexportable HSM boundary."
  - title: "Use TLS/SSL certificates in your code in Azure App Service"
    url: "https://learn.microsoft.com/en-us/azure/app-service/configure-ssl-certificate-in-code"
    accessed: "2026-08-25"
    supports: "Protected certificate loading and mounted private-certificate paths for an approved App Service host."
