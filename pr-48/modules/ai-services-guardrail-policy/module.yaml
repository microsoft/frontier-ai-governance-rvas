schema_version: 2
module:
  slug: "ai-services-guardrail-policy"
  title: "Azure Policy guardrails for Microsoft Foundry AI services"
  duration_minutes: 240
  status: "draft"
  last_verified: "2026-10-05"
  audience:
    - "AI platform engineers"
    - "Azure Policy and landing-zone engineers"
    - "Security, compliance, and operations owners for Microsoft Foundry resources"
    - "Release owners who promote policy assignments from audit to enforcement"
  prerequisites:
    - "The approved subscription scope for Microsoft Foundry and Azure AI services resources is recorded."
    - "The deployment operator can run subscription-scope Bicep what-if and has time-bound Resource Policy Contributor on the approved policy deployment scope."
    - "A Log Analytics workspace exists for diagnostic logs, and the owner can approve the assignment identity's required workspace access before remediation."
    - "The platform policy owner, compliance review owner, data-residency owner, and promotion authority can review current Azure Policy states together."
    - "Sessions 01, 02, 03, and 12 decisions are available so this module does not replace landing-zone, networking, model-approval, or promotion controls."
  related_content:
    - "Session 01 - Microsoft Foundry platform baseline, inventory, and landing-zone guardrails"
    - "Session 02 - Private networking, DNS, and controlled egress"
    - "Session 03 - Model governance, data residency, quota, and lifecycle"
    - "Session 12 - CI/CD, policy as code, and controlled promotion"
  services_in_scope:
    - "azure-policy"
    - "azure-ai-foundry"
    - "azure-openai"
    - "log-analytics"
  control_objective: "Deploy one staged Azure Policy initiative for Microsoft Foundry and Azure AI services resources, review current compliance, and promote approved effects on the same assignment."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Define one version-controlled initiative for local authentication, network access, deployment SKU, content-filter minimums, and diagnostic-log guardrails."
  - "Stage the assignment with `DoNotEnforce` and audit effects before any blocking or remediation effect is approved."
  - "Review current policy states by policy definition reference with the named owner."
  - "Promote approved references on the same assignment, including diagnostic-log remediation when the Log Analytics role path is ready."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/policy/definitions/restrict-foundry-deployment-sku.json"
    - "implementation/artifacts/policy/guardrail-decisions.json"
    - "implementation/artifacts/policy/initiative.bicep"
    - "implementation/artifacts/policy/assignment.bicep"
    - "implementation/artifacts/environments/initiative.bicepparam"
    - "implementation/artifacts/environments/assignment.bicepparam"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
    - "implementation/scripts/check-compliance.ps1"
    - "implementation/scripts/check-compliance.sh"
retained_files:
  - path: "implementation/artifacts/policy/definitions/restrict-foundry-deployment-sku.json"
    consumer: "The subscription policy deployment pipeline"
    operational_purpose: "Create and maintain the custom policy definition that restricts Foundry deployment SKUs excluded by the data-residency decision."
  - path: "implementation/artifacts/policy/guardrail-decisions.json"
    consumer: "The policy deployment pipeline, preflight scripts, and compliance review owner"
    operational_purpose: "Record the approved scope, owners, staged effects, diagnostic destination, content-filter minimums, data-residency SKU exclusions, and restore reference."
  - path: "implementation/artifacts/policy/initiative.bicep"
    consumer: "The subscription policy deployment pipeline"
    operational_purpose: "Deploy the custom SKU policy and group the built-in and custom policy references into one initiative."
  - path: "implementation/artifacts/policy/assignment.bicep"
    consumer: "The subscription policy deployment pipeline"
    operational_purpose: "Assign the initiative to the approved scope with staged effects, managed identity, and promotion-safe parameters."
  - path: "implementation/artifacts/environments/initiative.bicepparam"
    consumer: "The subscription policy deployment pipeline"
    operational_purpose: "Bind the initiative deployment to the recorded initiative name from the decision record."
  - path: "implementation/artifacts/environments/assignment.bicepparam"
    consumer: "The subscription policy deployment pipeline"
    operational_purpose: "Bind the assignment deployment to the recorded target scope, effects, diagnostic workspace, content-filter settings, and SKU list."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The PowerShell policy deployment operator"
    operational_purpose: "Reject unresolved decisions, wrong scopes, invalid effects, syntax errors, and unsafe deployment previews before a policy change."
  - path: "implementation/scripts/preflight.sh"
    consumer: "The Bash policy deployment operator"
    operational_purpose: "Apply the same unresolved-decision, scope, effect, syntax, and subscription what-if checks outside Windows."
  - path: "implementation/scripts/check-compliance.ps1"
    consumer: "The PowerShell compliance review owner"
    operational_purpose: "Read Azure Policy states for the assignment and summarize compliance by policy definition reference."
  - path: "implementation/scripts/check-compliance.sh"
    consumer: "The Bash compliance review owner"
    operational_purpose: "Run the same reference-level Azure Policy compliance summary without writing live-state data to the repository."
sources:
  - title: "Built-in policy definitions for Foundry Tools"
    url: "https://learn.microsoft.com/en-us/azure/ai-services/policy-reference"
    accessed: "2026-10-05"
    supports: "Current Azure Policy built-in catalog for Foundry Tools and Azure AI services resources."
  - title: "Azure Policy built-in - Azure AI Services resources should restrict network access"
    url: "https://github.com/Azure/azure-policy/blob/master/built-in-policies/policyDefinitions/Azure%20Ai%20Services/NetworkAcls_Audit.json"
    accessed: "2026-10-05"
    supports: "Definition ID, display name, version, target aliases, and Audit, Deny, Disabled effects for network access."
  - title: "Azure Policy built-in - Azure AI Services resources should have key access disabled"
    url: "https://github.com/Azure/azure-policy/blob/master/built-in-policies/policyDefinitions/Azure%20Ai%20Services/DisableLocalAuth_Audit.json"
    accessed: "2026-10-05"
    supports: "Definition ID, display name, version, target aliases, and Audit, Deny, Disabled effects for local authentication."
  - title: "Azure Policy built-in - Cognitive Services Deployments should only use allowed control"
    url: "https://github.com/Azure/azure-policy/blob/master/built-in-policies/policyDefinitions/Cognitive%20Services/AllowDeploymentMultiSeverityControl_Audit.json"
    accessed: "2026-10-05"
    supports: "Preview content-filter policy parameters, supported harm categories, and Audit or Disabled effects."
  - title: "Azure Policy built-in - Enable logging by category group for Cognitive Services to Log Analytics"
    url: "https://github.com/Azure/azure-policy/blob/master/built-in-policies/policyDefinitions/Monitoring/DS_LA_cognitiveservices-accounts_DINE.json"
    accessed: "2026-10-05"
    supports: "Diagnostic-log policy parameters, Log Analytics destination, category groups, and AuditIfNotExists or DeployIfNotExists effects."
  - title: "Understanding deployment types in Microsoft Foundry Models"
    url: "https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types"
    accessed: "2026-10-05"
