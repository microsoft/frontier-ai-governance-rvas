schema_version: 2
session:
  id: "11"
  slug: "red-teaming-threat-defense"
  title: "Red teaming, prompt injection, and Defender"
  duration_minutes: 240
  status: "draft"
  last_verified: "2026-08-28"
  audience:
    - "Microsoft Foundry agent and AI safety engineers"
    - "Cloud security and Microsoft Defender administrators"
    - "Security operations and AI application owners"
  prerequisites:
    - "A governed nonproduction agent is ready for authorized testing: the platform inventory identifies immutable baseline and remediated versions, the gateway and tool owners confirm the read-only path and blocked prohibited write, and the quality owner confirms a passing release gate. (Sessions 01-10.)"
    - "The approved nonproduction policy assistant has immutable baseline and remediated versions. Its stable endpoint stays on the previously approved version."
    - "The `get_policy` path is read-only. The prohibited write is absent from the MCP allowlist and backend role, or the backend denies it."
    - "The project managed identity and red-team operator have Foundry User on the exact Foundry project. That project has an approved judge model and budget."
    - "The Session 10 gate remains runnable against the remediated version and returns PASS for its approved record."
    - "The security owner has authorized the exact project, agent, versions, attack categories, synthetic-data boundary, run window, stop contact, and same-day region support check."
    - "Defender for Cloud AI services protection and the approved Defender-to-SOC route are operating."
    - "The SOC owner has accepted an authorized event or route-health result with the source, route, destination, references, observed time, and agent or model context."
  dependencies:
    - "Session 04 - Governed Microsoft Foundry agent baseline"
    - "Session 07 - Azure API Management AI gateway implementation"
    - "Session 09 - MCP and tool security"
    - "Session 05 - Microsoft Agent 365 secure rollout and data controls"
    - "Session 10 - Foundry evaluations and release quality gates"
  services_in_scope:
    - "azure-ai-foundry"
    - "microsoft-defender-for-cloud"
    - "microsoft-defender-xdr"
  control_objective: "Compare authorized adversarial results for the baseline and fixed version remediated before the session, then confirm the Defender-to-SOC route."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Validate authorization, same-day region support, exact immutable versions, and the read-only tool boundary."
  - "Run the approved agent-specific attack plan against the baseline and remediated versions."
  - "Require lower overall attack success, no regression for any evaluator, category, or strategy key, and zero prohibited-action success."
  - "Confirm the authorized Defender event or route-health result at the approved SOC destination."
  - "Retain the attack plan, exact-title alert hunt, and SOC playbook while governed systems keep run, alert, and delivery records."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/red-team/attack-plan.json"
    - "implementation/artifacts/defender/ai-alert-hunt.kql"
    - "implementation/artifacts/operations/soc-triage-playbook.md"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
    - "implementation/scripts/run-red-team.py"
    - "implementation/scripts/compare-runs.py"
    - "implementation/scripts/requirements.txt"
retained_files:
  - path: "implementation/artifacts/red-team/attack-plan.json"
    consumer: "The red-team runner, comparison process, and security owner"
    operational_purpose: "Supply the version-controlled red-team taxonomy, evaluators, attack strategies, and privacy boundary. The security owner updates it through the approved change path and reviews it before each material agent or tool change."
  - path: "implementation/artifacts/defender/ai-alert-hunt.kql"
    consumer: "The SOC analyst"
    operational_purpose: "Query current Defender hunting surfaces for agent and model security records without copying payloads. The SOC owner reviews exact alert titles quarterly and after Defender alert changes."
  - path: "implementation/artifacts/operations/soc-triage-playbook.md"
    consumer: "The SOC analyst and incident commander"
    operational_purpose: "Guide the SOC analyst and incident commander through triage, containment, escalation, and handoff for observed AI security signals. The SOC owner updates it after an incident or route change and reviews it quarterly."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The PowerShell-based red-team operator"
    operational_purpose: "Stop an unauthorized, unsupported, mismatched, unbounded, or payload-retaining run."
  - path: "implementation/scripts/preflight.sh"
    consumer: "The Bash-based red-team operator"
    operational_purpose: "Run the same authorization, scope, plan, and privacy checks outside Windows."
  - path: "implementation/scripts/run-red-team.py"
    consumer: "The red-team operator"
    operational_purpose: "Run the bounded plan and write payload-free aggregates keyed by category, strategy, and evaluator to the approved security record store outside this repository."
  - path: "implementation/scripts/compare-runs.py"
    consumer: "The security owner, release owner, and Session 13 validators"
    operational_purpose: "Reject key-set differences, individual risk regressions, prohibited-action success, and malformed current aggregate inputs without writing a repository report."
  - path: "implementation/scripts/requirements.txt"
    consumer: "The approved Python environment"
    operational_purpose: "Install bounded dependencies needed by preflight and the red-team runner."
sources:
  - title: "AI Red Teaming Agent"
    url: "https://learn.microsoft.com/en-us/azure/foundry/concepts/ai-red-teaming-agent"
    accessed: "2026-08-25"
    supports: "PyRIT-based probing, attack success rate, supported agentic risks and attack strategies, transient agent runs, redaction behavior, purple-environment guidance, and the requirement for human review."
  - title: "Run AI Red Teaming Agent in the cloud"
    url: "https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/run-ai-red-teaming-cloud"
    accessed: "2026-08-26"
    supports: "Current Microsoft Foundry SDK 2.x path, Foundry User prerequisite, exact agent target and taxonomy workflow, built-in agentic evaluators, attack-strategy fields, and the preview 2025-11-15 API."
  - title: "Rate limits, region support, and enterprise features for evaluation"
    url: "https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-regions-limits-virtual-network"
    accessed: "2026-08-26"
    supports: "The current cloud AI red-teaming region matrix, network-injection requirements, and Foundry User requirement for the project managed identity. Authorization records a manual pre-run support check because there is no available stable support-discovery API."
  - title: "Protect AI assets using Microsoft Defender"
    url: "https://learn.microsoft.com/en-us/defender-xdr/security-for-ai/defender-security-for-ai"
    accessed: "2026-08-28"
    supports: "Separate Defender coverage for AI agents and Azure AI infrastructure, including agent behavior, model and supply-chain posture, model scanning, runtime protection, detections, incidents, and hunting."
  - title: "Enable threat protection for AI services"
    url: "https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-onboarding"
    accessed: "2026-08-26"
    supports: "Subscription-level AI services threat protection, Owner or Contributor enablement requirement, optional suspicious-prompt evidence, and the separate paid Purview data-security component."
  - title: "Alerts for AI services"
    url: "https://learn.microsoft.com/en-us/azure/defender-for-cloud/alerts-ai-workloads"
    accessed: "2026-08-28"
    supports: "Current exact AI workload alert titles for jailbreak, ASCII smuggling, credential leakage, suspicious access, anomalous tool invocation, LLM reconnaissance, wallet or cost abuse, phishing or malicious URLs, and malicious uploaded AI models."
  - title: "Detect and investigate threats to AI agents using Microsoft Defender"
    url: "https://learn.microsoft.com/en-us/defender-xdr/security-for-ai/ai-agent-detection-protection"
    accessed: "2026-08-28"
    supports: "Public-preview Agent 365 threat detection, incident correlation, and the AlertInfo, AlertEvidence, CloudAppEvents, AgentsInfo, BehaviorInfo, and BehaviorEntities hunting surfaces."
  - title: "Enable security for AI agents using Microsoft Defender"
    url: "https://learn.microsoft.com/en-us/defender-xdr/security-for-ai/get-started-defender-security-for-ai"
    accessed: "2026-08-28"
    supports: "Agent 365 onboarding, required Microsoft 365 connector components for investigation, and the distinction between cloud-agent collection and Copilot Studio runtime protection."
  - title: "Protect AI agents in real time using Microsoft Defender"
    url: "https://learn.microsoft.com/en-us/defender-xdr/security-for-ai/ai-agent-real-time-protection"
    accessed: "2026-08-28"
    supports: "Current real-time blocking surfaces and limits for Agent 365 tool calls through Work IQ MCP, Copilot Studio agents, Foundry agents in preview, local agents through Defender for Endpoint, and behavior recording."
  - title: "Develop and deploy secure and compliant Microsoft Foundry or custom AI apps"
    url: "https://learn.microsoft.com/en-us/purview/developer/secure-ai-with-purview"
    accessed: "2026-08-28"
    supports: "Current Purview integration matrix: native Foundry supports runtime governance, while data-leak and insider-risk protection requires Agent Framework or Microsoft Purview APIs rather than native Foundry integration."
