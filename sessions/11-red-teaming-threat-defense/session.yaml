schema_version: 2
session:
  id: "11"
  slug: "red-teaming-threat-defense"
  title: "Red teaming, prompt injection, and Defender"
  duration_minutes: 270
  status: "draft"
  last_verified: "2026-08-26"
  audience:
    - "Microsoft Foundry agent and AI safety engineers"
    - "Cloud security and Microsoft Defender administrators"
    - "Security operations and AI application owners"
  prerequisites:
    - "Sessions 01-09 are complete in the full engagement path. For a focused route, confirm the platform inventory lists the exact nonproduction Foundry resource, project, policy-assistant agent, immutable baseline version, remediated version, and stable-endpoint selector."
    - "For a focused route, confirm the access, network, gateway, tool, data, and evaluation records list the project access assignments, network-injection record when isolated, APIM policy reference, get_policy allowlist, backend role definition ID and assignment scope, prohibited-write decision, synthetic-data classification, and Session 10 gate configuration. The stable endpoint selects the approved version, get_policy reads successfully, the prohibited write is absent or denied, and the Session 10 gate returns PASS for its approved record."
    - "The Session 05 policy assistant has one immutable nonproduction agent version approved for authorized adversarial testing."
    - "The Session 08 prohibited write remains absent from the MCP allowlist and backend role, or the exact backend denies it."
    - "The Session 10 golden evaluation gate and approved aggregate release record remain runnable against the remediated version."
    - "Before each run, the security owner checks the Foundry project region against the current Microsoft cloud red-teaming documentation and records the manual support gate in the authorization scope; no stable support-discovery API is assumed."
    - "The Foundry project managed identity has Foundry User on the exact Foundry project."
    - "The red-team operator has Foundry User on the exact Foundry project."
    - "An approved judge-model deployment and red-teaming budget are available in that Foundry project."
    - "Defender for Cloud AI services threat protection is enabled on the approved subscription, and the chosen Defender-to-SOC route is operating."
    - "The security owner has authorized the exact nonproduction Foundry project alias, policy-assistant agent name, immutable baseline version, attack categories, synthetic-data boundary, run window, and stop contact."
    - "The SOC owner has accepted an authorized Defender event or route-health result that shows the source, route type, destination alias, Defender reference, SOC reference, observed time, and agent or model context."
    - "Owned remediations and the new immutable agent version are complete before the timed session."
  dependencies:
    - "Session 05 - Governed Microsoft Foundry agent baseline"
    - "Session 06 - Azure API Management as the AI gateway"
    - "Session 08 - MCP and tool security"
    - "Session 09 - Purview data governance and Agent 365 data controls"
    - "Session 10 - Foundry evaluations and release quality gates"
  services_in_scope:
    - "azure-ai-foundry"
    - "microsoft-defender-for-cloud"
    - "microsoft-defender-xdr"
  control_objective: "Compare authorized adversarial results for the baseline and pre-session remediated versions, then confirm the approved Defender-to-SOC route."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Validate the pre-session authorization for one bounded cloud red-team exercise against exact baseline and remediated nonproduction Foundry agent versions."
  - "Use the approved agent-specific attack plan covering direct, encoded, indirect, leakage, prohibited-action, adherence, and unsafe-tool behavior."
  - "Run the bounded plan against the baseline and the remediated immutable version prepared before the session."
  - "Require every tracked category and attack strategy for each evaluator to hold or improve after remediation, with prohibited actions still blocked independently of model behavior."
  - "Keep a payload-free red-team attestation in the approved release store and record the separate Defender-to-SOC delivery result in the risk and change handoff."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/red-team/authorization-scope.json"
    - "implementation/artifacts/red-team/attack-plan.json"
    - "implementation/artifacts/red-team/taxonomy-review-checklist.md"
    - "implementation/artifacts/red-team/safe-seed-examples.json"
    - "implementation/artifacts/governance/release-gate-mapping.md"
    - "implementation/artifacts/governance/risk-change-handoff.json"
    - "implementation/artifacts/reports/red-team-scorecard-template.json"
    - "implementation/artifacts/reports/evidence-retention-record.md"
    - "implementation/artifacts/reports/before-after-report.json"
    - "implementation/artifacts/defender/ai-alert-hunt.kql"
    - "implementation/artifacts/operations/soc-triage-playbook.md"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
    - "implementation/scripts/run-red-team.py"
    - "implementation/scripts/compare-runs.py"
    - "implementation/scripts/requirements.txt"
retained_files:
  - path: "implementation/artifacts/red-team/authorization-scope.json"
    consumer: "The security owner, red-team operator, and preflight scripts"
    operational_purpose: "Bind authorization, current support, target scope, time window, data handling, and stop conditions."
  - path: "implementation/artifacts/red-team/attack-plan.json"
    consumer: "The red-team runner, comparison process, and security owner"
    operational_purpose: "Supply the exact taxonomy, strategies, evaluators, and immutable agent versions used by both runs."
  - path: "implementation/artifacts/red-team/taxonomy-review-checklist.md"
    consumer: "The security, agent, and tool owners"
    operational_purpose: "Record the human review required before the generated taxonomy is approved for the red-team run."
  - path: "implementation/artifacts/red-team/safe-seed-examples.json"
    consumer: "The security owner and red-team operator"
    operational_purpose: "Show safe synthetic seed-objective structure while keeping harmful reusable prompts outside the repository."
  - path: "implementation/artifacts/governance/release-gate-mapping.md"
    consumer: "The security owner, release owner, and Session 13 validators"
    operational_purpose: "Define how red-team outcomes affect evaluation reruns, release eligibility, and non-overridable failures."
  - path: "implementation/artifacts/governance/risk-change-handoff.json"
    consumer: "The security owner, change owner, SOC owner, and comparison script"
    operational_purpose: "Record remediation, residual-risk disposition, Defender decision, change reference, and separate SOC delivery status."
  - path: "implementation/artifacts/reports/red-team-scorecard-template.json"
    consumer: "The release owner and security owner"
    operational_purpose: "Define the payload-free scorecard retained for aggregate ASR, run IDs, taxonomy reference, and release impact."
  - path: "implementation/artifacts/reports/evidence-retention-record.md"
    consumer: "The security, Defender, SOC, tool, and release owners"
    operational_purpose: "Keep the repository retention boundary explicit for red-team, Defender, and SOC records."
  - path: "implementation/artifacts/reports/before-after-report.json"
    consumer: "The release owner and Session 13 validators"
    operational_purpose: "Carry the payload-free per-risk comparison and release attestation without claiming SOC delivery."
  - path: "implementation/artifacts/defender/ai-alert-hunt.kql"
    consumer: "The SOC analyst"
    operational_purpose: "Query the approved Defender hunting surfaces for agent and model security records without copying payloads."
  - path: "implementation/artifacts/operations/soc-triage-playbook.md"
    consumer: "The SOC analyst and incident commander"
    operational_purpose: "Route triage, containment, escalation, and ownership for observed AI security signals."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The PowerShell-based red-team operator"
    operational_purpose: "Stop an unauthorized, unsupported, mismatched, unbounded, or payload-retaining run."
  - path: "implementation/scripts/preflight.sh"
    consumer: "The Bash-based red-team operator"
    operational_purpose: "Apply the same authorization, scope, plan, and privacy checks outside Windows."
  - path: "implementation/scripts/run-red-team.py"
    consumer: "The red-team operator"
    operational_purpose: "Run the bounded plan and write payload-free aggregates keyed by category, strategy, and evaluator."
  - path: "implementation/scripts/compare-runs.py"
    consumer: "The security owner, release owner, and Session 13 validators"
    operational_purpose: "Reject key-set differences, individual risk regressions, prohibited-action success, and malformed privacy records."
  - path: "implementation/scripts/requirements.txt"
    consumer: "The approved Python environment"
    operational_purpose: "Install bounded dependencies needed by preflight and the red-team runner."
sources:
  - title: "AI Red Teaming Agent"
    url: "https://learn.microsoft.com/en-us/azure/foundry/concepts/ai-red-teaming-agent"
    accessed: "2026-08-25"
    supports: "PyRIT-based probing, attack success rate, supported agentic risks and attack strategies, transient agent runs, redaction behavior, purple-environment guidance, and the requirement for human review."
  - title: "Run AI Red Teaming Agent in the cloud"
    url: "https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/run-ai-red-teaming-cloud"
    accessed: "2026-08-26"
    supports: "Current Microsoft Foundry SDK 2.x path, Foundry User prerequisite, exact agent target and taxonomy workflow, built-in agentic evaluators, attack-strategy fields, and the preview 2025-11-15 API."
  - title: "Rate limits, region support, and enterprise features for evaluation"
    url: "https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-regions-limits-virtual-network"
    accessed: "2026-08-26"
    supports: "The current cloud AI red-teaming region matrix, network-injection requirements, and Foundry User requirement for the project managed identity. Authorization records a manual pre-run support check because there is no available stable support-discovery API."
  - title: "Protect AI assets using Microsoft Defender"
    url: "https://learn.microsoft.com/en-us/defender-xdr/security-for-ai/defender-security-for-ai"
    accessed: "2026-08-25"
    supports: "Separate Defender coverage for Agent 365-managed agents and Azure AI infrastructure, including discovery, posture, runtime protection, detections, incidents, and hunting."
  - title: "Enable threat protection for AI services"
    url: "https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-onboarding"
    accessed: "2026-08-26"
    supports: "Subscription-level AI services threat protection, Owner or Contributor enablement requirement, optional suspicious-prompt evidence, and the separate paid Purview data-security component."
  - title: "Alerts for AI services"
    url: "https://learn.microsoft.com/en-us/azure/defender-for-cloud/alerts-ai-workloads"
    accessed: "2026-08-25"
    supports: "Current AI workload alert catalog, including jailbreak, ASCII-smuggling, credential-leakage, suspicious-access, anomalous-tool, and cost-abuse signals."
  - title: "Detect and investigate threats to AI agents using Microsoft Defender"
    url: "https://learn.microsoft.com/en-us/defender-xdr/security-for-ai/ai-agent-detection-protection"
    accessed: "2026-08-25"
    supports: "Public-preview Agent 365 threat detection, incident correlation, and the AlertInfo, AlertEvidence, CloudAppEvents, AgentsInfo, BehaviorInfo, and BehaviorEntities hunting surfaces."
  - title: "Enable security for AI agents using Microsoft Defender"
    url: "https://learn.microsoft.com/en-us/defender-xdr/security-for-ai/get-started-defender-security-for-ai"
    accessed: "2026-08-25"
    supports: "Agent 365 onboarding, required Microsoft 365 connector components for investigation, and the distinction between cloud-agent collection and Copilot Studio runtime protection."
