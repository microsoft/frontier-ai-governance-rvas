schema_version: 2
session:
  id: "07"
  slug: "apim-ai-gateway"
  title: "Azure API Management as the AI gateway"
  duration_minutes: 210
  status: "draft"
  last_verified: "2026-08-28"
  audience:
    - "AI platform and API Management engineers"
    - "Identity, application security, and safety engineers"
    - "Operations and service owners"
  prerequisites:
    - "Complete Sessions 01-04 in the approved nonproduction scope."
    - "Make an existing API Management instance with a system-assigned managed identity reachable from the approved execution host."
    - "Use Developer, Basic, Basic v2, Standard, Standard v2, Premium, or Premium v2. The selected tier must support llm-token-limit, llm-content-safety, backend pools, managed identity, products, subscriptions, and diagnostics."
    - "Give the deployment operator a time-bound Contributor role assignment on the exact nonproduction resource group that contains the API Management instance."
    - "Expose a pinned, Entra-authorized Responses endpoint from the Session 05 agent."
    - "Assign Foundry Agent Consumer, role ID eed3b665-ab3a-47b6-8f48-c9382fb1dad6, to the API Management system-assigned identity on the individual Session 05 agent."
    - "Configure an Azure AI Content Safety backend in API Management for managed-identity authentication."
    - "Assign Cognitive Services User, role ID a97b65f3-24c7-4388-baec-2e87135dc908, to the API Management system-assigned identity on that exact Azure AI Content Safety resource."
    - "Configure an existing Application Insights logger in API Management with managed-identity credentials."
    - "Approve and issue a Microsoft Entra application registration, app role, and workload-specific controlled APIM product subscription for the live check."
  dependencies:
    - "Session 02 - Entra identity, RBAC, PIM, and workload identities"
    - "Session 03 - Private networking, DNS, and controlled egress"
    - "Session 05 - Governed Microsoft Foundry agent baseline"
  services_in_scope:
    - "azure-api-management"
    - "azure-ai-foundry"
    - "azure-ai-content-safety"
    - "application-insights"
  control_objective: "Configure one API Management route that checks the client token and product subscription, applies approved limits and Content Safety policies, and uses managed identity to call the pinned Foundry agent."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Configure one version-controlled API Management API and controlled product for the governed Session 05 agent."
  - "Require a valid Microsoft Entra application identity at ingress. Use the API Management managed identity for the Foundry backend."
  - "Reject oversized requests and enforce token limits. Apply Content Safety, timeout, retry, circuit-breaker, and backend-selection controls before calling Foundry."
  - "Send correlation and token metrics to Application Insights without logging prompts or responses."
  - "Reject an invalid bearer identity at APIM before calling Content Safety or the Foundry agent."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/gateway/main.bicep"
    - "implementation/artifacts/gateway/apis/policy-assistant-responses.openapi.json"
    - "implementation/artifacts/gateway/policies/policy.xml"
    - "implementation/artifacts/governance/gateway-control.json"
    - "implementation/artifacts/governance/model-routing-decision.md"
    - "implementation/artifacts/environments/sandbox.json"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/deploy.ps1"
retained_files:
  - path: "implementation/artifacts/gateway/main.bicep"
    consumer: "The Session 07 APIM deployment scripts"
    operational_purpose: "Deploy and update the API, product, APIM named values, backends, diagnostics, and policy attachment."
  - path: "implementation/artifacts/gateway/apis/policy-assistant-responses.openapi.json"
    consumer: "The API Management API import"
    operational_purpose: "Define the client-facing POST responses operation and request format."
  - path: "implementation/artifacts/gateway/policies/policy.xml"
    consumer: "The API Management gateway runtime"
    operational_purpose: "Validate callers and apply size, token, safety, routing, managed-identity, and telemetry controls."
  - path: "implementation/artifacts/governance/gateway-control.json"
    consumer: "The Session 07 preflight and APIM deployment scripts"
    operational_purpose: "Supply the approved identity, limit, safety, routing, cache, and ownership decisions."
  - path: "implementation/artifacts/governance/model-routing-decision.md"
    consumer: "The API product, platform, safety, and operations owners"
    operational_purpose: "Record approved APIM routing modes, secondary backend activation criteria, preview boundaries, and regional token-counter ownership."
  - path: "implementation/artifacts/environments/sandbox.json"
    consumer: "The Session 07 preflight and deployment scripts"
    operational_purpose: "Bind every APIM action to the approved nonproduction resources and implementation marker."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The API Management deployment operator"
    operational_purpose: "Check the APIM scope, identity roles, policy inputs, collisions, and ARM what-if before deployment."
  - path: "implementation/scripts/deploy.ps1"
    consumer: "The API Management deployment operator"
    operational_purpose: "Deploy the marked Session 07 child resources into the existing APIM service."
sources:
  - title: "AI gateway capabilities in Azure API Management"
    url: "https://learn.microsoft.com/en-us/azure/api-management/genai-gateway-capabilities"
    accessed: "2026-08-26"
    supports: "The AI gateway is an API Management capability set; supported backends, tier-dependent availability, token controls, safety policies, routing, and observability."
  - title: "Configure and share your Microsoft Foundry agent"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/configure-agent"
    accessed: "2026-08-25"
    supports: "Current stable Responses endpoint pattern, Entra authorization, fixed-version routing, and Foundry Agent Consumer for endpoint-only access."
  - title: "Role-based access control for Microsoft Foundry"
    url: "https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry"
    accessed: "2026-08-26"
    supports: "Foundry Agent Consumer scope and stable role definition ID eed3b665-ab3a-47b6-8f48-c9382fb1dad6 for agent endpoint invocation."
  - title: "Authenticate and Authorize to LLM APIs"
    url: "https://learn.microsoft.com/en-us/azure/api-management/api-management-authenticate-authorize-ai-apis"
    accessed: "2026-08-25"
    supports: "Microsoft Entra ingress authorization, managed-identity backend authentication, and policy ordering."
  - title: "Validate Microsoft Entra token policy"
    url: "https://learn.microsoft.com/en-us/azure/api-management/validate-azure-ad-token-policy"
    accessed: "2026-08-25"
    supports: "Current validate-azure-ad-token syntax for tenant, client application, audience, app-role claim, and 401 rejection."
  - title: "LLM token limit policy"
    url: "https://learn.microsoft.com/en-us/azure/api-management/llm-token-limit-policy"
    accessed: "2026-08-28"
    supports: "Current Responses API token-rate and quota syntax, status codes, gateway-local counters, and estimated prompt and completion counts for streaming requests."
  - title: "LLM content safety policy"
    url: "https://learn.microsoft.com/en-us/azure/api-management/llm-content-safety-policy"
    accessed: "2026-08-28"
    supports: "Current Prompt Shields and harm-category policy syntax, required Content Safety backend, managed-identity access, supported tiers, and streaming behavior that stops forwarding later events without returning a normal 403."
  - title: "Azure API Management Backends"
    url: "https://learn.microsoft.com/en-us/azure/api-management/backends"
    accessed: "2026-08-25"
    supports: "Backend entities, managed-identity authorization, circuit breakers, backend pools, and priority routing."
  - title: "LLM token metric policy"
    url: "https://learn.microsoft.com/en-us/azure/api-management/llm-emit-token-metric-policy"
    accessed: "2026-08-28"
    supports: "Current Application Insights token metric policy, supported API schemas, include_usage guidance for streaming responses, custom-dimension limits, and interrupted-stream accuracy limits."
  - title: "Understand Cost Management data"
    url: "https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/understand-cost-mgt-data"
    accessed: "2026-08-28"
    supports: "Azure Cost Management processes Azure service usage and charges, while invoiced charges become the final billing record after the billing period closes."
  - title: "Integrate Azure API Management with Application Insights"
    url: "https://learn.microsoft.com/en-us/azure/api-management/api-management-howto-app-insights"
    accessed: "2026-08-25"
    supports: "Application Insights logger and API diagnostic configuration with managed-identity credentials."
  - title: "Configure AI Gateway in your Foundry resources"
    url: "https://learn.microsoft.com/en-us/azure/foundry/configuration/enable-ai-api-management-gateway-portal"
    accessed: "2026-08-27"
    supports: "Foundry portal setup for AI Gateway uses Azure API Management behind the scenes for token limits, quotas, and model-deployment governance."
  - title: "Microsoft.ApiManagement service APIs diagnostics 2024-05-01"
    url: "https://learn.microsoft.com/en-us/azure/templates/microsoft.apimanagement/2024-05-01/service/apis/diagnostics"
    accessed: "2026-08-25"
    supports: "Stable Bicep diagnostic resource fields for W3C correlation, body byte limits, sampling, metrics, and header logging."
  - title: "Azure built-in roles for Privileged"
    url: "https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/privileged"
    accessed: "2026-08-26"
    supports: "Contributor can create and manage resources but cannot create role assignments; this session assigns it only on the exact nonproduction API Management resource group."
