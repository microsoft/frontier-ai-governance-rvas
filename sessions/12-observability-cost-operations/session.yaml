schema_version: 2
session:
  id: "12"
  slug: "observability-cost-operations"
  title: "Observability, cost, and operational controls"
  duration_minutes: 210
  status: "draft"
  last_verified: "2026-08-28"
  audience:
    - "Microsoft Foundry agent and platform engineers"
    - "Azure Monitor, API Management, security operations, and FinOps operators"
    - "Observability, AI quality, data-protection, and service owners"
  prerequisites:
    - "Complete Sessions 04, 07, and 09-11, or verify their runtime, tracing, evaluation, and security controls with the named owners and observable checks in the implementation guide."
    - "Record the agent type's tracing status before implementation. Foundry tracing is generally available for prompt and hosted agents. Workflow and external agents remain preview and need an approved preview-use decision."
    - "The Session 04 nonproduction policy assistant and Session 07 API Management route support an approved read-only request and a separate handled failure for a nonexistent synthetic policy. The failure route returns a tool failure while the model keeps its own result."
    - "A workspace-based Application Insights resource, Log Analytics workspace, action group, and approved data-retention boundary exist."
    - "Application instrumentation is deployed. The application, gateway, agent, and tool preserve W3C trace context plus one non-sensitive correlation ID. The gateway owner has merged correlation and bounded token metrics into the customer-owned API Management policy source."
    - "Baseline telemetry has been reviewed before alert thresholds are chosen."
    - "The deployment operator has Monitoring Contributor at the exact deployment resource-group scope and Log Analytics Reader at the exact workspace scope. If Application Insights or the action group is outside that group, the operator also has Monitoring Reader at each exact resource scope."
    - "The same operator has Cost Management Contributor at the exact subscription scope. Human access lasts through preflight, deployment, and confirmation, then expires or is removed through the approved access process."
    - "The observability, application, gateway, tool, security operations, AI quality, data-protection, cost, and service owners are present or have delegated decisions."
  dependencies:
    - "Session 04 - Governed Microsoft Foundry agent baseline"
    - "Session 07 - Azure API Management AI gateway implementation"
    - "Session 09 - MCP and tool security"
    - "Session 05 - Microsoft Agent 365 secure rollout and data controls"
    - "Session 10 - Foundry evaluations and release quality gates"
    - "Session 11 - Red teaming, prompt injection, and Defender"
  services_in_scope:
    - "azure-monitor"
    - "application-insights"
    - "log-analytics"
    - "azure-cost-management"
    - "microsoft-defender-xdr"
  control_objective: "Deploy privacy-safe operating controls for one governed service. Correlate supported runtime spans, route alerts, notify owners at budget thresholds, and follow incident paths with named owners."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Keep a privacy-safe OpenTelemetry definition that joins supported gateway, agent, model, and tool spans with one non-sensitive correlation ID while excluding prompt and response content by default."
  - "Deploy a workbook and three alert rules over the approved Application Insights scope."
  - "Emit bounded APIM token metrics, keep low-cardinality cost allocation, and deploy subscription budget notifications that do not stop spend."
  - "Keep the retention, content-logging, cost-allocation, and incident records used by their named owners."
  - "Run the paired Session 12 smoke check from the Session 13 GitHub promotion workflow and keep its payload-free result only in the runner's temporary workspace."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/telemetry/telemetry-contract.json"
    - "implementation/artifacts/infra/main.bicep"
    - "implementation/artifacts/infra/main.bicepparam"
    - "implementation/artifacts/monitoring/workbook.json"
    - "implementation/artifacts/queries/request-error-rate-alert.kql"
    - "implementation/artifacts/queries/tool-failure-alert.kql"
    - "implementation/artifacts/queries/quality-safety-alert.kql"
    - "implementation/artifacts/cost/budget.bicep"
    - "implementation/artifacts/cost/budget.bicepparam"
    - "implementation/artifacts/cost/cost-allocation.md"
    - "implementation/artifacts/governance/data-retention-decision.md"
    - "implementation/artifacts/governance/prompt-response-logging-decision.md"
    - "implementation/artifacts/operations/incident-runbook.md"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
    - "implementation/scripts/smoke.ps1"
    - "implementation/scripts/smoke.sh"
retained_files:
  - path: "implementation/artifacts/telemetry/telemetry-contract.json"
    consumer: "Application developers, the observability owner, and preflight scripts"
    operational_purpose: "Define correlation, spans, safe attributes, sampling, and banned payload fields."
  - path: "implementation/artifacts/infra/main.bicep"
    consumer: "The Azure deployment pipeline"
    operational_purpose: "Deploy the workbook and three scheduled-query alerts to the approved resource group."
  - path: "implementation/artifacts/infra/main.bicepparam"
    consumer: "The Azure deployment pipeline"
    operational_purpose: "Supply approved resource IDs, names, thresholds, and action-group inputs for the monitoring deployment."
  - path: "implementation/artifacts/monitoring/workbook.json"
    consumer: "Operators and the workbook deployment"
    operational_purpose: "Provide operational, correlation, cost, tool-failure, and quality views with embedded operator queries."
  - path: "implementation/artifacts/queries/request-error-rate-alert.kql"
    consumer: "The request-error scheduled-query alert"
    operational_purpose: "Calculate the operational request error-rate signal consumed by Bicep."
  - path: "implementation/artifacts/queries/tool-failure-alert.kql"
    consumer: "The tool-failure scheduled-query alert"
    operational_purpose: "Calculate the operational tool-failure signal consumed by Bicep."
  - path: "implementation/artifacts/queries/quality-safety-alert.kql"
    consumer: "The quality and safety scheduled-query alert"
    operational_purpose: "Calculate the operational quality and safety signal consumed by Bicep."
  - path: "implementation/artifacts/cost/budget.bicep"
    consumer: "The subscription deployment pipeline and cost owner"
    operational_purpose: "Deploy the approved actual and forecast budget notifications."
  - path: "implementation/artifacts/cost/budget.bicepparam"
    consumer: "The subscription deployment pipeline"
    operational_purpose: "Supply the approved budget amount, dates, contacts, and notification thresholds."
  - path: "implementation/artifacts/cost/cost-allocation.md"
    consumer: "The cost owner"
    operational_purpose: "Record the required resource tags, the pricing-source owner, and how operators interpret the cost estimate."
  - path: "implementation/artifacts/governance/data-retention-decision.md"
    consumer: "The observability owner"
    operational_purpose: "Record the customer-selected Application Insights retention and legal-hold boundary."
  - path: "implementation/artifacts/governance/prompt-response-logging-decision.md"
    consumer: "The privacy and observability owners"
    operational_purpose: "Keep standard content logging disabled or record the bounded approved exception."
  - path: "implementation/artifacts/operations/incident-runbook.md"
    consumer: "The incident commander and service operators"
    operational_purpose: "Provide containment and recovery steps for unsafe output, tool compromise, runaway use, and model degradation."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The PowerShell-based observability operator"
    operational_purpose: "Stop deployment when scope, telemetry, privacy, cost, alert, or required decision checks are invalid."
  - path: "implementation/scripts/preflight.sh"
    consumer: "The Bash-based observability operator"
    operational_purpose: "Apply the same readiness, privacy, cost, alert, and required decision checks outside Windows."
  - path: "implementation/scripts/smoke.ps1"
    consumer: "The named Session 13 GitHub promotion workflow"
    operational_purpose: "Read live telemetry for the release check and write a payload-free result to the GitHub runner's temporary workspace for immediate workflow consumption."
  - path: "implementation/scripts/smoke.sh"
    consumer: "The named Session 13 GitHub promotion workflow"
    operational_purpose: "Read live telemetry for the release check and write a payload-free result to the GitHub runner's temporary workspace for immediate workflow consumption."
sources:
  - title: "Observability in Generative AI"
    url: "https://learn.microsoft.com/en-us/azure/foundry/concepts/observability"
    accessed: "2026-08-26"
    supports: "Foundry observability combines evaluation, production monitoring, Azure Monitor Application Insights, OpenTelemetry tracing, operational metrics, token consumption, quality, safety, and alerts."
  - title: "Trace agent overview"
    url: "https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept"
    accessed: "2026-08-26"
    supports: "Foundry tracing uses OpenTelemetry across model and tool calls; tracing is generally available for prompt and hosted agents, while workflow and external agents remain preview."
  - title: "Configuring OpenTelemetry in Application Insights"
    url: "https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-configuration"
    accessed: "2026-08-25"
    supports: "Current Azure Monitor OpenTelemetry configuration, connection-string handling, cloud role naming, filtering, and per-language sampling options."
  - title: "Sampling in Azure Application Insights with OpenTelemetry"
    url: "https://learn.microsoft.com/en-us/azure/azure-monitor/app/opentelemetry-sampling"
    accessed: "2026-08-25"
    supports: "Fixed-rate and rate-limited source sampling, complete-trace preservation, unsampled metrics, trace-based log sampling, validation, and daily-cap cautions."
  - title: "Azure API Management policy reference - llm-emit-token-metric"
    url: "https://learn.microsoft.com/en-us/azure/api-management/llm-emit-token-metric-policy"
    accessed: "2026-08-28"
    supports: "The policy applies to all APIM tiers, requires an Application Insights integration with custom metrics enabled, allows at most five custom dimensions, and can report incomplete counts for interrupted streams."
  - title: "Azure API Management policy reference - emit-metric"
    url: "https://learn.microsoft.com/en-us/azure/api-management/emit-metric-policy"
    accessed: "2026-08-28"
    supports: "API Management limits each metric dimension to 100 unique values and each metric namespace to 1,000 active time series; new values and series beyond those limits are not tracked, and their metric data is silently discarded."
  - title: "Azure Workbooks overview"
    url: "https://learn.microsoft.com/en-us/azure/azure-monitor/visualize/workbooks-overview"
    accessed: "2026-08-26"
    supports: "Workbooks combine log queries, metrics, parameters, text, and visualizations; Monitoring Reader supports viewing and Monitoring Contributor supports saving shared workbooks."
  - title: "Create Azure Monitor log search alert rules"
    url: "https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-create-log-alert-rule"
    accessed: "2026-08-26"
    supports: "Creating a log search alert requires read on its target, write on the alert-rule resource group, and read on its action group."
  - title: "Create and manage budgets"
    url: "https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/tutorial-acm-create-budgets"
    accessed: "2026-08-28"
    supports: "Cost Management Contributor can create and manage subscription budgets; budget evaluation uses cost data that normally lags 8-24 hours, and notifications do not stop resources."
  - title: "Ingest cost details data"
    url: "https://learn.microsoft.com/en-us/azure/cost-management-billing/automate/automation-ingest-usage-details-overview"
    accessed: "2026-08-28"
    supports: "Cost details are the granular Cost Management records used to reconcile the bill, and the Azure billing system uses those records to generate the bill."
  - title: "Azure built-in roles for Monitor"
    url: "https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/monitor"
    accessed: "2026-08-26"
    supports: "Monitoring Contributor includes monitoring-resource writes and deployment operations; Monitoring Reader and Log Analytics Reader provide the read paths used by this session."
