schema_version: 2
session:
  id: "03"
  slug: "model-governance-lifecycle"
  title: "Model governance, data residency, quota, and lifecycle"
  duration_minutes: 150
  status: "draft"
  last_verified: "2026-08-28"
  audience:
    - "AI product owners and AI engineers"
    - "Cloud engineers who run Microsoft Foundry"
    - "Data, privacy, procurement, and security reviewers"
  prerequisites:
    - "An `AIServices` Microsoft Foundry resource and project exist in the approved nonproduction subscription and resource group. The platform owner confirms their names and that the approved execution host reaches the project through the recorded private path. (Sessions 01-02.)"
    - "Record the existing Microsoft Foundry resource and project names, and confirm that the resource `kind` is `AIServices`."
    - "Give the deployment operator time-bound Cognitive Services Contributor on the exact Microsoft Foundry resource."
    - "The model decision authority approves the exact model coordinates, workload purpose, processing-location requirement, and external decision reference through the customer model-change process."
    - "Confirm that the platform owner can read model availability and quota, and that the named Responsible AI policy exists under the exact Foundry resource."
  dependencies:
    - "Session 01 - Microsoft Foundry platform baseline, inventory, and landing-zone guardrails"
    - "Session 02 - Private networking, DNS, and controlled egress"
  services_in_scope:
    - "azure-ai-foundry"
    - "azure-openai"
  control_objective: "Deploy exact approved serverless API model versions through version-controlled deployment profiles, preflight checks, and Bicep. Meet the workload's processing-location requirement."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Record the approval reference and exact model deployment settings in the Bicep input."
  - "Check scope, access, model lifecycle, Responsible AI policy, processing location, live quota, and the Bicep preview before deployment."
  - "Deploy the approved serverless API model version and confirm that the live child deployment matches the profile."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/infra/models/main.bicep"
    - "implementation/artifacts/environments/sandbox.bicepparam"
    - "implementation/artifacts/models/deployment-profiles.json"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
retained_files:
  - path: "implementation/artifacts/infra/models/main.bicep"
    consumer: "The Azure deployment pipeline operated by the Foundry platform team"
    operational_purpose: "Create or update approved model child deployments under the existing AIServices resource."
  - path: "implementation/artifacts/environments/sandbox.bicepparam"
    consumer: "The Azure deployment pipeline operated by the Foundry platform team"
    operational_purpose: "Name the nonproduction AIServices resource for the Bicep deployment."
  - path: "implementation/artifacts/models/deployment-profiles.json"
    consumer: "The Session 03 Bicep entrypoint and preflight scripts"
    operational_purpose: "Supply each deployment's approval reference, model, SKU, capacity, filter, processing location, review date, quota headroom, and fixed no-auto-upgrade setting."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The PowerShell-based Foundry deployment operator"
    operational_purpose: "Stop a model change when approval, scope, access, live lifecycle, location, quota, Bicep, or what-if checks fail."
  - path: "implementation/scripts/preflight.sh"
    consumer: "The Bash-based Foundry deployment operator"
    operational_purpose: "Stop a model change when approval, scope, access, live lifecycle, location, quota, Bicep, or what-if checks fail."
sources:
  - title: "Microsoft Foundry Models overview"
    url: "https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview"
    accessed: "2026-08-25"
    supports: "Current model catalog categories, support and terms differences, customer responsibilities, and model comparison capabilities."
  - title: "Foundry Models sold by Azure"
    url: "https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure"
    accessed: "2026-08-25"
    supports: "Current model capabilities, deployment types, lifecycle filtering, and regional availability references."
  - title: "Understanding deployment types in Microsoft Foundry Models"
    url: "https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types"
    accessed: "2026-08-28"
    supports: "Global, US/EU/APAC Data Zone, regional, provisioned, batch, and DeveloperTier behavior, SKU names, billing, latency, and processing-location implications."
  - title: "Data, privacy, and security for Foundry Models sold by Azure"
    url: "https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/openai/data-privacy"
    accessed: "2026-08-25"
    supports: "Data-at-rest location, inference processing location for Global and Data Zone deployments, service data use, and stateful feature storage."
  - title: "Deploy models using Azure CLI and Bicep"
    url: "https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/create-model-deployments"
    accessed: "2026-08-26"
    supports: "Current Azure CLI prerequisites, Cognitive Services Contributor at Foundry resource scope, AIServices resource creation, model discovery, deployment fields, deployment commands, and Bicep pattern."
  - title: "Microsoft.CognitiveServices accounts deployments 2026-05-01"
    url: "https://learn.microsoft.com/en-us/azure/templates/microsoft.cognitiveservices/2026-05-01/accounts/deployments"
    accessed: "2026-08-25"
    supports: "Stable Bicep resource API and properties for model, SKU capacity, tags, and version upgrade behavior."
  - title: "Microsoft.CognitiveServices accounts/raiPolicies 2026-05-01"
    url: "https://learn.microsoft.com/en-us/azure/templates/microsoft.cognitiveservices/2026-05-01/accounts/raipolicies"
