schema_version: 2
session:
  id: "04"
  slug: "model-governance-lifecycle"
  title: "Model governance, data residency, quota, and lifecycle"
  duration_minutes: 210
  status: "draft"
  last_verified: "2026-08-26"
  audience:
    - "AI product owners and AI engineers"
    - "Cloud and Microsoft Foundry platform engineers"
    - "Data, privacy, procurement, and security reviewers"
  prerequisites:
    - "Sessions 01-02 are complete in the approved nonproduction subscription and resource group."
    - "The existing Microsoft Foundry resource and project names are recorded, and the approved execution host reaches that Foundry resource through the Session 03 private path."
    - "The existing Microsoft Foundry resource has the Azure resource property `kind` set to `AIServices`."
    - "The deployment operator has a time-bound Cognitive Services Contributor role assignment on that exact Microsoft Foundry resource."
    - "The customer's normal review process has approved the exact model coordinates, workload purpose, processing-location requirement, and external decision reference."
    - "The platform owner can read model availability and quota for the approved subscription and Foundry resource."
  dependencies:
    - "Session 01 - Microsoft Foundry platform baseline, inventory, and landing-zone guardrails"
    - "Session 02 - Entra identity, RBAC, PIM, and workload identities"
    - "Session 03 - Private networking, DNS, and controlled egress"
  services_in_scope:
    - "azure-ai-foundry"
    - "azure-openai"
  control_objective: "Teams use a controlled, versioned path to deploy exact approved serverless API model versions that meet the workload's processing-location requirement."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Record the exact approved model coordinates, workload purpose, decision route, processing-location requirement, lifecycle owner, and review date in one governance record."
  - "Keep each deployment's desired model, SKU, capacity, content filter, and fixed no-auto-upgrade setting in the Bicep input file."
  - "Check the approval record against the deployment plan, live model availability and lifecycle data, operator access, quota where the CLI can match it safely, and the Bicep preview."
  - "Deploy at least one approved serverless API model version in the existing Foundry resource. The live child deployment must match the approved plan."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/infra/models/main.bicep"
    - "implementation/artifacts/environments/sandbox.bicepparam"
    - "implementation/artifacts/models/deployment-profiles.json"
    - "implementation/artifacts/governance/model-approval-record.json"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
retained_files:
  - path: "implementation/artifacts/infra/models/main.bicep"
    consumer: "The Azure deployment pipeline operated by the Foundry platform team"
    operational_purpose: "Create or reconcile the approved model child deployments under the existing AIServices resource."
  - path: "implementation/artifacts/environments/sandbox.bicepparam"
    consumer: "The Azure deployment pipeline operated by the Foundry platform team"
    operational_purpose: "Bind the Bicep deployment to the nonproduction AIServices resource recorded in the environment parameters."
  - path: "implementation/artifacts/models/deployment-profiles.json"
    consumer: "The Session 04 Bicep entrypoint and preflight scripts"
    operational_purpose: "Supply the repository-owned model, SKU, capacity, filter, and fixed no-auto-upgrade state for each child deployment."
  - path: "implementation/artifacts/governance/model-approval-record.json"
    consumer: "The model lifecycle owner and Session 04 preflight scripts"
    operational_purpose: "Bind each deployment to its approved model coordinates, purpose, authority, location requirement, review date, and change route."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The PowerShell-based Foundry deployment operator"
    operational_purpose: "Stop a model change when approval, scope, access, live lifecycle, location, quota, Bicep, or what-if checks fail."
  - path: "implementation/scripts/preflight.sh"
    consumer: "The Bash-based Foundry deployment operator"
    operational_purpose: "Stop a model change when approval, scope, access, live lifecycle, location, quota, Bicep, or what-if checks fail."
sources:
  - title: "Microsoft Foundry Models overview"
    url: "https://learn.microsoft.com/en-us/azure/foundry/concepts/foundry-models-overview"
    accessed: "2026-08-25"
    supports: "Current model catalog categories, support and terms differences, customer responsibilities, and model comparison capabilities."
  - title: "Foundry Models sold by Azure"
    url: "https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure"
    accessed: "2026-08-25"
    supports: "Current model capabilities, deployment types, lifecycle filtering, and regional availability references."
  - title: "Understanding deployment types in Microsoft Foundry Models"
    url: "https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types"
    accessed: "2026-08-25"
    supports: "Global, Data Zone, regional, provisioned, batch, and developer deployment behavior, SKU names, billing, latency, and processing-location implications."
  - title: "Data, privacy, and security for Foundry Models sold by Azure"
    url: "https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/openai/data-privacy"
    accessed: "2026-08-25"
    supports: "Data-at-rest location, inference processing location for Global and Data Zone deployments, service data use, and stateful feature storage."
