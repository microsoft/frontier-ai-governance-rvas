schema_version: 2
session:
  id: "06"
  slug: "citadel-observability-operations"
  title: "Operate Citadel telemetry, cost, and incidents"
  duration_minutes: 240
  status: "draft"
  last_verified: "2026-09-04"
  audience:
    - "AI platform, observability, SRE, and FinOps engineers"
    - "Privacy, security operations, and incident owners"
  prerequisites:
    - "Session 02 has deployed the Citadel Governance Hub and its approved Application Insights, Log Analytics, Event Hubs, Cosmos DB, and Logic Apps path."
    - "Session 04 has produced a workload-specific access contract whose traffic can be separated by product, subscription, agent, model, and tool."
    - "The privacy and operations owners have approved prompt and response logging, data retention, export, alert, budget, and incident-routing decisions."
  dependencies:
    - "Session 02 - Deploy the Citadel Governance Hub"
    - "Session 04 - Govern Citadel backends, access, tools, and agents"
  services_in_scope:
    - "azure-monitor"
    - "application-insights"
    - "log-analytics"
    - "azure-cost-management"
    - "azure-logic-apps"
  control_objective: "Configure Citadel telemetry, alerts, budgets, and incident ownership without retaining unapproved prompt or response content."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Record the telemetry contract, payload boundary, retention period, export path, and cost-allocation keys."
  - "Deploy the workload workbook, alerts, and budget against the approved Citadel monitoring resources."
  - "Separate gateway, model, agent, and tool failures with shared correlation identifiers."
  - "Run one synthetic smoke path and confirm the expected traces, alert dimensions, and budget scope."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/telemetry/telemetry-contract.json"
    - "implementation/artifacts/governance/data-retention-decision.md"
    - "implementation/artifacts/governance/prompt-response-logging-decision.md"
    - "implementation/artifacts/infra/main.bicep"
    - "implementation/artifacts/infra/main.bicepparam"
    - "implementation/artifacts/monitoring/workbook.json"
    - "implementation/artifacts/queries/request-error-rate-alert.kql"
    - "implementation/artifacts/queries/tool-failure-alert.kql"
    - "implementation/artifacts/queries/quality-safety-alert.kql"
    - "implementation/artifacts/cost/budget.bicep"
    - "implementation/artifacts/cost/budget.bicepparam"
    - "implementation/artifacts/cost/cost-allocation.md"
    - "implementation/artifacts/operations/incident-runbook.md"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
    - "implementation/scripts/smoke.ps1"
    - "implementation/scripts/smoke.sh"
retained_files:
  - path: "implementation/artifacts/telemetry/telemetry-contract.json"
    consumer: "Citadel telemetry pipeline and smoke scripts"
    operational_purpose: "Define required dimensions, prohibited attributes, correlation fields, and export transport."
  - path: "implementation/artifacts/governance/data-retention-decision.md"
    consumer: "privacy and operations owners"
    operational_purpose: "Record retention, deletion, access, and export decisions for Citadel telemetry."
  - path: "implementation/artifacts/governance/prompt-response-logging-decision.md"
    consumer: "APIM and privacy owners"
    operational_purpose: "Record whether prompt and response bodies remain disabled or use an approved bounded exception."
  - path: "implementation/artifacts/infra/main.bicep"
    consumer: "Citadel operations deployment pipeline"
    operational_purpose: "Deploy the workbook and alert rules against existing hub monitoring resources."
  - path: "implementation/artifacts/infra/main.bicepparam"
    consumer: "Citadel operations deployment pipeline"
    operational_purpose: "Supply approved monitoring resource IDs, action groups, and alert settings."
  - path: "implementation/artifacts/monitoring/workbook.json"
    consumer: "shared Azure Workbook"
    operational_purpose: "Render gateway, agent, model, tool, quality, and cost views."
  - path: "implementation/artifacts/queries/request-error-rate-alert.kql"
    consumer: "Azure Monitor alert rules"
    operational_purpose: "Detect request and gateway error-rate changes."
  - path: "implementation/artifacts/queries/tool-failure-alert.kql"
    consumer: "Azure Monitor alert rules"
    operational_purpose: "Detect tool failures and separate them from model failures."
  - path: "implementation/artifacts/queries/quality-safety-alert.kql"
    consumer: "Azure Monitor alert rules"
    operational_purpose: "Detect active quality and safety threshold breaches."
  - path: "implementation/artifacts/cost/budget.bicep"
    consumer: "Citadel operations deployment pipeline"
    operational_purpose: "Deploy the approved Azure budget and notifications."
  - path: "implementation/artifacts/cost/budget.bicepparam"
    consumer: "Citadel operations deployment pipeline"
    operational_purpose: "Supply the cost scope, amount, thresholds, and contacts."
  - path: "implementation/artifacts/cost/cost-allocation.md"
    consumer: "FinOps and platform owners"
    operational_purpose: "Define how Citadel contract and resource dimensions map usage to owners."
  - path: "implementation/artifacts/operations/incident-runbook.md"
    consumer: "SRE, platform, and security operations teams"
    operational_purpose: "Guide incident triage, containment, communication, and restore."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "PowerShell-based operations operator"
    operational_purpose: "Reject unresolved retention, logging, monitoring, alert, budget, or access decisions."
  - path: "implementation/scripts/preflight.sh"
    consumer: "Bash-based operations operator"
    operational_purpose: "Apply the same Citadel operations checks outside Windows."
  - path: "implementation/scripts/smoke.ps1"
    consumer: "PowerShell-based release and operations workflow"
    operational_purpose: "Run the bounded synthetic request and verify payload-free correlated telemetry."
  - path: "implementation/scripts/smoke.sh"
    consumer: "Bash-based release and operations workflow"
    operational_purpose: "Run the same synthetic Citadel smoke check outside Windows."
sources:
  - title: "Citadel platform observability guide"
    url: "https://github.com/Azure-Samples/ai-hub-gateway-solution-accelerator/blob/citadel-v1/guides/platform-observability-guide.md"
    accessed: "2026-09-04"
    supports: "Citadel gateway telemetry, usage ingestion, dashboards, and operational data flow."
  - title: "Monitor Azure OpenAI"
    url: "https://learn.microsoft.com/azure/ai-services/openai/how-to/monitoring"
    accessed: "2026-09-04"
    supports: "Current Azure Monitor metrics, diagnostic settings, and logging considerations for model traffic."
  - title: "Cost Management budgets"
    url: "https://learn.microsoft.com/azure/cost-management-billing/costs/tutorial-acm-create-budgets"
    accessed: "2026-09-04"
    supports: "Budget scope, thresholds, notifications, and operational behavior."
