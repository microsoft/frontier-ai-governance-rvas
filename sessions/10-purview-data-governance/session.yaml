    url: "https://learn.microsoft.com/en-us/purview/ai-agent-365"
    accessed: "2026-08-26"
    supports: "Agent 365 Purview capability coverage, explicit policy targeting of agent instances, supported DLP interaction directions and locations, encrypted-label rights, audit coverage, and the lack of automatic label inheritance for newly created content."
  - title: "Use Microsoft Purview to manage data security and compliance for Microsoft Foundry"
    url: "https://learn.microsoft.com/en-us/purview/ai-azure-foundry"
    accessed: "2026-08-25"
    supports: "Foundry Purview enablement routes, pay-as-you-go requirements for policy management, Audit inclusion, user-context requirements, and the narrower current DLP integration surface."
  - title: "Microsoft Purview data security and compliance protections for Microsoft 365 Copilot and other generative AI apps"
    url: "https://learn.microsoft.com/en-us/purview/ai-microsoft-purview"
    accessed: "2026-08-25"
    supports: "Current separation of Copilot experiences and agents, Enterprise AI apps such as Microsoft Foundry, and other detected AI apps across DSPM and Purview controls."
  - title: "Audit log activities"
    url: "https://learn.microsoft.com/en-us/purview/audit-log-activities"
    accessed: "2026-08-25"
