schema_version: 2
session:
  id: "10"
  slug: "purview-data-governance"
  title: "Purview data governance and Agent 365 data controls"
  duration_minutes: 240
  status: "draft"
  last_verified: "2026-08-26"
  audience:
    - "Data owners and Microsoft Purview administrators"
    - "Microsoft Agent 365 and Microsoft Foundry platform owners"
    - "Compliance, security, and AI application engineers"
  prerequisites:
    - "Sessions 01-09 are complete in the full engagement path. For a focused route, confirm the platform inventory lists the exact nonproduction Foundry resource, Foundry project, policy-assistant agent, and Agent 365 instance."
    - "For a focused route, confirm the access inventory lists the assignment scope for each Foundry and Agent 365 identity."
    - "For a focused route, confirm the tool control record lists the get_policy allowlist, backend role definition ID, backend assignment scope, and prohibited-write decision. Before this session starts, a read of the labelled synthetic item succeeds and the prohibited write is absent or denied."
    - "One nonproduction Agent 365 instance and one test user group are approved for a scoped DLP policy."
    - "The Session 06 Microsoft Foundry policy assistant and its Azure subscription are available for separate Purview coverage review."
    - "The synthetic governance data set contains a labelled item suitable for a prohibited-sharing check."
    - "The data owner has approved the label, encryption rights, DLP action, locations, and restore route."
    - "Required Purview, Agent 365, Audit, DLP, eDiscovery, and pay-as-you-go entitlements have been confirmed."
    - "The DLP and label operator is a member of the Compliance Data Administrator role group in the approved Microsoft 365 tenant."
    - "The audit-query operator has the View-Only Audit Logs role in both Microsoft Purview and the Exchange admin center, and the Microsoft Graph application used for Audit Search has the approved `AuditLogsQuery.Read.All` application permission with administrator consent."
    - "Exchange Online and Security & Compliance PowerShell are connected to the approved Microsoft 365 tenant."
  dependencies:
    - "Session 01 - Microsoft Foundry platform baseline and inventory"
    - "Session 03 - Entra identity, RBAC, PIM, and workload identities"
    - "Session 06 - Governed Microsoft Foundry agent baseline"
  services_in_scope:
    - "microsoft-purview"
    - "agent-365"
    - "azure-ai-foundry"
  control_objective: "Maintain a customer-owned coverage handoff that records the Agent 365 and Foundry control split, confirm the approved label on the synthetic source, configure one scoped Agent 365 DLP policy, and query payload-free Agent 365 audit activity."
implementation:
  mode: "extended"
  extended_reason: "DLP propagation separates configuration and simulation from live confirmation, so the delivery owner waits the deployment.propagationAllowanceHours value, then observes the intended policy result and a one-coordinate out-of-scope non-match before keeping the policy enabled."
implementation_outcomes:
  - "Maintain one owned coverage handoff that separates live-query results from manual Purview, Agent 365, DLP, label, source-access, and DSPM checks."
  - "Reuse an approved sensitivity label and confirm the Agent 365 instance has explicit VIEW and EXTRACT rights when encryption applies."
  - "Configure and simulate one nonproduction DLP policy, then confirm it after the approved propagation window."
  - "Keep a payload-free Agent 365 audit query in the operations repository using the current unified audit log operation names."
  - "One labelled synthetic interaction is blocked or audited. Repeat it with exactly one approved coordinate changed to prove a non-match, and record how newly generated content is labelled."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/governance/coverage-handoff.md"
    - "implementation/artifacts/operations/agent-activity-audit-query.json"
    - "implementation/artifacts/purview/agent365-dlp-policy-template.json"
    - "implementation/artifacts/purview/dspm-findings-summary.md"
    - "implementation/artifacts/purview/retained-evidence-checklist.md"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/query-agent-activity.ps1"
retained_files:
  - path: "implementation/artifacts/governance/coverage-handoff.md"
    consumer: "The data, information protection, Agent 365, Foundry, and audit owners"
    operational_purpose: "Maintain one owned boundary for product coverage, label decisions, source access, DSPM review, DLP scope, and manual checks."
  - path: "implementation/artifacts/operations/agent-activity-audit-query.json"
    consumer: "The Agent 365 audit-query scripts"
    operational_purpose: "Define the agent scope, operation filters, lookback, Graph permission, and payload-free output fields."
  - path: "implementation/artifacts/purview/agent365-dlp-policy-template.json"
    consumer: "The Purview DLP operator"
    operational_purpose: "Translate the approved Agent 365 DLP scope, label, action, mode, and incident owner into the portal configuration."
  - path: "implementation/artifacts/purview/dspm-findings-summary.md"
    consumer: "The data, Agent 365, and information protection owners"
    operational_purpose: "Record owner decisions for DSPM for AI findings without retaining raw activity or source data."
  - path: "implementation/artifacts/purview/retained-evidence-checklist.md"
    consumer: "The data, information protection, DLP, and audit owners"
    operational_purpose: "Keep the repository retention boundary explicit for policy settings, summaries, audit query shape, and prohibited content."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The Purview implementation operator"
    operational_purpose: "Check the tenant, Graph Audit Search permission, recorded external prerequisites, approved scope, and simulation gate."
  - path: "implementation/scripts/query-agent-activity.ps1"
    consumer: "The Agent 365 audit owner"
    operational_purpose: "Run the scoped unified audit search and display only the approved payload-free fields."
sources:
