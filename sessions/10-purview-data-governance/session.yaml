  - title: "Microsoft Purview DLP for Microsoft 365 Copilot and Copilot Chat"
    url: "https://learn.microsoft.com/en-us/purview/dlp-microsoft365-copilot-location-learn-about"
    accessed: "2026-08-25"
    supports: "The separate Microsoft 365 Copilot and Copilot Chat DLP location, custom-policy requirement, supported conditions, simulation behavior, and current rollout caveats."
  - title: "Microsoft Agent 365 overview"
    url: "https://learn.microsoft.com/en-us/microsoft-agent-365/overview"
    accessed: "2026-08-26"
