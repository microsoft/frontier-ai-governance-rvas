schema_version: 2
session:
  id: "03"
  slug: "citadel-agent-spoke"
  title: "Deploy a Citadel Agent Spoke and governed agent"
  duration_minutes: 300
  status: "draft"
  last_verified: "2026-09-04"
  audience:
    - "AI application and Foundry Agent Service engineers"
    - "Workload platform, network, identity, and tool owners"
  prerequisites:
    - "Session 01 has prepared the approved workload subscription and network integration."
    - "The customer has cloned Azure AI Landing Zones at the commit recorded in `citadel/release.json` and selected a pinned Bicep or Terraform deployment path."
    - "The workload owner has completed `spoke-profile.json` and approved which optional compute, ingress, and administration components are excluded."
    - "The policy assistant has an approved model deployment, read-only tool endpoint, Entra identity path, and synthetic validation input."
  dependencies:
    - "Session 01 - Citadel platform foundation and landing-zone guardrails"
  services_in_scope:
    - "azure-ai-foundry"
    - "foundry-agent-service"
    - "azure-ai-search"
    - "azure-key-vault"
    - "azure-container-apps"
    - "azure-private-link"
  control_objective: "Deploy one workload-specific Citadel Agent Spoke and create a versioned Foundry agent with Entra authorization and one bounded read-only tool."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Pin the reviewed Agent Spoke source and record a minimal workload deployment profile."
  - "Deploy or integrate the workload landing zone without optional infrastructure that the use case does not need."
  - "Create the policy-assistant agent, pin its stable endpoint, and enable Entra authorization."
  - "Confirm the agent has a unique identity and can call only the approved read path."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/citadel/release.json"
    - "implementation/artifacts/citadel/spoke-profile.json"
    - "implementation/artifacts/agents/policy-assistant/agent.json"
    - "implementation/artifacts/agents/policy-assistant/instructions.md"
    - "implementation/artifacts/agents/policy-assistant/tool-manifest.json"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
    - "implementation/scripts/deploy.ps1"
    - "implementation/scripts/deploy.sh"
retained_files:
  - path: "implementation/artifacts/citadel/release.json"
    consumer: "Agent Spoke deployment pipeline"
    operational_purpose: "Pin the reviewed AI Landing Zones source and supported deployment method."
  - path: "implementation/artifacts/citadel/spoke-profile.json"
    consumer: "workload platform owner and Agent Spoke deployment pipeline"
    operational_purpose: "Record the workload scope, network integration, runtime, region, and excluded optional components."
  - path: "implementation/artifacts/agents/policy-assistant/agent.json"
    consumer: "Foundry agent deployment scripts"
    operational_purpose: "Define the versioned policy-assistant agent and approved model deployment."
  - path: "implementation/artifacts/agents/policy-assistant/instructions.md"
    consumer: "Foundry agent deployment scripts"
    operational_purpose: "Supply the reviewed agent instructions for the bounded policy lookup scenario."
  - path: "implementation/artifacts/agents/policy-assistant/tool-manifest.json"
    consumer: "Foundry agent deployment scripts"
    operational_purpose: "Bind the agent to the approved read-only policy tool contract."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "PowerShell-based spoke and agent operator"
    operational_purpose: "Reject unresolved workload, identity, model, network, or tool decisions before deployment."
  - path: "implementation/scripts/preflight.sh"
    consumer: "Bash-based spoke and agent operator"
    operational_purpose: "Apply the same workload readiness checks outside Windows."
  - path: "implementation/scripts/deploy.ps1"
    consumer: "PowerShell-based Foundry agent operator"
    operational_purpose: "Create and configure the governed agent in the approved Agent Spoke."
  - path: "implementation/scripts/deploy.sh"
    consumer: "Bash-based Foundry agent operator"
    operational_purpose: "Run the same governed agent deployment outside Windows."
sources:
  - title: "AI Landing Zones"
    url: "https://github.com/Azure/AI-Landing-Zones"
    accessed: "2026-09-04"
    supports: "Current Agent Spoke reference architecture, portal deployment choices, and Bicep and Terraform implementation paths."
  - title: "What is Microsoft Foundry Agent Service?"
    url: "https://learn.microsoft.com/azure/foundry/agents/overview"
    accessed: "2026-09-04"
    supports: "Current Foundry agent resources, versioning, endpoint, identity, tool, and authorization model."
  - title: "Role-based access control for Microsoft Foundry"
    url: "https://learn.microsoft.com/azure/foundry/concepts/rbac-foundry"
    accessed: "2026-09-04"
    supports: "Current Foundry roles and assignment scopes for project and agent operations."
