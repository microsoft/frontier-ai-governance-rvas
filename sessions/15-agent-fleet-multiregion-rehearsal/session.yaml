schema_version: 2
session:
  id: "15"
  slug: "agent-fleet-multiregion-rehearsal"
  title: "Agent fleet governance, multi-region design, and production rehearsal"
  duration_minutes: 270
  status: "draft"
  last_verified: "2026-08-28"
  audience:
    - "AI platform, service, network, and API Management engineers"
    - "Microsoft Foundry, Microsoft 365, Microsoft Entra, Purview, and Defender administrators"
    - "Service, security, continuity, and delivery owners"
  prerequisites:
    - "Deploy a governed production candidate from Sessions 05-13 behind an approved regional routing path. If your team built those controls outside this series, the delivery team must confirm the required state for all nine controls in the implementation document before the rehearsal."
    - "Approve a primary and secondary Azure region for the model, agent, gateway, data, network, quota, and residency requirements."
    - "The existing customer Bicep entrypoint deploys and updates the complete API Management and regional backend configuration."
    - "When using one multi-region API Management instance, use Premium (classic). Do not treat Premium v2 as multi-region capable."
    - "The inventory operator has Azure Reader at the selected subscription scope. Microsoft Entra AI Reader is a privileged tenant role, so the operator activates a time-bound PIM-eligible assignment only for inventory reconciliation. A missing Agent 365 record returns to pre-work: a time-bound Agent Registry Administrator activation registers the existing agent, while Agent ID Administrator is activated only when its identity must change. This session keeps no standing administrator assignment."
    - "Before Defender visibility work, the security owner records whether Microsoft Defender Unified RBAC is not activated, partially activated, or activated for all in-scope workloads, and records whether visibility uses Microsoft Entra Security Reader, Microsoft Defender Unified RBAC, or a mixed model."
    - "The security operator has Purview Data Security AI Viewer for read-only AI observability and a time-bound Microsoft Entra Security Reader activation for Defender visibility, both at tenant scope. A Purview Compliance Administrator role-group activation is required only when this session must add the agent instance listed in the inventory to an approved Purview policy."
    - "The deployment-preview operator has the built-in Contributor role at the exact regional resource-group scope because Azure what-if requires the same resource operations as deployment. If the Bicep entrypoint needs another scope, stop and return that change to the Session 14 controlled promotion path."
    - "Time-box all human privileged access. Use PIM-eligible activation for AI Reader and Security Reader. Expire or remove every administrator, Purview, Defender, and Azure role activation after inventory reconciliation and the rehearsal through the approved access process."
    - "The implementation repository contains paired health-check and routing-control scripts. The health check confirms secondary readiness and the active path after a switch; the routing control previews, performs, or restores the approved selector move."
    - "A maintenance window, restore authority, and approved production change process are available for the rehearsal."
    - "One governed agent and one MCP server can be located in their native services before the rehearsal. Azure Resource Manager reports Azure resources; Foundry Control Plane and Agent 365 store agent inventory; Purview stores policy state; Defender stores security state."
    - "The approved secondary-region deployment is complete before the timed rehearsal."
  dependencies:
    - "Session 05 - Governed Microsoft Foundry agent baseline"
    - "Session 07 - Azure API Management as the AI gateway"
    - "Session 08 - Azure API Center and the AI/MCP inventory"
    - "Session 09 - MCP and tool security"
    - "Session 10 - Purview data governance and Agent 365 data controls"
    - "Session 11 - Foundry evaluations and release quality gates"
    - "Session 12 - Red teaming, prompt injection, and Defender"
    - "Session 13 - Observability, cost, and operational controls"
    - "Session 14 - CI/CD, policy as code, and controlled promotion"
  services_in_scope:
    - "azure-ai-foundry"
    - "foundry-agent-service"
    - "agent-365"
    - "azure-api-management"
    - "azure-api-center"
    - "microsoft-entra-agent-id"
    - "microsoft-purview"
    - "microsoft-defender-xdr"
    - "azure-monitor"
  control_objective: "Locate one governed service's agent and MCP records in their native services. Then rehearse routing to its approved secondary deployment and check the expected identity reference, policy version, and trace fields."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Locate one governed agent and one MCP server in their native services and query the Azure resources used by the rehearsal."
  - "Use the regional Bicep parameter file with the matching project, telemetry, expected agent identity reference, and distinct primary and secondary selectors."
  - "Confirm the primary-region management-plane limit and regional rate-limit behavior before routing changes."
  - "After the service owner confirms readiness, route the governed service to the approved secondary deployment. Check its version, expected identity reference, policy, endpoint, and tracing. Keep the exact restore path in the runbook."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/control-definition.json"
    - "implementation/artifacts/regional/region.parameters.json"
    - "implementation/artifacts/regional/failover-runbook.md"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
    - "implementation/scripts/rehearse-failover.ps1"
    - "implementation/scripts/rehearse-failover.sh"
retained_files:
  - path: "implementation/artifacts/control-definition.json"
    consumer: "The Session 15 preflight scripts and regional rehearsal operators"
    updater: "The platform owner"
    review_cadence: "Before a rehearsal and after the Bicep entrypoint or customer script interface changes"
    operational_purpose: "Define the approved Azure scope and customer script paths that the Session 15 wrappers use."
  - path: "implementation/artifacts/regional/region.parameters.json"
    consumer: "The customer Bicep deployment, Session 15 preflight scripts, and routing wrappers"
    updater: "The platform owner"
    review_cadence: "With every regional deployment change and before a rehearsal"
    operational_purpose: "Supply regional deployment inputs and expected active-path values for the customer Bicep deployment and rehearsal wrappers."
  - path: "implementation/artifacts/regional/failover-runbook.md"
    consumer: "The service continuity and routing operators"
    updater: "The service continuity owner"
    review_cadence: "Before every scheduled rehearsal and after a routing, topology, or restore-process change"
    operational_purpose: "Direct the approved selector move and restore sequence without retaining runtime results."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The PowerShell-based regional readiness operator"
    updater: "The platform owner"
    review_cadence: "With changes to the control definition, regional parameter schema, or Azure validation path"
    operational_purpose: "Check required decisions, live Azure resources, topology, routing selectors, and deployment what-if before rehearsal."
  - path: "implementation/scripts/preflight.sh"
    consumer: "The Bash-based regional readiness operator"
    updater: "The platform owner"
    review_cadence: "With changes to the control definition, regional parameter schema, or Azure validation path"
    operational_purpose: "Apply the same required-decision, live Azure, topology, selector, and deployment-preview checks."
  - path: "implementation/scripts/rehearse-failover.ps1"
    consumer: "The PowerShell-based regional failover operator"
    updater: "The service continuity owner"
    review_cadence: "Before every scheduled rehearsal and after the customer health or routing interface changes"
    operational_purpose: "Recheck readiness, call customer health and routing controls, and move the governed service to the approved secondary selector."
  - path: "implementation/scripts/rehearse-failover.sh"
    consumer: "The Bash-based regional failover operator"
    updater: "The service continuity owner"
    review_cadence: "Before every scheduled rehearsal and after the customer health or routing interface changes"
    operational_purpose: "Apply the same readiness, health, routing-preview, and secondary-selector move sequence."
sources:
  - title: "Manage agents at scale in Microsoft Foundry Control Plane"
    url: "https://learn.microsoft.com/en-us/azure/foundry/control-plane/how-to-manage-agents"
    accessed: "2026-08-26"
    supports: "Foundry Control Plane discovers supported agents across projects in the selected subscription; Azure Reader at resource, resource-group, or subscription scope can view inventory and traces, and Application Insights supplies fleet metrics."
  - title: "Microsoft Agent 365 overview"
    url: "https://learn.microsoft.com/en-us/microsoft-agent-365/overview"
    accessed: "2026-08-28"
    supports: "Agent 365 provides the enterprise registry and integrates with Microsoft Entra, Purview, and Defender controls."
  - title: "Microsoft Agent 365 service description"
    url: "https://learn.microsoft.com/en-us/office365/servicedescriptions/microsoft-agent-365/microsoft-agent-365"
    accessed: "2026-08-28"
    supports: "Agent 365 is a Microsoft 365 service available as a stand-alone subscription for eligible Microsoft 365 subscriptions and included with Microsoft 365 E7; the service description is the stable source for plan availability and licensing boundaries."
  - title: "Agent Registry convergence with Microsoft Agent 365"
    url: "https://learn.microsoft.com/en-us/entra/agent-id/agent-registry-convergence"
    accessed: "2026-08-26"
    supports: "Agent 365 is the enterprise registry while Microsoft Entra remains the identity and access control plane; AI Reader is the inventory role and Agent ID Administrator is required for agent identity changes."
  - title: "Use Microsoft Purview to manage data security and compliance for Microsoft Agent 365"
    url: "https://learn.microsoft.com/en-us/purview/ai-agent-365"
    accessed: "2026-08-26"
    supports: "Agent instances enter audit and data classification automatically; other Purview capabilities require the instance to be included in policy."
  - title: "How does Microsoft Defender support Agent 365?"
    url: "https://learn.microsoft.com/en-us/microsoft-agent-365/guidance/defender-agent-365"
    accessed: "2026-08-26"
    supports: "Microsoft Defender surfaces, analyzes, and correlates Agent 365 runtime activity and risk signals for investigation and protection."
  - title: "Deploy an Azure API Management instance to multiple Azure regions"
    url: "https://learn.microsoft.com/en-us/azure/api-management/api-management-howto-deploy-multi-region"
    accessed: "2026-08-26"
    supports: "Premium multi-region replicates gateways only; management and developer portals remain in the primary region, internal mode needs customer routing, and rate and token counters operate per regional gateway."
  - title: "Reliability in Azure API Management"
    url: "https://learn.microsoft.com/en-us/azure/reliability/reliability-api-management"
    accessed: "2026-08-26"
    supports: "Premium (classic) supports multi-region deployment; Premium v2 supports zones but not multi-region deployment."
  - title: "Microsoft.ApiManagement/service Bicep reference"
    url: "https://learn.microsoft.com/en-us/azure/templates/microsoft.apimanagement/service"
    accessed: "2026-08-26"
    supports: "The stable 2024-05-01 resource schema remains listed and exposes `additionalLocations` for a complete API Management deployment definition."
  - title: "Permissions for Microsoft Purview Data Security Posture Management"
    url: "https://learn.microsoft.com/en-us/purview/data-security-posture-management-permissions"
    accessed: "2026-08-26"
    supports: "Purview Data Security AI Viewer provides view-only AI data access, while the Purview Compliance Administrator role group can create and edit Data Security Posture Management configuration."
  - title: "Microsoft Defender unified role-based access control"
    url: "https://learn.microsoft.com/en-us/defender-xdr/manage-rbac"
    accessed: "2026-08-28"
    supports: "Defender Unified RBAC must be activated per supported workload before it controls that workload; until activation, existing RBAC models remain active, so operators must record the activation state and permission model before checking visibility."
  - title: "Microsoft Entra built-in roles"
    url: "https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/permissions-reference"
    accessed: "2026-08-28"
    supports: "AI Reader is a privileged role that views Agent 365 inventory; Agent Registry Administrator manages registry records, Agent ID Administrator changes agent identities, and Security Reader provides read-only security visibility."
  - title: "Assign Microsoft Entra roles in Privileged Identity Management"
    url: "https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-how-to-add-role-to-user"
    accessed: "2026-08-28"
    supports: "PIM supports eligible Microsoft Entra role assignments that users activate when needed, with time-bound assignments that expire at the configured end time."
