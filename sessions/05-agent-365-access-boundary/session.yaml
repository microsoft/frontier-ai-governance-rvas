schema_version: 2
session:
  id: "05"
  slug: "agent-365-access-boundary"
  title: "Microsoft Agent 365 secure rollout and data controls"
  duration_minutes: 270
  status: "draft"
  last_verified: "2026-08-28"
  audience:
    - "Microsoft 365 and Microsoft Agent 365 administrators"
    - "Data owners and Microsoft Purview administrators"
    - "Microsoft Entra identity, source-platform, and audit owners"
  prerequisites:
    - "An approved nonproduction Microsoft Foundry, Copilot Studio, or Agent Builder agent appears in Agent Registry with Available status and supports group installation through Microsoft 365 admin center."
    - "The source-platform owner confirms the agent's publication, runtime owner, and approved lifecycle path. (Session 04 for a Foundry agent.)"
    - "The delivery owner approves one nonproduction test group, host product, use case, labelled synthetic item, DLP action and locations, and restore route."
    - "The DLP and label operator has Compliance Data Administrator in the approved Microsoft 365 tenant. The audit operator has View-Only Audit Logs in Purview and Exchange admin center."
    - "The Microsoft Graph Audit Search application has AuditLogsQuery.Read.All application permission with administrator consent."
  dependencies:
    - "One supported Agent 365 entry path: Session 04 for Microsoft Foundry, or an approved published Copilot Studio or Agent Builder agent"
  services_in_scope:
    - "agent-365"
    - "microsoft-purview"
    - "microsoft-entra-id"
    - "microsoft-365-copilot"
    - "azure-ai-foundry"
  control_objective: "Configure a scoped Microsoft Purview DLP policy. After it is enabled and propagated, install one approved nonproduction Agent Registry agent for its test group, check included and excluded access, and query payload-free Agent 365 audit activity."
implementation:
  mode: "extended"
  extended_reason: "DLP propagation separates policy configuration from live installation. Before the scoped rollout remains enabled, the delivery owner observes the intended labelled interaction and the out-of-scope non-match."
implementation_outcomes:
  - "Record the approved agent origin, Agent Registry entry, test group, host product, consent decision, DLP readiness, and restore route."
  - "Assign owners for the Agent 365 policy, labels, source platform, and audit query. For Foundry, also assign owners for the separate DLP rule and application integration."
  - "Simulate, enable, and allow time for a nonproduction Agent 365 DLP policy to propagate before installation."
  - "Install the agent for the approved group, confirm included access and excluded-user denial, and run the payload-free activity query."
  - "Confirm the labelled intended result and out-of-scope non-match with the delivery owner."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/agent-deployment.json"
    - "implementation/artifacts/governance/coverage-handoff.md"
    - "implementation/artifacts/operations/agent-activity-audit-query.json"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
    - "implementation/scripts/query-agent-activity.ps1"
    - "implementation/scripts/query-agent-activity.sh"
retained_files:
  - path: "implementation/artifacts/agent-deployment.json"
    consumer: "The Microsoft 365 administrator and Session 05 preflight scripts"
    operational_purpose: "Record the approved agent, test group, host product, consent, DLP readiness gate, scoped installation, and restore action."
  - path: "implementation/artifacts/governance/coverage-handoff.md"
    consumer: "The data, information protection, Agent 365, source-platform, and audit owners"
    operational_purpose: "Assign cross-product owners and document the Foundry boundary that Purview does not show in one product view."
  - path: "implementation/artifacts/operations/agent-activity-audit-query.json"
    consumer: "The Agent 365 audit-query scripts"
    operational_purpose: "Record approved Agent 365 operations and payload-free output fields for the audit owner's recurring query."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The Purview and Microsoft 365 implementation operator"
    operational_purpose: "Check the approved deployment contract, DLP readiness gate, audit permission, and retained query contract before a state change."
  - path: "implementation/scripts/preflight.sh"
    consumer: "The Purview and Microsoft 365 implementation operator"
    operational_purpose: "Run the same deployment, DLP readiness, audit permission, and query checks in Bash."
  - path: "implementation/scripts/query-agent-activity.ps1"
    consumer: "The Agent 365 audit owner"
    operational_purpose: "Run the scoped unified audit search and display the approved payload-free fields."
  - path: "implementation/scripts/query-agent-activity.sh"
    consumer: "The Agent 365 audit owner"
    operational_purpose: "Run the scoped Microsoft Graph Audit Search and display the approved payload-free fields."
