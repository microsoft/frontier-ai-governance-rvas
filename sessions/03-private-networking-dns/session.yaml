schema_version: 2
session:
  id: "03"
  slug: "private-networking-dns"
  title: "Private networking, DNS, and controlled egress"
  duration_minutes: 300
  status: "draft"
  last_verified: "2026-08-24"
  audience:
    - "Cloud and network platform engineers"
    - "AI platform engineers"
    - "DNS, firewall, and security reviewers"
  prerequisites:
    - "Sessions 01-02 are complete, and the exact Foundry, Storage, Azure AI Search, Cosmos DB, and Key Vault resource IDs are recorded for the nonproduction resource group."
    - "The customer has approved nonoverlapping RFC 1918 address ranges for a dedicated spoke, Agent subnet, and private-endpoint subnet."
    - "The network design record names the customer-managed firewall private IP, DNS integration pattern, and execution host inside the approved private network."
    - "The network deployment operator has the time-bound Network Contributor role on the exact nonproduction resource group where this session deploys the VNet, subnets, route table, and private endpoints."
    - "The DNS operator has the time-bound Private DNS Zone Contributor role on the resource group that contains the seven private DNS zones, or on each reused private DNS zone."
    - "The service owners recorded for Foundry, Storage, Azure AI Search, Cosmos DB, and Key Vault have each accepted responsibility for approving the private endpoint connection on their service through the existing service change process; this session assigns no service-approval role to the network deployment operator."
    - "The network design record names where the public-access cutover record is stored and who can retrieve it during restore."
    - "The AI platform owner has approved any required Foundry account replacement and configuration replay before endpoint or public-access cutover."
  dependencies:
    - "Session 01 - Microsoft Foundry platform baseline, inventory, and landing-zone guardrails"
    - "Session 02 - Entra identity, RBAC, PIM, and workload identities"
  services_in_scope:
    - "azure-ai-foundry"
    - "azure-key-vault"
    - "azure-ai-search"
    - "azure-monitor"
    - "azure-private-link"
    - "azure-private-dns"
  control_objective: "Establish private connectivity to Foundry and four dependencies, then disable their public access after private DNS and TCP 443 checks succeed from the approved nonproduction execution host."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Prepare a landing-zone-aligned spoke with separate private-endpoint and dedicated Agent Service subnets."
  - "Deploy the approved network, DNS links, and initial private endpoints; if Foundry account replacement is required, pause for the separately approved replacement and replay before reconciling the Foundry endpoint and all five resource IDs."
  - "Route the delegated Agent Service subnet through the customer-approved firewall and record the customer firewall policy source."
  - "Disable public network access only after the approved execution host resolves all five service FQDNs to private addresses, reaches TCP 443, and every prior public-access state is written to the restore record."
  - "The current service endpoints resolve to private addresses and accept TCP 443 from an approved client. Session 05 checks agent-runtime traffic."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/infra/network/main.bicep"
    - "implementation/artifacts/environments/sandbox.bicepparam"
    - "implementation/artifacts/network/endpoint-matrix.json"
    - "implementation/artifacts/decisions/network-design-record.md"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/connectivity-check.ps1"
    - "implementation/scripts/public-access-cutover.ps1"
retained_files:
  - path: "implementation/artifacts/infra/network/main.bicep"
    consumer: "The network deployment pipeline"
    operational_purpose: "Deploy and reconcile the spoke, delegated and private-endpoint subnets, firewall route, private DNS, and private endpoints."
  - path: "implementation/artifacts/environments/sandbox.bicepparam"
    consumer: "The network deployment pipeline"
    operational_purpose: "Supply the approved address ranges, firewall next hop, service resource IDs, and sandbox expiry."
  - path: "implementation/artifacts/network/endpoint-matrix.json"
    consumer: "The connectivity and public-access cutover scripts"
    operational_purpose: "Bind each approved service alias to the FQDN that must resolve privately and accept TCP 443."
  - path: "implementation/artifacts/decisions/network-design-record.md"
    consumer: "The network, DNS, firewall, and affected service owners"
    operational_purpose: "Record topology, DNS, firewall-source, Foundry-injection, cutover-store, and restore decisions unavailable from Azure."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The network deployment operator"
    operational_purpose: "Reject unresolved network decisions, unapproved Azure scope, or mismatched service resource identities and show the network deployment preview."
  - path: "implementation/scripts/connectivity-check.ps1"
    consumer: "The private client-path operator"
    operational_purpose: "Check live private DNS answers and TCP 443 connectivity for every configured endpoint."
  - path: "implementation/scripts/public-access-cutover.ps1"
    consumer: "The public-access cutover operator and affected service owners"
    operational_purpose: "Capture prior service states, verify the private client path, and disable public access under a guarded change."
sources:
  - title: "How to configure network isolation for Microsoft Foundry"
    url: "https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link"
    accessed: "2026-08-24"
    supports: "Inbound, Foundry outbound, and Agent-client outbound boundaries; private endpoint validation; BYO dependencies; firewall allowlisting; and the create-time network-injection limitation."
  - title: "Networking options for Foundry Agent Service"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/networking-options"
    accessed: "2026-08-24"
    supports: "BYO virtual network decisions, dedicated subnet requirements, RFC 1918 constraints, account-level scope, and immutable network injection."
  - title: "Set up private networking for Foundry Agent Service"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks"
    accessed: "2026-08-24"
    supports: "Microsoft.App/environments delegation, /27 minimum and /24 recommendation, separate private endpoints, DNS zones, public-access checks, and current limitations."
  - title: "Azure Private Endpoint private DNS zone values"
    url: "https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns"
    accessed: "2026-08-24"
    supports: "Current private DNS zones and subresources for Foundry, Storage, AI Search, Cosmos DB, and Key Vault."
  - title: "Azure Private Endpoint DNS integration scenarios"
    url: "https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns-integration"
    accessed: "2026-08-24"
    supports: "Hub-and-spoke links, Azure DNS, custom DNS forwarding, and Azure Private Resolver patterns."
  - title: "Foundry Standard Agent Setup with end-to-end network isolation"
    url: "https://github.com/microsoft-foundry/foundry-samples/tree/main/infrastructure/infrastructure-setup-bicep/15-private-network-standard-agent-setup"
    accessed: "2026-08-24"
    supports: "Microsoft-maintained Bicep reference for the isolated Standard Agent topology and current DNS zone set."
