schema_version: 2
session:
  id: "01"
  slug: "citadel-platform-foundation"
  title: "Citadel platform foundation and landing-zone guardrails"
  duration_minutes: 300
  status: "draft"
  last_verified: "2026-09-04"
  audience:
    - "Azure landing-zone and AI platform engineers"
    - "Network, security, and governance owners"
  prerequisites:
    - "The customer has an approved nonproduction subscription, customer-owned implementation repository, Azure region, resource naming standard, and change owner."
    - "The network owner has chosen a new Citadel network or existing platform network and has approved nonoverlapping address ranges, private DNS ownership, and the controlled-egress path."
    - "The governance owner has approved the required resource tags and the management-group or subscription scope for the Citadel policy assignment."
  dependencies:
    - "Engagement pre-work complete"
  services_in_scope:
    - "azure-policy"
    - "azure-private-link"
    - "azure-private-dns"
    - "azure-ai-foundry"
  control_objective: "Prepare the approved Citadel subscription with network foundations and Azure Policy guardrails before the shared hub or workload spokes are deployed."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Record the Citadel topology, owners, regions, required tags, network integration, and upstream release policy."
  - "Deploy or reconcile the dedicated subnets and controlled-egress route required by the selected Citadel network pattern."
  - "Stage the required-tag Azure Policy initiative and assignment through deployment what-if."
  - "Confirm that the approved execution host can resolve and reach the private network path."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/environments/network-foundation.bicepparam"
    - "implementation/artifacts/environments/initiative.bicepparam"
    - "implementation/artifacts/environments/policy-assignment.bicepparam"
    - "implementation/artifacts/infra/network/main.bicep"
    - "implementation/artifacts/policy/guardrail-settings.json"
    - "implementation/artifacts/policy/initiative.bicep"
    - "implementation/artifacts/policy/assignment.bicep"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
    - "implementation/scripts/resolve-builtins.ps1"
    - "implementation/scripts/resolve-builtins.sh"
    - "implementation/scripts/connectivity-check.ps1"
    - "implementation/scripts/connectivity-check.sh"
retained_files:
  - path: "implementation/artifacts/environments/network-foundation.bicepparam"
    consumer: "Citadel foundation deployment pipeline"
    operational_purpose: "Supply the approved network name, address ranges, firewall next hop, region, and expiry date."
  - path: "implementation/artifacts/environments/initiative.bicepparam"
    consumer: "governance deployment pipeline"
    operational_purpose: "Supply the approved policy initiative name and management scope."
  - path: "implementation/artifacts/environments/policy-assignment.bicepparam"
    consumer: "governance deployment pipeline"
    operational_purpose: "Supply the assignment scope, enforcement mode, and managed identity inputs."
  - path: "implementation/artifacts/infra/network/main.bicep"
    consumer: "Citadel foundation deployment pipeline"
    operational_purpose: "Deploy and reconcile the dedicated agent and private-endpoint subnets with controlled egress."
  - path: "implementation/artifacts/policy/guardrail-settings.json"
    consumer: "policy initiative and assignment deployments"
    operational_purpose: "Define the required tags and implementation marker used by the Citadel guardrails."
  - path: "implementation/artifacts/policy/initiative.bicep"
    consumer: "governance deployment pipeline"
    operational_purpose: "Deploy the customer-owned policy initiative for the Citadel scope."
  - path: "implementation/artifacts/policy/assignment.bicep"
    consumer: "governance deployment pipeline"
    operational_purpose: "Assign the Citadel guardrails through the approved change path."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "PowerShell-based foundation operator"
    operational_purpose: "Reject unresolved scope, network, policy, provider, or preview inputs before a change."
  - path: "implementation/scripts/preflight.sh"
    consumer: "Bash-based foundation operator"
    operational_purpose: "Apply the same foundation readiness and preview checks outside Windows."
  - path: "implementation/scripts/resolve-builtins.ps1"
    consumer: "PowerShell-based governance operator"
    operational_purpose: "Resolve current built-in policy identifiers before initiative deployment."
  - path: "implementation/scripts/resolve-builtins.sh"
    consumer: "Bash-based governance operator"
    operational_purpose: "Resolve the same built-in policy identifiers outside Windows."
  - path: "implementation/scripts/connectivity-check.ps1"
    consumer: "PowerShell-based network operator"
    operational_purpose: "Check DNS and private connectivity from the approved Citadel execution host."
  - path: "implementation/scripts/connectivity-check.sh"
    consumer: "Bash-based network operator"
    operational_purpose: "Run the same DNS and private connectivity check outside Windows."
sources:
  - title: "Foundry Citadel Platform"
    url: "https://github.com/Azure-Samples/foundry-citadel-platform"
    accessed: "2026-09-04"
    supports: "Citadel uses a central Governance Hub, workload Agent Spokes, and integration with an existing Azure landing zone."
  - title: "Azure landing zone conceptual architecture"
    url: "https://learn.microsoft.com/azure/cloud-adoption-framework/ready/landing-zone/"
    accessed: "2026-09-04"
    supports: "Platform and application landing-zone responsibilities, subscription organization, connectivity, identity, and governance foundations."
  - title: "Azure Policy overview"
    url: "https://learn.microsoft.com/azure/governance/policy/overview"
    accessed: "2026-09-04"
    supports: "Policy definitions, initiatives, assignments, enforcement modes, and remediation behavior."
