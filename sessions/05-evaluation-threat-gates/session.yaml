schema_version: 2
session:
  id: "05"
  slug: "evaluation-threat-gates"
  title: "Evaluation, red-team, and threat release gates"
  duration_minutes: 330
  status: "draft"
  last_verified: "2026-09-04"
  audience:
    - "Foundry evaluation and agent engineers"
    - "AI safety, security operations, and release owners"
  prerequisites:
    - "Session 03 has produced fixed approved and candidate agent versions."
    - "Session 03 has produced the stable Citadel access path and read-only tool boundary."
    - "The quality and security owners have approved the synthetic dataset, evaluators, thresholds, attack taxonomy, judge model, budget, and run window."
    - "The Defender-to-SOC route is operating, or the security owner has approved a route-health check."
  dependencies:
    - "Session 03 - Deploy a Citadel Agent Spoke and governed agent"
    - "Session 04 - Govern Citadel backends, access, tools, and agents"
  services_in_scope:
    - "azure-ai-foundry"
    - "microsoft-defender-for-cloud"
    - "microsoft-defender-xdr"
  control_objective: "Run repeatable quality and adversarial checks against fixed agent versions and return one release decision consumed by the promotion workflow."
implementation:
  mode: "extended"
  extended_reason: "The release owner must observe an approved version pass and a tool or safety regression block before enabling the gate."
implementation_outcomes:
  - "Run the versioned synthetic evaluation set against fixed approved and candidate agent versions."
  - "Apply active quality, tool-process, and safety thresholds through the release gate."
  - "Run the bounded red-team plan and reject any risk regression or prohibited-action success."
  - "Confirm the Defender-to-SOC signal path without retaining prompts or responses."
  - "Return PASS for the approved aggregate and BLOCK for the generated regression."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/eval/evaluation-spec.json"
    - "implementation/artifacts/eval/data/golden-v1.jsonl"
    - "implementation/artifacts/eval/thresholds.yaml"
    - "implementation/artifacts/release/release-policy.json"
    - "implementation/artifacts/red-team/attack-plan.json"
    - "implementation/artifacts/defender/ai-alert-hunt.kql"
    - "implementation/artifacts/operations/disable-and-restore.md"
    - "implementation/artifacts/operations/soc-triage-playbook.md"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
    - "implementation/scripts/run-evaluation.py"
    - "implementation/scripts/release-gate.py"
    - "implementation/scripts/test_release_gate.py"
    - "implementation/scripts/run-red-team.py"
    - "implementation/scripts/compare-runs.py"
    - "implementation/scripts/requirements.txt"
retained_files:
  - path: "implementation/artifacts/eval/evaluation-spec.json"
    consumer: "Foundry evaluation runner"
    operational_purpose: "Bind fixed agent versions, dataset fields, and evaluator configuration."
  - path: "implementation/artifacts/eval/data/golden-v1.jsonl"
    consumer: "Foundry evaluation runner"
    operational_purpose: "Supply versioned synthetic normal, refusal, tool, safety, and failure cases."
  - path: "implementation/artifacts/eval/thresholds.yaml"
    consumer: "release gate"
    operational_purpose: "Define active quality, tool-process, and safety floors."
  - path: "implementation/artifacts/release/release-policy.json"
    consumer: "release gate and Session 07 promotion workflow"
    operational_purpose: "Define owners, enabled checks, exception rules, and release-store bindings."
  - path: "implementation/artifacts/red-team/attack-plan.json"
    consumer: "red-team runner and security owner"
    operational_purpose: "Define the authorized attack taxonomy, strategies, privacy boundary, and prohibited actions."
  - path: "implementation/artifacts/defender/ai-alert-hunt.kql"
    consumer: "SOC analyst"
    operational_purpose: "Find current AI security signals without copying payloads."
  - path: "implementation/artifacts/operations/disable-and-restore.md"
    consumer: "release and incident owners"
    operational_purpose: "Describe how to disable the gate and restore the approved agent version."
  - path: "implementation/artifacts/operations/soc-triage-playbook.md"
    consumer: "SOC analyst and incident commander"
    operational_purpose: "Guide triage and escalation for observed AI security signals."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "PowerShell-based quality and security operator"
    operational_purpose: "Reject unsupported, unauthorized, mismatched, or payload-retaining runs."
  - path: "implementation/scripts/preflight.sh"
    consumer: "Bash-based quality and security operator"
    operational_purpose: "Apply the same evaluation and red-team readiness checks outside Windows."
  - path: "implementation/scripts/run-evaluation.py"
    consumer: "evaluation operator"
    operational_purpose: "Run the approved Foundry evaluation and write payload-free aggregates to the external release store."
  - path: "implementation/scripts/release-gate.py"
    consumer: "release owner and Session 07 promotion workflow"
    operational_purpose: "Return PASS or BLOCK from the active thresholds and policy."
  - path: "implementation/scripts/test_release_gate.py"
    consumer: "release owner"
    operational_purpose: "Generate an in-memory regression and confirm that the gate blocks it."
  - path: "implementation/scripts/run-red-team.py"
    consumer: "red-team operator"
    operational_purpose: "Run the bounded attack plan and write payload-free aggregate results."
  - path: "implementation/scripts/compare-runs.py"
    consumer: "security and release owners"
    operational_purpose: "Reject category, strategy, evaluator, or prohibited-action regressions."
  - path: "implementation/scripts/requirements.txt"
    consumer: "approved Python environment"
    operational_purpose: "Install the bounded packages used by evaluation and red-team scripts."
sources:
  - title: "Evaluate your AI agents"
    url: "https://learn.microsoft.com/azure/foundry/observability/how-to/evaluate-agent"
    accessed: "2026-09-04"
    supports: "Current agent evaluation targets, evaluator inputs, project roles, and result model."
  - title: "AI Red Teaming Agent"
    url: "https://learn.microsoft.com/azure/foundry/concepts/ai-red-teaming-agent"
    accessed: "2026-09-04"
    supports: "Current red-team taxonomy, attack strategies, result interpretation, and human-review requirement."
  - title: "Protect AI assets using Microsoft Defender"
    url: "https://learn.microsoft.com/defender-xdr/security-for-ai/defender-security-for-ai"
    accessed: "2026-09-04"
    supports: "Current AI asset protection, detection, incident, and hunting surfaces."
