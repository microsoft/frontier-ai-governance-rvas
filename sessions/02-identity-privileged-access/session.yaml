schema_version: 2
session:
  id: "02"
  slug: "identity-privileged-access"
  title: "Entra identity, RBAC, PIM, and workload identities"
  duration_minutes: 240
  status: "draft"
  last_verified: "2026-08-28"
  audience:
    - "Identity and access administrators"
    - "Cloud and AI platform engineers"
    - "AI application owners and security reviewers"
  prerequisites:
    - "Session 01 is complete, with an approved nonproduction Foundry resource, project, storage account, and customer-owned repository."
    - "Four customer-owned groups exist for platform administration, project management, development, and audit; their object IDs are available."
    - "The role-assignment operator has the time-bound Owner or User Access Administrator role on the exact nonproduction resource group that contains the Foundry resource, project, and storage account."
    - "The PIM operator has the Owner or User Access Administrator role on the existing Foundry resource whose Foundry Account Owner settings this session changes."
    - "Microsoft Entra ID P2 or Microsoft Entra ID Governance licensing is confirmed for the PIM implementation."
    - "A protected GitHub environment is available for the OpenID Connect trust."
  dependencies:
    - "Session 01 - Microsoft Foundry platform baseline, inventory, and landing-zone guardrails"
  services_in_scope:
    - "microsoft-entra-id"
    - "microsoft-entra-workload-id"
    - "microsoft-entra-agent-id"
    - "azure-ai-foundry"
    - "github-actions"
  control_objective: "Configure four group-based human role assignments, PIM eligibility for Foundry administration, and a secretless GitHub workload identity at the identified nonproduction resource scopes."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Assign platform administrators PIM-eligible Foundry Account Owner at the Foundry resource. Assign project managers Foundry Project Manager at that resource, developers Foundry User at one project, and auditors Reader at the Foundry resource."
  - "Assign normal human access through groups and configure the platform-administrator group object ID as the PIM-eligible principal."
  - "Deploy a dedicated user-assigned managed identity with no client secret. Its federated credential trusts one protected GitHub environment, and its roles are scoped to one Foundry resource and one storage account."
  - "Do not assign Foundry Agent Consumer until the session that creates the agent identifies its endpoint-only callers and approved project or individual-agent scope."
  - "Confirm that live Azure RBAC assignments, Entra PIM eligibility and role settings, the workload identity, and its role scopes match the approved design."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/identity/workload-identity.bicep"
    - "implementation/artifacts/identity/human-role-assignments.bicep"
    - "implementation/artifacts/identity/role-definitions.json"
    - "implementation/scripts/preflight.ps1"
retained_files:
  - path: "implementation/artifacts/identity/workload-identity.bicep"
    consumer: "The workload identity deployment pipeline"
    operational_purpose: "Deploy and maintain the managed identity, its federated credential for the specified GitHub environment subject, and two scoped Azure RBAC assignments."
  - path: "implementation/artifacts/identity/human-role-assignments.bicep"
    consumer: "The human-access deployment pipeline"
    operational_purpose: "Deploy the three standing group assignments at the approved Foundry resource and project scopes."
  - path: "implementation/artifacts/identity/role-definitions.json"
    consumer: "The identity Bicep builds and preflight scripts"
    operational_purpose: "Provide the stable ID for every Azure role that the Bicep files or preflight scripts resolve or deploy."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The identity deployment operator"
    operational_purpose: "Reject unresolved decisions and built-in roles whose ID, accepted display name, or `BuiltInRole` type does not match the expected role, resolve every approved role ID live, and compile both identity deployments."
sources:
  - title: "Role-based access control for Microsoft Foundry"
    url: "https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry"
    accessed: "2026-08-28"
    supports: "Current Foundry role names, stable role IDs, Foundry Agent Consumer at project or individual-agent scope, Foundry Owner permissions, assignment behavior, and the role rename warning."
  - title: "Configure keyless authentication with Microsoft Entra ID"
    url: "https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/configure-entra-id"
    accessed: "2026-08-24"
    supports: "Cognitive Services User at Foundry resource scope for Entra-authenticated model inference."
  - title: "Configure Azure resource role settings in PIM"
    url: "https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-resource-roles-configure-role-settings"
    accessed: "2026-08-24"
    supports: "PIM role settings are per role and resource, with approval, MFA, justification, and activation duration controls."
  - title: "Create trust between a user-assigned managed identity and an external identity provider"
    url: "https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation-create-trust-user-assigned-managed-identity"
    accessed: "2026-08-24"
    supports: "Federated credential issuer, subject, audience, user-assigned identity support, and exact-claim matching."
  - title: "Authenticate to Azure from GitHub Actions by OpenID Connect"
    url: "https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect"
    accessed: "2026-08-24"
    supports: "azure/login OIDC configuration and id-token permission without a client secret."
  - title: "Access Azure DevOps with Microsoft Entra workload identity"
    url: "https://learn.microsoft.com/en-us/azure/devops/pipelines/library/add-devops-entra-service-connection?view=azure-devops"
    accessed: "2026-08-28"
    supports: "Azure DevOps workload identity federation as a separate service-connection path that is not implemented by this GitHub-specific session."
  - title: "Use Bicep to create Azure RBAC resources"
    url: "https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/scenarios-rbac"
    accessed: "2026-08-24"
    supports: "Smallest-scope role assignments, deterministic names, stable role IDs, and principalType guidance."
  - title: "Agent identity concepts in Microsoft Foundry"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/agent-identity"
    accessed: "2026-08-25"
    supports: "Current distinction between Foundry agent identities, unattended application-only access, and attended delegated access."
  - title: "Microsoft identity platform and OAuth 2.0 On-Behalf-Of flow"
    url: "https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-on-behalf-of-flow"
    accessed: "2026-08-25"
    supports: "OBO carries delegated user scopes through a middle tier and is not used for application-only tokens."
  - title: "Create an access review of Azure resource and Microsoft Entra roles in PIM"
    url: "https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-create-roles-and-resource-roles-review"
    accessed: "2026-08-28"
    supports: "Recurring access reviews for eligible and active Azure resource role assignments in PIM."
