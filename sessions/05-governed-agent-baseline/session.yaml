schema_version: 2
session:
  id: "05"
  slug: "governed-agent-baseline"
  title: "Governed Microsoft Foundry agent baseline"
  duration_minutes: 180
  status: "draft"
  last_verified: "2026-08-28"
  audience:
    - "AI product owners and AI engineers"
    - "Microsoft Foundry platform and identity engineers"
    - "Security, safety, and observability owners"
  prerequisites:
    - "Sessions 01 through 03 are complete in the approved nonproduction subscription, resource group, Foundry resource, and Foundry project."
    - "The existing Microsoft Foundry resource has Azure resource property `kind` set to `AIServices`. Its existing project is reachable from the approved execution host."
    - "The agent deployment operator has the time-bound Foundry User role, role ID `53ca6127-db72-4b80-b1b0-d745d6d5456d`, on that exact Foundry project."
    - "The Session 04 consolidated approval record links the selected deployment name to its exact model coordinates. The live ARM child deployment has provisioning state `Succeeded`. The AI product owner has checked the current Agent Service region-and-model support table for prompt agents and OpenAPI tools in the Foundry project region."
    - "The downstream API resource scope has an approved read-only HTTPS operation, exact Microsoft Entra audience, authorization owner, and exact built-in or custom read role assignment for the Foundry project managed identity."
    - "The exact RAI policy name is recorded for the selected model deployment. The safety owner has approved its input and output filtering settings."
    - "Application Insights is connected to the Foundry project. The approved operations group has Log Analytics Reader on that exact Application Insights resource and, for protected Log Analytics tables, Privileged Monitoring Data Reader."
  dependencies:
    - "Session 01 - Microsoft Foundry platform baseline, inventory, and landing-zone guardrails"
    - "Session 02 - Entra identity, RBAC, PIM, and workload identities"
    - "Session 03 - Private networking, DNS, and controlled egress"
    - "Session 04 - Model governance, data residency, quota, and lifecycle"
  services_in_scope:
    - "azure-ai-foundry"
    - "foundry-agent-service"
    - "microsoft-entra-agent-id"
    - "microsoft-entra-workload-id"
    - "azure-monitor"
    - "application-insights"
  control_objective: "Create a versioned prompt agent and pin it to a stable endpoint. Its unique Entra Agent Identity identifies the agent. The Foundry project managed identity authorizes the approved read-only OpenAPI tool. Keep write tools absent, apply the RAI policy in the agent definition, and enable server-side tracing."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Create a versioned prompt agent from approved instructions and a machine-readable definition."
  - "Expose the approved read-only OpenAPI operation. Keep the prohibited write action out of the agent's available tools."
  - "Apply the RAI policy in the agent definition, Microsoft Entra endpoint authorization, and server-side tracing through the connected Application Insights resource."
  - "Use the unique Entra Agent Identity to identify the agent and secure its endpoint. Use the Foundry project managed identity for the direct OpenAPI read. Pin the stable endpoint to the implemented version."
  - "A synthetic get_policy read returns only the approved fields through the Foundry project managed identity. No other tool runs."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/agents/policy-assistant/agent.json"
    - "implementation/artifacts/agents/policy-assistant/instructions.md"
    - "implementation/artifacts/agents/policy-assistant/tool-manifest.json"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/deploy.ps1"
retained_files:
  - path: "implementation/artifacts/agents/policy-assistant/agent.json"
    consumer: "The Session 05 agent deployment scripts"
    operational_purpose: "Create each prompt-agent version with the approved model, RAI policy, endpoint, and identity settings."
  - path: "implementation/artifacts/agents/policy-assistant/instructions.md"
    consumer: "The Microsoft Foundry prompt-agent version"
    operational_purpose: "Tell each deployed version how to read policies, which write action to refuse, and how a person can request the change."
  - path: "implementation/artifacts/agents/policy-assistant/tool-manifest.json"
    consumer: "The Session 05 agent deployment scripts"
    operational_purpose: "Register the approved GET operation and bind its runtime endpoint without storing the endpoint."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The Microsoft Foundry agent deployment operator"
    operational_purpose: "Block deployment when a required decision is unresolved, a resource falls outside the approved scope, a tool can write, required access is missing, or the stable endpoint selects an unexpected version."
  - path: "implementation/scripts/deploy.ps1"
    consumer: "The Microsoft Foundry agent deployment operator"
    operational_purpose: "Create an immutable agent version and pin the stable endpoint."
sources:
  - title: "What is Microsoft Foundry Agent Service?"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/overview"
    accessed: "2026-08-25"
    supports: "Current prompt-agent, hosted-agent, Responses API, tool, identity, observability, and publishing capability split."
  - title: "Quickstart: Create a prompt agent"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/quickstarts/prompt-agent"
    accessed: "2026-08-25"
    supports: "Current v1 data-plane endpoint, prompt-agent definition, model deployment reference, version creation, and Microsoft Entra token scope."
  - title: "Configure and share your Microsoft Foundry agent"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/configure-agent"
    accessed: "2026-08-28"
    supports: "Foundry User at project scope, stable endpoint behavior, fixed-version routing, current-agent unique identity properties, and the portal limit that protocol, authorization, and agent-card changes require the REST API or SDK."
  - title: "Migrate from Agent Applications to the new Microsoft Foundry agent model"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/migrate-agent-applications"
    accessed: "2026-08-25"
    supports: "Current agent object model in which new agents receive a stable endpoint and unique Entra identity without a separate endpoint-publishing resource."
  - title: "Agent identity concepts in Microsoft Foundry"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/agent-identity"
    accessed: "2026-08-28"
    supports: "Agent identity and blueprint behavior, including the older Agent Application model's shared development identity and distinct published identity, and its distinction from the current agent object model."
  - title: "Connect OpenAPI tools to Microsoft Foundry agents"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/openapi"
    accessed: "2026-08-28"
    supports: "Foundry User at project scope, OpenAPI 3.0 and 3.1 support, operationId requirements, managed identity authentication through the Foundry project identity, exact target-service role and scope requirements, regional/model compatibility, and tool constraints."
  - title: "What is Toolbox in Foundry?"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/toolbox-overview"
    accessed: "2026-08-28"
    supports: "Foundry Toolbox can centralize and reuse OpenAPI and other tools through a managed MCP-compatible endpoint, while direct OpenAPI attachment remains supported."
  - title: "PromptAgentDefinition class"
    url: "https://learn.microsoft.com/en-us/python/api/azure-ai-projects/azure.ai.projects.models.promptagentdefinition?view=azure-python"
    accessed: "2026-08-25"
    supports: "Current prompt-agent definition fields for model, instructions, tools, temperature, and RAI policy configuration."
  - title: "Set up tracing for AI agents in Microsoft Foundry"
    url: "https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-setup"
    accessed: "2026-08-26"
    supports: "Server-side tracing through a connected Application Insights resource, Log Analytics Reader and protected-table access requirements, retention, cost, and sensitive-content cautions."
  - title: "Quotas and limits for Microsoft Foundry Agent Service"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/limits-quotas-regions"
    accessed: "2026-08-25"
    supports: "Current Agent Service GA status and region/model/tool compatibility checks."
