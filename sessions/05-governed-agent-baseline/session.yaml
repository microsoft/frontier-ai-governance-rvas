schema_version: 2
session:
  id: "06"
  slug: "governed-agent-baseline"
  title: "Governed Microsoft Foundry agent baseline"
  duration_minutes: 240
  status: "draft"
  last_verified: "2026-08-26"
  audience:
    - "AI product owners and AI engineers"
    - "Microsoft Foundry platform and identity engineers"
    - "Security, safety, and observability owners"
  prerequisites:
    - "Sessions 01-05 are complete in the approved nonproduction subscription, resource group, Foundry resource, and Foundry project."
    - "The existing Microsoft Foundry resource has the Azure resource property `kind` set to `AIServices`, and its existing project is reachable from the approved execution host."
    - "The agent deployment operator has the time-bound Foundry User role, role ID `53ca6127-db72-4b80-b1b0-d745d6d5456d`, on that exact Foundry project."
    - "The Session 05 consolidated approval record links the selected deployment name to its exact model coordinates, the live ARM child deployment has provisioning state `Succeeded`, and the AI product owner has checked the current Agent Service region-and-model support table for prompt agents and OpenAPI tools in the Foundry project region."
    - "An existing read-only HTTPS API operation, its exact Microsoft Entra audience, authorization owner, and exact built-in or custom read role assignment for the Foundry project managed identity are approved at the downstream API resource scope."
    - "The exact RAI policy name is recorded for the selected model deployment, and the safety owner has approved its input and output filtering settings."
    - "Application Insights is connected to the Foundry project, and the approved operations group has Log Analytics Reader on that exact Application Insights resource; if its Log Analytics tables are protected, the group also has Privileged Monitoring Data Reader."
  dependencies:
    - "Session 01 - Microsoft Foundry platform baseline and inventory"
    - "Session 03 - Entra identity, RBAC, PIM, and workload identities"
    - "Session 04 - Private networking, DNS, and controlled egress"
    - "Session 05 - Model governance, data residency, quota, and lifecycle"
  services_in_scope:
    - "azure-ai-foundry"
    - "foundry-agent-service"
    - "microsoft-entra-agent-id"
    - "microsoft-entra-workload-id"
    - "azure-monitor"
    - "application-insights"
  control_objective: "Create and pin one versioned prompt agent whose unique Entra Agent Identity identifies the agent, while the Foundry project managed identity authorizes its single read-only OpenAPI tool; keep write tools absent and apply the RAI policy listed in the agent definition and server-side tracing."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Create one versioned prompt agent from approved instructions and a machine-readable definition."
  - "Expose only one approved read-only OpenAPI operation and keep the prohibited write action absent from the tool surface."
  - "Apply the RAI policy listed in the agent definition, Microsoft Entra endpoint authorization, and server-side tracing through the connected Application Insights resource."
  - "Use the unique Entra Agent Identity for the agent and endpoint boundary, use the Foundry project managed identity for the direct OpenAPI read, and pin the stable endpoint to the implemented version."
  - "One synthetic get_policy read returns only the approved fields through the Foundry project managed identity, with no other tool call."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/agents/policy-assistant/agent.json"
    - "implementation/artifacts/agents/policy-assistant/instructions.md"
    - "implementation/artifacts/agents/policy-assistant/tool-manifest.json"
    - "implementation/artifacts/agents/policy-assistant/prohibited-actions.json"
    - "implementation/artifacts/operations/release-operations.json"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/deploy.ps1"
retained_files:
  - path: "implementation/artifacts/agents/policy-assistant/agent.json"
    consumer: "The Session 06 agent deployment scripts"
    operational_purpose: "Create each prompt-agent version with the approved model, RAI policy, endpoint, and identity settings."
  - path: "implementation/artifacts/agents/policy-assistant/instructions.md"
    consumer: "The Microsoft Foundry prompt-agent version"
    operational_purpose: "Set the agent's policy-reading behavior and refusal boundary."
  - path: "implementation/artifacts/agents/policy-assistant/tool-manifest.json"
    consumer: "The Session 06 agent deployment scripts"
    operational_purpose: "Register only the approved GET operation and bind its runtime endpoint without storing the endpoint."
  - path: "implementation/artifacts/agents/policy-assistant/prohibited-actions.json"
    consumer: "The Session 06 agent deployment scripts"
    operational_purpose: "Insert the customer-approved prohibited write action and human change route into the deployed agent instructions."
  - path: "implementation/artifacts/operations/release-operations.json"
    consumer: "The Session 06 preflight and deployment scripts"
    operational_purpose: "Reconcile the pinned Foundry version with live state and carry tracing ownership into operations."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The Microsoft Foundry agent deployment operator"
    operational_purpose: "Block deployment on unresolved decisions, scope drift, unsafe tools, missing access, or release-selector drift."
  - path: "implementation/scripts/deploy.ps1"
    consumer: "The Microsoft Foundry agent deployment operator"
    operational_purpose: "Create an immutable agent version, pin the stable endpoint, and update the release operations record."
sources:
  - title: "What is Microsoft Foundry Agent Service?"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/overview"
    accessed: "2026-08-25"
    supports: "Current prompt-agent, hosted-agent, Responses API, tool, identity, observability, and publishing capability split."
  - title: "Quickstart: Create a prompt agent"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/quickstarts/prompt-agent"
    accessed: "2026-08-25"
    supports: "Current v1 data-plane endpoint, prompt-agent definition, model deployment reference, version creation, and Microsoft Entra token scope."
  - title: "Configure and share your Microsoft Foundry agent"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/configure-agent"
    accessed: "2026-08-26"
    supports: "Foundry User at project scope for creating and managing agents, current stable endpoint behavior, fixed-version routing, Responses protocol, Entra authorization, agent identity properties, and endpoint limitations."
  - title: "Migrate from Agent Applications to the new Microsoft Foundry agent model"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/migrate-agent-applications"
    accessed: "2026-08-25"
    supports: "Current agent object model in which new agents receive a stable endpoint and unique Entra identity without a separate endpoint-publishing resource."
  - title: "Agent identity concepts in Microsoft Foundry"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/agent-identity"
    accessed: "2026-08-26"
    supports: "Agent identity and blueprint behavior, token exchange, scoped downstream authorization, and the separate boundary between endpoint identity and downstream audience selection."
  - title: "Connect OpenAPI tools to Microsoft Foundry agents"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/openapi"
    accessed: "2026-08-26"
    supports: "Foundry User at project scope, OpenAPI 3.0 and 3.1 support, operationId requirements, managed identity authentication through the Foundry project identity, exact target-service role and scope requirements, regional/model compatibility, and tool constraints."
  - title: "PromptAgentDefinition class"
    url: "https://learn.microsoft.com/en-us/python/api/azure-ai-projects/azure.ai.projects.models.promptagentdefinition?view=azure-python"
    accessed: "2026-08-25"
    supports: "Current prompt-agent definition fields for model, instructions, tools, temperature, and RAI policy configuration."
  - title: "Set up tracing for AI agents in Microsoft Foundry"
    url: "https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-setup"
    accessed: "2026-08-26"
    supports: "Server-side tracing through a connected Application Insights resource, Log Analytics Reader and protected-table access requirements, retention, cost, and sensitive-content cautions."
  - title: "Quotas and limits for Microsoft Foundry Agent Service"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/limits-quotas-regions"
    accessed: "2026-08-25"
    supports: "Current Agent Service GA status and region/model/tool compatibility checks."
