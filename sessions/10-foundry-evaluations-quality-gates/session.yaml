schema_version: 2
session:
  id: "11"
  slug: "foundry-evaluations-quality-gates"
  title: "Foundry evaluations and release quality gates"
  duration_minutes: 300
  status: "draft"
  last_verified: "2026-08-26"
  audience:
    - "Microsoft Foundry agent and evaluation engineers"
    - "AI safety, quality, and application owners"
    - "Release owners responsible for agent promotion"
  prerequisites:
    - "Sessions 01-10 are complete in the full engagement path. For a focused route, confirm the platform inventory lists the exact nonproduction Foundry resource, project, policy-assistant agent, approved version, candidate version, and stable-endpoint selector."
    - "For a focused route, confirm the access, gateway, tool, and data records list the operator assignment, project-managed-identity assignment, APIM policy reference, get_policy allowlist, backend role definition ID and assignment scope, prohibited-write decision, and synthetic-data classification. The stable endpoint selects the approved version, get_policy reads successfully, and the prohibited write is absent or denied."
    - "The Session 06 policy assistant has a currently approved version and a separate candidate version in one nonproduction Foundry project."
    - "The Session 09 read-only tool path and prohibited write action remain available to the candidate agent."
    - "Before each run, the quality owner checks the selected region and evaluator set against the current Microsoft evaluation support documentation and records the manual support gate in the release policy; no stable support-discovery API is assumed."
    - "For a network-isolated project, the approved evaluation subnet is delegated."
    - "The Foundry project managed identity has Foundry User on the exact Foundry project."
    - "A judge-model deployment, evaluation budget, release owner, quality owner, tool owner, safety owner, and exception authority are approved."
    - "The evaluation operator has Foundry User on the exact Foundry project."
    - "Azure CLI is authenticated to the approved subscription."
  dependencies:
    - "Session 05 - Model governance, data residency, quota, and lifecycle"
    - "Session 06 - Governed Microsoft Foundry agent baseline"
    - "Session 09 - MCP and tool security"
    - "Session 10 - Purview data governance and Agent 365 data controls"
  services_in_scope:
    - "azure-ai-foundry"
    - "foundry-agent-service"
  control_objective: "Create and exercise a callable release-eligibility gate for exact agent versions using repeatable customer-specific evaluation results."
implementation:
  mode: "extended"
  extended_reason: "The release owner must observe both an approved version passing and a generated below-threshold result being blocked before the gate can protect a delivery path."
implementation_outcomes:
  - "Keep a versioned golden data set in the approved evaluation store covering normal, edge, refusal, multilingual, sensitive-data, tool-use, indirect-attack, and failure behavior."
  - "Run the same Foundry evaluation definition against an approved agent version and a candidate version."
  - "Save the quality-owner-approved relevance floor, tool-owner-approved tool accuracy and success floors, and safety-owner-approved safety floors in thresholds.yaml before calculating release thresholds from the approved baseline."
  - "Keep one release-policy configuration in the evaluation files for capability, ownership, threshold, exception, and gate decisions."
  - "Activate the callable release-eligibility gate, confirm that the approved version returns PASS, and confirm that the stable blocked self-test returns BLOCK. Session 14 can then place this contract in the promotion path."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/eval/evaluation-spec.json"
    - "implementation/artifacts/eval/data/golden-v1.jsonl"
    - "implementation/artifacts/eval/thresholds.yaml"
    - "implementation/artifacts/gate-tests/cases/tool-process-regression.json"
    - "implementation/artifacts/governance/evaluation-governance-decision.md"
    - "implementation/artifacts/release/release-policy.json"
    - "implementation/artifacts/release-records/release-record-template.json"
    - "implementation/artifacts/operations/disable-and-restore.md"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
    - "implementation/scripts/run-evaluation.py"
    - "implementation/scripts/release-gate.py"
    - "implementation/scripts/test_release_gate.py"
    - "implementation/scripts/requirements.txt"
retained_files:
  - path: "implementation/artifacts/eval/evaluation-spec.json"
    consumer: "The evaluation runner, release gate, preflight scripts, and Session 14 validators"
    operational_purpose: "Bind the approved and candidate agent versions, evaluator layers, dataset mappings, and aggregate-result rules."
  - path: "implementation/artifacts/eval/data/golden-v1.jsonl"
    consumer: "The evaluation runner and release gate"
    operational_purpose: "Supply the versioned synthetic cases used for both approved and candidate evaluation runs."
  - path: "implementation/artifacts/eval/thresholds.yaml"
    consumer: "The release gate, preflight scripts, and Session 14 validators"
    operational_purpose: "Store active baseline-derived thresholds, metric floors, and the non-overridable safety and tool-process boundary."
  - path: "implementation/artifacts/gate-tests/cases/tool-process-regression.json"
    consumer: "The release owner and Session 14 validators"
    operational_purpose: "Provide a payload-free regression case that proves tool-process failures block the release gate."
  - path: "implementation/artifacts/governance/evaluation-governance-decision.md"
    consumer: "The release, quality, tool, safety, and exception owners"
    operational_purpose: "Record who approved the evaluation thresholds, what remains draft, and which failures cannot be overridden."
  - path: "implementation/artifacts/release/release-policy.json"
    consumer: "The release owner, release gate, preflight scripts, and Session 14 promotion workflow"
    operational_purpose: "Bind current support, capability, ownership, exception, gate activation, and run-ID decisions."
  - path: "implementation/artifacts/release-records/release-record-template.json"
    consumer: "The release owner and audit reviewers"
    operational_purpose: "Define the payload-free aggregate record retained for release evaluation decisions."
  - path: "implementation/artifacts/operations/disable-and-restore.md"
    consumer: "The release owner and incident operator"
    operational_purpose: "Provide the ordered gate disable and approved-version restore procedure."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The PowerShell-based evaluation operator"
    operational_purpose: "Stop the run when support, scope, identity, dataset, policy, dependency, or activation inputs are invalid."
  - path: "implementation/scripts/preflight.sh"
    consumer: "The Bash-based evaluation operator"
    operational_purpose: "Apply the same readiness and activation-contract checks outside Windows."
  - path: "implementation/scripts/run-evaluation.py"
    consumer: "The evaluation operator"
    operational_purpose: "Run the approved Foundry evaluation and write its payload-free aggregate record."
  - path: "implementation/scripts/release-gate.py"
    consumer: "The release owner and Session 14 promotion workflow"
    operational_purpose: "Return PASS or BLOCK from active thresholds and require an approved activated policy for promotion."
  - path: "implementation/scripts/test_release_gate.py"
    consumer: "The release owner and Session 14 promotion workflow"
    operational_purpose: "Generate an in-memory below-threshold tool-process case and confirm that the callable gate blocks it."
  - path: "implementation/scripts/requirements.txt"
    consumer: "The approved Python environment"
    operational_purpose: "Install bounded dependencies needed by preflight, the runner, and the gate."
sources:
  - title: "Cloud Evaluation with the Microsoft Foundry SDK"
    url: "https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/cloud-evaluation"
    accessed: "2026-08-26"
    supports: "Cloud evaluations use the Foundry OpenAI-compatible Evals API, support agent targets and versioned datasets, store results in the Foundry project, and expose run and output-item results through the SDK."
  - title: "Evaluate your AI agents"
    url: "https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/evaluate-agent"
    accessed: "2026-08-25"
    supports: "Current agent-target data mappings, aggregate result shape, agent-version targeting, Foundry User prerequisite, and the azure-ai-projects 2.4 or later SDK path."
  - title: "Agent Evaluators for Generative AI"
    url: "https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/agent-evaluators"
    accessed: "2026-08-25"
    supports: "System and process evaluation split, agent message and tool-definition schemas, current tool evaluator inputs, and preview status for task adherence and task completion."
  - title: "Risk and Safety Evaluators for Generative AI"
    url: "https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators"
    accessed: "2026-08-25"
    supports: "Current content-risk, protected-material, prohibited-action, and sensitive-data-leakage evaluators; agent-only preview boundaries; and pass/fail result semantics."
  - title: "Rate limits, region support, and enterprise features for evaluation"
    url: "https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-regions-limits-virtual-network"
    accessed: "2026-08-26"
    supports: "The current region matrices, 100000-row and 2 MB row limits, subnet delegation for network isolation, and Foundry User requirement for the project managed identity. The release policy records a manual pre-run check because there is no available stable support-discovery API."
  - title: "Built-in Evaluators Reference"
    url: "https://learn.microsoft.com/en-us/azure/foundry/concepts/built-in-evaluators"
    accessed: "2026-08-25"
    supports: "Current evaluator catalog, stable and preview labels, evaluation levels, and guidance to combine agent, quality, and safety evaluators."
  - title: "See Evaluation Results in Microsoft Foundry portal"
    url: "https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluate-results"
    accessed: "2026-08-25"
    supports: "Aggregate and row-level result review, baseline comparison, statistical t-testing behavior, and the fact that comparison views are regenerated rather than retained."
  - title: "Azure AI Projects evaluation samples"
    url: "https://github.com/Azure/azure-sdk-for-python/tree/main/sdk/ai/azure-ai-projects/samples/evaluations"
    accessed: "2026-08-25"
    supports: "Runnable current SDK patterns for dataset upload, agent-target evaluation, run polling, and output-item retrieval."
  - title: "Role-based access control for Microsoft Foundry"
    url: "https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry"
    accessed: "2026-08-26"
    supports: "Foundry User authorizes project development and testing at the assigned Foundry project scope."
