schema_version: 2
session:
  id: "03"
  slug: "private-networking-dns"
  title: "Private networking, DNS, and controlled egress"
  duration_minutes: 180
  status: "draft"
  last_verified: "2026-08-28"
  audience:
    - "Cloud and network platform engineers"
    - "AI platform engineers"
    - "DNS, firewall, and security reviewers"
  prerequisites:
    - "Sessions 01 and 02 are complete. Session 01 owns the existing BYO VNet, route table, delegated Agent Service subnet, and private-endpoint subnet."
    - "The approved network design names the DNS pattern, customer firewall source, and execution host inside the private network."
    - "The network deployment operator has time-bound Network Contributor on the exact nonproduction resource group used for this session."
    - "The DNS operator has time-bound Private DNS Zone Contributor on the resource group that holds the seven zones, or on every reused zone."
    - "Preflight has the two operator object IDs and every exact DNS role-assignment scope."
    - "The Foundry, Storage, Azure AI Search, Cosmos DB, and Key Vault owners will approve private endpoint connections through the service change process."
    - "The approved change record names the cutover owner, restore owner, and location for the five prior public-access states."
  dependencies:
    - "Session 01 - Microsoft Foundry platform baseline, inventory, and landing-zone guardrails"
    - "Session 02 - Entra identity, RBAC, PIM, and workload identities"
  services_in_scope:
    - "azure-ai-foundry"
    - "azure-key-vault"
    - "azure-ai-search"
    - "azure-monitor"
    - "azure-private-link"
    - "azure-private-dns"
  control_objective: "Connect the existing Foundry account and four customer-provided dependencies through private endpoints, then disable public access after private DNS and TCP 443 checks succeed from the approved nonproduction execution host."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Deploy seven private DNS zones and links plus five private endpoints against the Session 01-owned VNet and private-endpoint subnet."
  - "Keep the delegated Agent Service subnet route to the customer firewall; firewall administrators maintain its rules in the customer firewall source."
  - "Confirm that three Foundry endpoint families and four dependency FQDNs resolve to private addresses and accept TCP 443 from the approved execution host."
  - "Record five prior public-access states in the approved change system, disable public access, and repeat the connectivity check."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/infra/network/main.bicep"
    - "implementation/artifacts/environments/sandbox.bicepparam"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/connectivity-check.ps1"
    - "implementation/scripts/public-access-cutover.ps1"
retained_files:
  - path: "implementation/artifacts/infra/network/main.bicep"
    consumer: "The network deployment pipeline"
    operational_purpose: "Deploy and maintain private DNS links and private endpoints that consume the Session 01-owned VNet and private-endpoint subnet."
  - path: "implementation/artifacts/environments/sandbox.bicepparam"
    consumer: "The network deployment pipeline"
    operational_purpose: "Supply the approved Session 01 network resource IDs, service resource IDs, and sandbox expiry."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The network deployment operator"
    operational_purpose: "Reject unresolved network decisions, unapproved Azure scope, or mismatched service resource identities and show the network deployment preview."
  - path: "implementation/scripts/connectivity-check.ps1"
    consumer: "The private client-path operator"
    operational_purpose: "Check live private DNS answers and TCP 443 connectivity for every configured endpoint."
  - path: "implementation/scripts/public-access-cutover.ps1"
    consumer: "The public-access cutover operator and affected service owners"
    operational_purpose: "Verify the private client path, require the approved change record to retain prior service states, and disable public access under a guarded change."
sources:
  - title: "How to configure network isolation for Microsoft Foundry"
    url: "https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link"
    accessed: "2026-08-28"
    supports: "Inbound, Foundry outbound, and Agent-client outbound boundaries; all Foundry endpoint families; private endpoint validation; agent-tool public endpoint caveats; BYO dependencies; firewall allowlisting; and the create-time network-injection limitation."
  - title: "Networking options for Foundry Agent Service"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/networking-options"
    accessed: "2026-08-24"
    supports: "BYO virtual network decisions, dedicated subnet requirements, RFC 1918 constraints, account-level scope, and immutable network injection."
  - title: "Set up private networking for Foundry Agent Service"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/virtual-networks"
    accessed: "2026-08-24"
    supports: "Microsoft.App/environments delegation, /27 minimum and /24 recommendation, separate private endpoints, DNS zones, public-access checks, and current limitations."
  - title: "Azure Private Endpoint private DNS zone values"
    url: "https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns"
    accessed: "2026-08-28"
    supports: "Current private DNS zones and public endpoint suffixes for all three Foundry endpoint families, Storage, AI Search, Cosmos DB, and Key Vault."
  - title: "Azure Private Endpoint DNS integration scenarios"
    url: "https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns-integration"
    accessed: "2026-08-24"
    supports: "Hub-and-spoke links, Azure DNS, custom DNS forwarding, and Azure Private Resolver patterns."
  - title: "Foundry Standard Agent Setup with end-to-end network isolation"
    url: "https://github.com/microsoft-foundry/foundry-samples/tree/main/infrastructure/infrastructure-setup-bicep/16-private-network-standard-agent-setup"
    accessed: "2026-08-24"
    supports: "Microsoft-maintained Bicep reference for the isolated Standard Agent topology and current DNS zone set."
  - title: "Configure managed virtual network for Microsoft Foundry projects"
    url: "https://learn.microsoft.com/en-us/azure/foundry/how-to/managed-virtual-network"
    accessed: "2026-08-28"
    supports: "Microsoft-managed network isolation as an architecture alternative that must be selected before this customer-managed VNet implementation begins."
  - title: "Azure built-in roles for Networking"
    url: "https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/networking"
    accessed: "2026-08-28"
    supports: "Stable role IDs and permissions for Network Contributor and Private DNS Zone Contributor."
