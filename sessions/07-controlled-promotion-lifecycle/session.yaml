schema_version: 2
session:
  id: "07"
  slug: "controlled-promotion-lifecycle"
  title: "Promote and operate the Citadel platform lifecycle"
  duration_minutes: 300
  status: "draft"
  last_verified: "2026-09-04"
  audience:
    - "AI platform, application, release, and GitHub engineers"
    - "Governance, estate, model lifecycle, and production approval owners"
  prerequisites:
    - "Sessions 02 and 04 have produced pinned Citadel source and customer-owned deployment and contract overlays."
    - "Session 05 has returned the current quality and security release decision."
    - "Session 06 has produced the smoke check, monitoring resource bindings, and incident owner."
    - "GitHub environments, Azure OIDC subjects, reviewers, deployment scopes, secret protection, and production restore authority are approved."
    - "The estate owner has completed `estate-scope.json` with approved subscriptions, account kinds, regions, tags, and exceptions."
  dependencies:
    - "Session 04 - Govern Citadel backends, access, tools, and agents"
    - "Session 05 - Evaluation, red-team, and threat release gates"
    - "Session 06 - Operate Citadel telemetry, cost, and incidents"
  services_in_scope:
    - "github-actions"
    - "microsoft-entra-workload-id"
    - "azure-ai-foundry"
    - "azure-api-management"
    - "azure-cost-management"
  control_objective: "Promote one immutable Citadel platform or workload change through protected environments, retain a restore path, and include the deployed estate in lifecycle and retirement operations."
implementation:
  mode: "extended"
  extended_reason: "The delivery owner must observe the permitted promotion and a blocked gate before accepting the production path."
implementation_outcomes:
  - "Bind pinned Citadel source, customer overlays, agent version, contracts, gates, and deployment parameters to one commit."
  - "Run protected preview and apply environments through Azure workload identity federation."
  - "Route traffic only after evaluation, security, and observability gates pass."
  - "Restore a selected previous release through the same protected path."
  - "Deploy the estate workbook and report unowned, noncompliant, deprecated, or retirement-affected Citadel resources."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/control-definition.json"
    - "implementation/artifacts/github/promotion.yml"
    - "implementation/artifacts/github/restore-previous-release.yml"
    - "implementation/artifacts/pipeline/release-manifest.template.json"
    - "implementation/artifacts/pipeline/validate-release.ps1"
    - "implementation/artifacts/pipeline/validate-release.sh"
    - "implementation/artifacts/environments/nonproduction.parameters.json"
    - "implementation/artifacts/environments/production.parameters.json"
    - "implementation/artifacts/estate/estate-scope.json"
    - "implementation/artifacts/estate/infra/main.bicep"
    - "implementation/artifacts/estate/monitoring/estate-lifecycle-workbook.json"
    - "implementation/artifacts/estate/queries/foundry-accounts.kql"
    - "implementation/artifacts/estate/queries/service-health-retirements.kql"
    - "implementation/artifacts/estate/queries/advisor-retirement-findings.kql"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
    - "implementation/scripts/verify.ps1"
    - "implementation/scripts/verify.sh"
    - "implementation/scripts/build-estate-report.ps1"
    - "implementation/scripts/build-estate-report.sh"
    - "implementation/scripts/build-estate-report.py"
    - "implementation/scripts/deploy-workbook.ps1"
    - "implementation/scripts/deploy-workbook.sh"
retained_files:
  - path: "implementation/artifacts/control-definition.json"
    consumer: "Citadel promotion workflows and validators"
    operational_purpose: "Define protected environments, OIDC trust, deployment scopes, gates, routing, and release-record lifecycle."
  - path: "implementation/artifacts/github/promotion.yml"
    consumer: "GitHub Actions and the release operator"
    operational_purpose: "Run preview, approval, deployment, smoke, routing, and release finalization for one immutable commit."
  - path: "implementation/artifacts/github/restore-previous-release.yml"
    consumer: "GitHub Actions and the restore operator"
    operational_purpose: "Restore a selected approved Citadel release through the protected production environment."
  - path: "implementation/artifacts/pipeline/release-manifest.template.json"
    consumer: "promotion workflow and approved release store"
    operational_purpose: "Define the release record that binds upstream commits, overlays, agent versions, contracts, and gate results."
  - path: "implementation/artifacts/pipeline/validate-release.ps1"
    consumer: "GitHub Actions workflow and PowerShell release operator"
    operational_purpose: "Reject releases with missing or mismatched Citadel, gate, smoke, and immutable metadata."
  - path: "implementation/artifacts/pipeline/validate-release.sh"
    consumer: "Bash-based release operator"
    operational_purpose: "Apply the same Citadel release validation outside Windows."
  - path: "implementation/artifacts/environments/nonproduction.parameters.json"
    consumer: "nonproduction preview and apply jobs"
    operational_purpose: "Supply the approved nonproduction Citadel deployment inputs."
  - path: "implementation/artifacts/environments/production.parameters.json"
    consumer: "production preview and apply jobs"
    operational_purpose: "Supply the matching production Citadel deployment inputs."
  - path: "implementation/artifacts/estate/estate-scope.json"
    consumer: "estate report scripts and platform inventory owner"
    operational_purpose: "Define the subscriptions, account kinds, regions, tags, and exceptions included in lifecycle operations."
  - path: "implementation/artifacts/estate/infra/main.bicep"
    consumer: "estate workbook deployment"
    operational_purpose: "Deploy the shared Citadel estate and lifecycle workbook."
  - path: "implementation/artifacts/estate/monitoring/estate-lifecycle-workbook.json"
    consumer: "shared Azure Workbook"
    operational_purpose: "Render live estate, model lifecycle, health, retirement, and cost views."
  - path: "implementation/artifacts/estate/queries/foundry-accounts.kql"
    consumer: "estate report and Azure Resource Graph Explorer"
    operational_purpose: "Return Azure AI accounts with region, kind, network setting, and tags."
  - path: "implementation/artifacts/estate/queries/service-health-retirements.kql"
    consumer: "estate report and Azure Resource Graph Explorer"
    operational_purpose: "Return active AI service and model retirement advisories."
  - path: "implementation/artifacts/estate/queries/advisor-retirement-findings.kql"
    consumer: "estate report and Azure Resource Graph Explorer"
    operational_purpose: "Return open service upgrade and retirement recommendations."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "PowerShell-based release operator"
    operational_purpose: "Reject incomplete controls, environment protections, OIDC trust, Azure roles, gate records, or deployment previews."
  - path: "implementation/scripts/preflight.sh"
    consumer: "Bash-based release operator"
    operational_purpose: "Apply the same release readiness checks outside Windows."
  - path: "implementation/scripts/verify.ps1"
    consumer: "PowerShell-based delivery owner"
    operational_purpose: "Confirm the intended or blocked workflow run and detect bypassed protected stages."
  - path: "implementation/scripts/verify.sh"
    consumer: "Bash-based delivery owner"
    operational_purpose: "Apply the same protected-run verification through GitHub APIs."
  - path: "implementation/scripts/build-estate-report.ps1"
    consumer: "PowerShell-based estate owner"
    operational_purpose: "Read the approved estate and add deployment, lifecycle, health, and retirement findings."
  - path: "implementation/scripts/build-estate-report.sh"
    consumer: "Bash-based estate owner"
    operational_purpose: "Run the same scheduled Citadel estate review outside Windows."
  - path: "implementation/scripts/build-estate-report.py"
    consumer: "estate report entry points"
    operational_purpose: "Join live Azure account, deployment, lifecycle, health, and Advisor data."
  - path: "implementation/scripts/deploy-workbook.ps1"
    consumer: "PowerShell-based estate operator"
    operational_purpose: "Deploy the shared Citadel estate workbook."
  - path: "implementation/scripts/deploy-workbook.sh"
    consumer: "Bash-based estate operator"
    operational_purpose: "Run the same workbook deployment outside Windows."
sources:
  - title: "Citadel release version management"
    url: "https://github.com/Azure-Samples/ai-hub-gateway-solution-accelerator/blob/citadel-v1/guides/release-version-management.md"
    accessed: "2026-09-04"
    supports: "Citadel release tracks, version endpoints, gateway upgrade scope, and rollback boundaries."
  - title: "Authenticate to Azure from GitHub Actions by OpenID Connect"
    url: "https://learn.microsoft.com/azure/developer/github/connect-from-azure-openid-connect"
    accessed: "2026-09-04"
    supports: "Azure Login can use Microsoft Entra workload identity federation without stored client secrets."
  - title: "GitHub Actions for Azure"
    url: "https://learn.microsoft.com/azure/developer/github/github-actions"
    accessed: "2026-09-04"
    supports: "Current GitHub Actions integration patterns for Azure deployments and workload identity federation."
  - title: "Microsoft Foundry Models lifecycle and support policy"
    url: "https://learn.microsoft.com/azure/foundry/openai/concepts/model-retirements"
    accessed: "2026-09-04"
    supports: "Current model lifecycle, deprecation, retirement, and Service Health notification behavior."
