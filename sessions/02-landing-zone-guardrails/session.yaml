schema_version: 2
session:
  id: "02"
  slug: "landing-zone-guardrails"
  title: "Landing-zone guardrails with Azure Policy"
  duration_minutes: 240
  status: "draft"
  last_verified: "2026-08-26"
  audience:
    - "Cloud and AI platform engineers"
    - "Azure landing-zone architects"
    - "Security, risk, and operations reviewers"
  prerequisites:
    - "Session 01 is complete, with an approved sandbox subscription, tagged resource group, and customer-owned repository."
    - "The deployment operator has a time-bound Resource Policy Contributor role assignment on the approved sandbox subscription; this scope covers the subscription policy set definition and the assignment on the exact Session 01 sandbox resource group."
    - "Azure CLI with Bicep support is installed, and Microsoft.PolicyInsights is registered."
    - "The approved sandbox regions, required tags, control owners, and promotion authority are known."
  dependencies:
    - "Session 01 - Microsoft Foundry platform baseline and inventory"
  services_in_scope:
    - "azure-policy"
  control_objective: "At the live assignment on the approved sandbox resource group, Azure Policy denies evaluated ARM changes that use disallowed locations or omit required resource tags."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Resolve the current Azure Policy built-ins for allowed locations and required resource tags."
  - "Deploy a reusable initiative and stage its assignment on the exact Session 01 sandbox resource group."
  - "Use one required-tag source for the initiative definition and assignment."
  - "Promote the assignment to Default only after the cloud platform owner reviews live Policy Insights results and the change authority approves enforcement."
  - "The live initiative and assignment match the approved resource-group scope, Default enforcement mode, allowed locations, required tags, and policy references; existing compliance remains a Policy Insights result."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/policy/initiative.bicep"
    - "implementation/artifacts/policy/assignment.bicep"
    - "implementation/artifacts/policy/guardrail-settings.json"
    - "implementation/artifacts/environments/initiative.bicepparam"
    - "implementation/artifacts/environments/sandbox.bicepparam"
    - "implementation/artifacts/governance/change-reference.md"
    - "implementation/scripts/resolve-builtins.ps1"
    - "implementation/scripts/preflight.ps1"
retained_files:
  - path: "implementation/artifacts/policy/initiative.bicep"
    consumer: "The subscription policy deployment pipeline"
    operational_purpose: "Define the allowed-locations and required-tags initiative from current built-in policy IDs."
  - path: "implementation/artifacts/policy/assignment.bicep"
    consumer: "The sandbox policy deployment pipeline"
    operational_purpose: "Assign the initiative to the approved resource group and move its enforcement mode through the authorized stage."
  - path: "implementation/artifacts/policy/guardrail-settings.json"
    consumer: "The initiative and assignment parameter builds"
    operational_purpose: "Supply one required-tag list to both policy definition and assignment parameters."
  - path: "implementation/artifacts/environments/initiative.bicepparam"
    consumer: "The subscription policy deployment pipeline"
    operational_purpose: "Bind the initiative name, live built-in IDs, and required-tag source for subscription deployment."
  - path: "implementation/artifacts/environments/sandbox.bicepparam"
    consumer: "The sandbox policy deployment pipeline"
    operational_purpose: "Bind the initiative ID, enforcement mode, allowed locations, and required-tag source for assignment."
  - path: "implementation/artifacts/governance/change-reference.md"
    consumer: "The cloud platform owner and change authority"
    operational_purpose: "Locate the customer change decision and any risk or exemption record without mirroring Azure Policy state."
  - path: "implementation/scripts/resolve-builtins.ps1"
    consumer: "The policy deployment operator"
    operational_purpose: "Resolve and inspect the current allowed-locations and required-tag built-ins before deployment."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The policy deployment operator"
    operational_purpose: "Reject tag-source divergence or an unapproved scope and show available initiative and assignment previews."
sources:
  - title: "Details of the policy assignment structure"
    url: "https://learn.microsoft.com/en-us/azure/governance/policy/concepts/assignment-structure"
    accessed: "2026-08-24"
    supports: "Assignment scope, parameters, definition versioning, resource selectors, and DoNotEnforce enforcement mode."
  - title: "Details of the initiative definition structure"
    url: "https://learn.microsoft.com/en-us/azure/governance/policy/concepts/initiative-definition-structure"
    accessed: "2026-08-24"
    supports: "Initiative parameters, policy definition references, reference IDs, and built-in version behavior."
  - title: "Get policy compliance data"
    url: "https://learn.microsoft.com/en-us/azure/governance/policy/how-to/get-compliance-data"
    accessed: "2026-08-24"
    supports: "Evaluation triggers, expected timing, on-demand scans, CLI commands, and policy state retrieval."
  - title: "Details of the policy exemption structure"
    url: "https://learn.microsoft.com/en-us/azure/governance/policy/concepts/exemption-structure"
    accessed: "2026-08-24"
    supports: "Exemption scope, categories, policyDefinitionReferenceId, metadata, and expiresOn behavior."
  - title: "List of built-in policy definitions"
    url: "https://learn.microsoft.com/en-us/azure/governance/policy/samples/built-in-policies"
    accessed: "2026-08-24"
    supports: "Current built-in policy catalog, effects, versions, and source links."
  - title: "Microsoft.Authorization policySetDefinitions"
    url: "https://learn.microsoft.com/en-us/azure/templates/microsoft.authorization/policysetdefinitions"
    accessed: "2026-08-24"
    supports: "Stable 2025-03-01 Bicep schema for subscription and management-group policy initiative definitions."
  - title: "Microsoft.Authorization policyAssignments"
    url: "https://learn.microsoft.com/en-us/azure/templates/microsoft.authorization/policyassignments"
    accessed: "2026-08-24"
    supports: "Stable 2025-03-01 Bicep schema for policy assignments and enforcementMode."
  - title: "Azure built-in roles for Management and governance"
    url: "https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/management-and-governance#resource-policy-contributor"
    accessed: "2026-08-26"
    supports: "Resource Policy Contributor actions for policy definitions, policy set definitions, assignments, exemptions, and policy insights."
