schema_version: 2
session:
  id: "01"
  slug: "platform-baseline"
  title: "Microsoft Foundry platform baseline, inventory, and landing-zone guardrails"
  duration_minutes: 300
  status: "draft"
  last_verified: "2026-08-28"
  audience:
    - "Cloud and AI platform engineers"
    - "Solution architects"
    - "Azure landing-zone architects"
    - "Security, risk, and operations reviewers"
  prerequisites:
    - "Complete engagement pre-work and approve the sandbox subscription, exact resource group, and customer-owned Git repository."
    - "Select `public`, `public-private-inbound`, or `byo-vnet` before creating the Foundry account. For `byo-vnet`, approve the subnet, route, firewall next hop, and network owner."
    - "Give the deployment operator Contributor on the approved sandbox scope and time-bound Resource Policy Contributor on the approved subscription."
    - "Allow deployment what-if at resource-group and subscription scope, and let the cloud platform owner review inherited policy assignments and exemptions."
    - "Register the required resource providers and identify the approved regions, governance tags, control owners, and promotion authority."
  dependencies:
    - "Engagement pre-work complete"
  services_in_scope:
    - "azure-ai-foundry"
    - "application-insights"
    - "azure-policy"
  control_objective: "Deploy an owned Microsoft Foundry baseline with workspace-based Application Insights, then stage resource-group guardrails before approved enforcement."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Select the network pattern before account creation and deploy the BYO VNet foundation when that pattern is approved."
  - "Deploy a tagged Microsoft Foundry resource and child project through Bicep with system-assigned identities and workspace-based Application Insights."
  - "Resolve the current allowed-location and required-tag built-ins, then stage their initiative on the same resource group in `DoNotEnforce`."
  - "Promote the assignment to `Default` after the cloud platform owner reviews current Policy Insights results and the change authority approves enforcement."
  - "Confirm that the baseline preview has no unintended changes and the live assignment matches the approved scope, locations, tags, and enforcement mode."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/infra/foundry/main.bicep"
    - "implementation/artifacts/infra/network/main.bicep"
    - "implementation/artifacts/environments/sandbox.bicepparam"
    - "implementation/artifacts/environments/network-foundation.bicepparam"
    - "implementation/artifacts/policy/initiative.bicep"
    - "implementation/artifacts/policy/assignment.bicep"
    - "implementation/artifacts/policy/guardrail-settings.json"
    - "implementation/artifacts/environments/initiative.bicepparam"
    - "implementation/artifacts/environments/policy-assignment.bicepparam"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/resolve-builtins.ps1"
retained_files:
  - path: "implementation/artifacts/infra/foundry/main.bicep"
    consumer: "The platform deployment pipeline"
    operational_purpose: "Deploy and maintain the Microsoft Foundry baseline in this repository."
  - path: "implementation/artifacts/infra/network/main.bicep"
    consumer: "The platform deployment pipeline"
    operational_purpose: "Deploy the dedicated BYO VNet foundation before it creates a Foundry account with network injection."
  - path: "implementation/artifacts/environments/sandbox.bicepparam"
    consumer: "The platform deployment pipeline"
    operational_purpose: "Supply the approved region, explicit network pattern, injected subnet ID when required, ownership tags, and expiry for the sandbox deployment."
  - path: "implementation/artifacts/environments/network-foundation.bicepparam"
    consumer: "The platform deployment pipeline"
    operational_purpose: "Supply approved BYO VNet address ranges and firewall next hop when Session 01 deploys the network foundation."
  - path: "implementation/artifacts/policy/initiative.bicep"
    consumer: "The subscription policy deployment pipeline"
    operational_purpose: "Define the allowed-locations and required-tags initiative from current built-in policy IDs."
  - path: "implementation/artifacts/policy/assignment.bicep"
    consumer: "The sandbox policy deployment pipeline"
    operational_purpose: "Assign the initiative to the approved resource group with `DoNotEnforce`, then change it to `Default` after review and approval."
  - path: "implementation/artifacts/policy/guardrail-settings.json"
    consumer: "The initiative and assignment parameter builds"
    operational_purpose: "Supply one required-tag list to both policy definition and assignment parameters."
  - path: "implementation/artifacts/environments/initiative.bicepparam"
    consumer: "The subscription policy deployment pipeline"
    operational_purpose: "Set the initiative name, live built-in IDs, and required-tag list from `implementation/artifacts/policy/guardrail-settings.json` for subscription deployment."
  - path: "implementation/artifacts/environments/policy-assignment.bicepparam"
    consumer: "The sandbox policy deployment pipeline"
    operational_purpose: "Set the initiative ID, enforcement mode, allowed locations, and required-tag list from `implementation/artifacts/policy/guardrail-settings.json` for assignment."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The baseline and policy deployment operator"
    operational_purpose: "Reject unresolved decisions, inconsistent required-tag inputs, and unapproved scopes. Show every available deployment preview before the operator deploys changes."
  - path: "implementation/scripts/resolve-builtins.ps1"
    consumer: "The policy deployment operator"
    operational_purpose: "Resolve and inspect the current allowed-locations and required-tag built-ins before deployment."
sources:
  - title: "What is Microsoft Foundry?"
    url: "https://learn.microsoft.com/en-us/azure/foundry/what-is-foundry"
    accessed: "2026-08-24"
