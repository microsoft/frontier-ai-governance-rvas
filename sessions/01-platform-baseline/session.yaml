schema_version: 2
session:
  id: "01"
  slug: "platform-baseline"
  title: "Microsoft Foundry platform baseline and inventory"
  duration_minutes: 210
  status: "draft"
  last_verified: "2026-08-24"
  audience:
    - "Cloud and AI platform engineers"
    - "Solution architects"
    - "Security and operations teams"
  prerequisites:
    - "Engagement pre-work is complete, including an approved sandbox subscription and customer-owned Git repository."
    - "The delivery region has been checked for the Foundry capabilities planned for the wider engagement."
    - "Azure CLI with Bicep support is installed, and the deployment operator has the Contributor role on the approved sandbox subscription when this session creates the resource group, or on the exact sandbox resource group when it already exists."
    - "The deployment operator can run deployment what-if at the exact sandbox resource-group scope."
    - "Microsoft.CognitiveServices, Microsoft.Insights, and Microsoft.OperationalInsights resource providers are registered."
  dependencies:
    - "Engagement pre-work complete"
  services_in_scope:
    - "azure-ai-foundry"
    - "application-insights"
  control_objective: "Establish one owned, tagged Microsoft Foundry baseline connected to workspace-based Application Insights through a repeatable deployment."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Deploy a tagged Microsoft Foundry resource and child project through Bicep with system-assigned managed identities."
  - "Connect the project to workspace-based Application Insights without putting credentials in parameters or outputs."
  - "Record the current resource-model decision and a pointer to the authoritative customer inventory item, plus a migration-backlog pointer when classic assets are in scope."
  - "A repeat Bicep deployment preview shows no unintended change to the operational baseline."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/infra/foundry/main.bicep"
    - "implementation/artifacts/environments/sandbox.bicepparam"
    - "implementation/artifacts/decisions/resource-model.md"
    - "implementation/scripts/preflight.ps1"
retained_files:
  - path: "implementation/artifacts/infra/foundry/main.bicep"
    consumer: "The platform deployment pipeline"
    operational_purpose: "Deploy and reconcile the repository-owned Microsoft Foundry baseline."
  - path: "implementation/artifacts/environments/sandbox.bicepparam"
    consumer: "The platform deployment pipeline"
    operational_purpose: "Supply the approved region, network posture, ownership tags, and expiry for the sandbox deployment."
  - path: "implementation/artifacts/decisions/resource-model.md"
    consumer: "The platform owner and operational inventory process"
    operational_purpose: "Carry the current resource-model decision and the pointer to live customer inventory or migration work."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The baseline deployment operator"
    operational_purpose: "Reject unresolved decisions or an unapproved scope and show the deployment preview before a state change."
sources:
  - title: "What is Microsoft Foundry?"
    url: "https://learn.microsoft.com/en-us/azure/foundry/what-is-foundry"
    accessed: "2026-08-24"
    supports: "Current Foundry resource and child-project model, unified management scope, and classic/current distinction."
  - title: "Quickstart: Deploy a Foundry resource by using Bicep"
    url: "https://learn.microsoft.com/en-us/azure/foundry/how-to/create-resource-template"
    accessed: "2026-08-24"
    supports: "Supported Bicep deployment path, current resource types, inventory command, and cleanup route."
  - title: "Microsoft.CognitiveServices/accounts 2026-05-01"
    url: "https://learn.microsoft.com/en-us/azure/templates/microsoft.cognitiveservices/2026-05-01/accounts"
    accessed: "2026-08-24"
    supports: "Stable account API, AIServices kind, system-assigned identity, project management, local authentication, tags, and public network properties."
  - title: "Microsoft.CognitiveServices/accounts/projects 2026-05-01"
    url: "https://learn.microsoft.com/en-us/azure/templates/microsoft.cognitiveservices/2026-05-01/accounts/projects"
    accessed: "2026-08-24"
    supports: "Stable child-project API, project identity, display properties, and tag support."
  - title: "Microsoft.CognitiveServices/accounts/projects/connections 2026-05-01"
    url: "https://learn.microsoft.com/en-us/azure/templates/microsoft.cognitiveservices/2026-05-01/accounts/projects/connections"
    accessed: "2026-08-24"
    supports: "Stable project connection resource and the AppInsights connection category."
  - title: "Set up tracing for AI agents in Microsoft Foundry"
    url: "https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-setup"
    accessed: "2026-08-24"
    supports: "Application Insights as the Foundry tracing store and current trace connection behavior."
  - title: "Bicep What-If: Preview changes before deployment"
    url: "https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-what-if"
    accessed: "2026-08-24"
    supports: "What-if behavior, permissions, current Azure CLI requirements, and machine-readable output."
  - title: "Template deployment what-if"
    url: "https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deploy-what-if"
    accessed: "2026-08-24"
    supports: "Expected Modify results for write-only properties and the need to classify what-if noise."
  - title: "Use tags to organize your Azure resources and management hierarchy"
    url: "https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources"
    accessed: "2026-08-24"
    supports: "Azure tag behavior, plain-text warning, inheritance limits, and tag access requirements."
  - title: "Migrate from the Foundry (classic) portal"
    url: "https://learn.microsoft.com/en-us/azure/foundry/how-to/navigate-from-classic"
    accessed: "2026-08-24"
    supports: "Current product naming, unchanged Azure resource provider, and handling of classic hub-based assets."
  - title: "Create a parameters file for Bicep deployment"
    url: "https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/parameter-files"
    accessed: "2026-08-24"
    supports: "Native bicepparam syntax, supported tool versions, and the rule against plain-text secrets."
  - title: "Recover or purge deleted Microsoft Foundry resources"
    url: "https://learn.microsoft.com/en-us/azure/ai-services/recover-purge-resources"
    accessed: "2026-08-24"
    supports: "Foundry resource soft deletion, the 48-hour name reuse limit, recovery, and irreversible purge requirements."
