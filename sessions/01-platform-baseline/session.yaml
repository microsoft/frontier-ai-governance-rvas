schema_version: 2
session:
  id: "01"
  slug: "platform-baseline"
  title: "Microsoft Foundry platform baseline, inventory, and landing-zone guardrails"
  duration_minutes: 300
  status: "draft"
  last_verified: "2026-08-28"
  audience:
    - "Cloud and AI platform engineers"
    - "Solution architects"
    - "Azure landing-zone architects"
    - "Security, risk, and operations reviewers"
  prerequisites:
    - "Complete engagement pre-work, including approval for the sandbox subscription and customer-owned Git repository."
    - "Check that the delivery region supports the Foundry capabilities planned for the wider engagement."
    - "Give the deployment operator Contributor on the approved sandbox subscription if this session creates the resource group. Otherwise, give Contributor on the exact sandbox resource group."
    - "Give the deployment operator a time-bound Resource Policy Contributor assignment on the approved sandbox subscription. It must cover the subscription policy set definition and assignment on the exact sandbox resource group."
    - "Allow the deployment operator to run deployment what-if at the exact sandbox resource-group and subscription scopes."
    - "Let the cloud platform owner review policy assignments inherited from the subscription and management-group hierarchy before this session changes the resource group."
    - "Register the Microsoft.CognitiveServices, Microsoft.Insights, Microsoft.OperationalInsights, and Microsoft.PolicyInsights resource providers."
    - "Identify the approved sandbox regions, required tags, control owners, and promotion authority."
  dependencies:
    - "Engagement pre-work complete"
  services_in_scope:
    - "azure-ai-foundry"
    - "application-insights"
    - "azure-policy"
  control_objective: "Deploy a tagged Microsoft Foundry baseline with workspace-based Application Insights. The tags name the business and technical owners. Stage an Azure Policy assignment that denies evaluated ARM changes with disallowed locations or missing required tags."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Deploy a tagged Microsoft Foundry resource and child project through Bicep, with system-assigned managed identities. Use the stable ApiKey Application Insights connection without credentials in parameters or outputs. Treat preview ProjectManagedIdentity trace ingestion as a later upgrade decision."
  - "Use the current Foundry resource and child-project model for new work. Record live resource details in the customer inventory system and confirmed classic migrations in the customer migration backlog."
  - "Resolve the current Azure Policy built-ins for allowed locations and required resource tags, including data classification and criticality. Deploy a reusable initiative and staged assignment to the same sandbox resource group. Use the required-tag list in `implementation/artifacts/policy/guardrail-settings.json`."
  - "Promote the assignment to Default after the cloud platform owner reviews live Policy Insights results and the change authority approves enforcement."
  - "Rerun the Bicep deployment preview and confirm that the operational baseline has no unintended changes. Check that the live initiative and assignment use the approved scope, enforcement mode, locations, and tags."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/infra/foundry/main.bicep"
    - "implementation/artifacts/environments/sandbox.bicepparam"
    - "implementation/artifacts/policy/initiative.bicep"
    - "implementation/artifacts/policy/assignment.bicep"
    - "implementation/artifacts/policy/guardrail-settings.json"
    - "implementation/artifacts/environments/initiative.bicepparam"
    - "implementation/artifacts/environments/policy-assignment.bicepparam"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/resolve-builtins.ps1"
retained_files:
  - path: "implementation/artifacts/infra/foundry/main.bicep"
    consumer: "The platform deployment pipeline"
    operational_purpose: "Deploy and maintain the Microsoft Foundry baseline in this repository."
  - path: "implementation/artifacts/environments/sandbox.bicepparam"
    consumer: "The platform deployment pipeline"
    operational_purpose: "Supply the approved region, network posture, ownership tags, and expiry for the sandbox deployment."
  - path: "implementation/artifacts/policy/initiative.bicep"
    consumer: "The subscription policy deployment pipeline"
    operational_purpose: "Define the allowed-locations and required-tags initiative from current built-in policy IDs."
  - path: "implementation/artifacts/policy/assignment.bicep"
    consumer: "The sandbox policy deployment pipeline"
    operational_purpose: "Assign the initiative to the approved resource group with `DoNotEnforce`, then change it to `Default` after review and approval."
  - path: "implementation/artifacts/policy/guardrail-settings.json"
    consumer: "The initiative and assignment parameter builds"
    operational_purpose: "Supply one required-tag list to both policy definition and assignment parameters."
  - path: "implementation/artifacts/environments/initiative.bicepparam"
    consumer: "The subscription policy deployment pipeline"
    operational_purpose: "Set the initiative name, live built-in IDs, and required-tag list from `implementation/artifacts/policy/guardrail-settings.json` for subscription deployment."
  - path: "implementation/artifacts/environments/policy-assignment.bicepparam"
    consumer: "The sandbox policy deployment pipeline"
    operational_purpose: "Set the initiative ID, enforcement mode, allowed locations, and required-tag list from `implementation/artifacts/policy/guardrail-settings.json` for assignment."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The baseline and policy deployment operator"
    operational_purpose: "Reject unresolved decisions, inconsistent required-tag inputs, and unapproved scopes. Show every available deployment preview before the operator deploys changes."
  - path: "implementation/scripts/resolve-builtins.ps1"
    consumer: "The policy deployment operator"
    operational_purpose: "Resolve and inspect the current allowed-locations and required-tag built-ins before deployment."
sources:
