  - title: "Quickstart: Deploy a Foundry resource by using Bicep"
    url: "https://learn.microsoft.com/en-us/azure/foundry/how-to/create-resource-template"
    accessed: "2026-08-24"
    supports: "Supported Bicep deployment path, current resource types, inventory command, and removal route."
  - title: "Microsoft.CognitiveServices/accounts 2026-05-01"
    url: "https://learn.microsoft.com/en-us/azure/templates/microsoft.cognitiveservices/2026-05-01/accounts"
    accessed: "2026-08-24"
