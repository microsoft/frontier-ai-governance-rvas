schema_version: 2
session:
  id: "01"
  slug: "platform-baseline"
  title: "Microsoft Foundry platform baseline, inventory, and landing-zone guardrails"
  duration_minutes: 300
  status: "draft"
  last_verified: "2026-08-28"
  audience:
    - "Cloud and AI platform engineers"
    - "Solution architects"
    - "Azure landing-zone architects"
    - "Security, risk, and operations reviewers"
  prerequisites:
    - "Engagement pre-work is complete, including an approved sandbox subscription and customer-owned Git repository."
    - "The delivery region has been checked for the Foundry capabilities planned for the wider engagement."
    - "The deployment operator has the Contributor role on the approved sandbox subscription when this session creates the resource group, or on the exact sandbox resource group when it already exists."
    - "The deployment operator also has a time-bound Resource Policy Contributor role assignment on the approved sandbox subscription, covering the subscription policy set definition and the assignment on the exact sandbox resource group."
    - "The deployment operator can run deployment what-if at the exact sandbox resource-group scope and at the subscription scope."
    - "The cloud platform owner can review policy assignments inherited from the subscription and management-group hierarchy before this session changes the resource group."
    - "Microsoft.CognitiveServices, Microsoft.Insights, Microsoft.OperationalInsights, and Microsoft.PolicyInsights resource providers are registered."
    - "The approved sandbox regions, required tags, control owners, and promotion authority are known."
  dependencies:
    - "Engagement pre-work complete"
  services_in_scope:
    - "azure-ai-foundry"
    - "application-insights"
    - "azure-policy"
  control_objective: "Deploy an owned, tagged Microsoft Foundry baseline with workspace-based Application Insights. Stage an Azure Policy assignment that denies evaluated ARM changes with disallowed locations or missing required tags."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Deploy a tagged Microsoft Foundry resource and child project through Bicep, with system-assigned managed identities. Use the stable ApiKey Application Insights connection without credentials in parameters or outputs; treat preview ProjectManagedIdentity trace ingestion as a later upgrade decision."
  - "Use the current Foundry resource and child-project model for new work; keep live inventory and any classic migration backlog in the customer systems that own them."
  - "Resolve the current Azure Policy built-ins for allowed locations and required resource tags, including data classification and criticality. Then deploy a reusable initiative and staged assignment to the same sandbox resource group from a single required-tag source."
  - "Promote the assignment to Default only after the cloud platform owner reviews live Policy Insights results and the change authority approves enforcement."
  - "Rerun the Bicep deployment preview to confirm that the operational baseline has no unintended changes. Check that the live initiative and assignment match the approved scope, enforcement mode, locations, and tags."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/infra/foundry/main.bicep"
    - "implementation/artifacts/environments/sandbox.bicepparam"
    - "implementation/artifacts/policy/initiative.bicep"
    - "implementation/artifacts/policy/assignment.bicep"
    - "implementation/artifacts/policy/guardrail-settings.json"
    - "implementation/artifacts/environments/initiative.bicepparam"
    - "implementation/artifacts/environments/policy-assignment.bicepparam"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/resolve-builtins.ps1"
retained_files:
  - path: "implementation/artifacts/infra/foundry/main.bicep"
    consumer: "The platform deployment pipeline"
    operational_purpose: "Deploy and maintain the repository-owned Microsoft Foundry baseline."
  - path: "implementation/artifacts/environments/sandbox.bicepparam"
    consumer: "The platform deployment pipeline"
    operational_purpose: "Supply the approved region, network posture, ownership tags, and expiry for the sandbox deployment."
  - path: "implementation/artifacts/policy/initiative.bicep"
    consumer: "The subscription policy deployment pipeline"
    operational_purpose: "Define the allowed-locations and required-tags initiative from current built-in policy IDs."
  - path: "implementation/artifacts/policy/assignment.bicep"
    consumer: "The sandbox policy deployment pipeline"
    operational_purpose: "Assign the initiative to the approved resource group and move its enforcement mode through the authorized stage."
  - path: "implementation/artifacts/policy/guardrail-settings.json"
    consumer: "The initiative and assignment parameter builds"
    operational_purpose: "Supply one required-tag list to both policy definition and assignment parameters."
  - path: "implementation/artifacts/environments/initiative.bicepparam"
    consumer: "The subscription policy deployment pipeline"
    operational_purpose: "Set the initiative name, live built-in IDs, and required-tag source for subscription deployment."
  - path: "implementation/artifacts/environments/policy-assignment.bicepparam"
    consumer: "The sandbox policy deployment pipeline"
    operational_purpose: "Set the initiative ID, enforcement mode, allowed locations, and required-tag source for assignment."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The baseline and policy deployment operator"
    operational_purpose: "Reject unresolved decisions, tag-source divergence, or an unapproved scope and show every available deployment preview before a state change."
  - path: "implementation/scripts/resolve-builtins.ps1"
    consumer: "The policy deployment operator"
    operational_purpose: "Resolve and inspect the current allowed-locations and required-tag built-ins before deployment."
