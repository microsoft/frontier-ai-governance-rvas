schema_version: 2
session:
  id: "14"
  slug: "agent-fleet-multiregion-rehearsal"
  title: "Regional failover rehearsal for a governed AI service"
  duration_minutes: 180
  status: "draft"
  last_verified: "2026-08-28"
  audience:
    - "AI platform, service continuity, and API Management engineers"
    - "Service and delivery owners"
  prerequisites:
    - "The governed service has deployed primary and secondary paths."
    - "The platform owner confirms the immutable agent version and Entra identity."
    - "The gateway owner confirms the API Management policy version and both endpoints."
    - "The primary path reports the expected trace fields. (Sessions 04, 07, 09, 12, and 13.)"
    - "The approved change record names the exact resource-group scope and both selectors. It also names the maintenance window, delivery owner, and restore owner."
    - "The approved PowerShell and Bash health controls accept the documented parameters."
    - "The approved PowerShell and Bash routing controls accept the documented parameters. The routing owner confirms that `Preview`, `Failover`, and `Restore` change only the named selector."
    - "The rehearsal operator has time-bound access for the exact approved scope. The customer access process removes it after the rehearsal."
    - "An existing customer-managed runtime directory is available outside the repository for temporary health results."
  dependencies:
    - "Session 04 - Governed Microsoft Foundry agent baseline"
    - "Session 07 - Azure API Management AI gateway implementation"
    - "Session 09 - MCP and tool security"
    - "Session 12 - Observability, cost, and operational controls"
    - "Session 13 - CI/CD, policy as code, and controlled promotion"
  services_in_scope:
    - "azure-ai-foundry"
    - "foundry-agent-service"
    - "azure-api-management"
    - "azure-monitor"
  control_objective: "Rehearse failover for one governed AI service. Preview and approve one selector move to the deployed secondary path. Check it, then restore and check the primary path."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Record the approved scope and both selectors."
  - "Record the expected agent version, Entra identity, API Management policy version, endpoint, and trace fields."
  - "Check that the primary path is active and the secondary path is ready before traffic moves."
  - "Preview the move to the secondary path, get delivery-owner approval, move the selector, and check the secondary path."
  - "Preview the return move, restore the primary path, and check the same values."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/control-definition.json"
    - "implementation/artifacts/regional/region.parameters.json"
    - "implementation/artifacts/regional/failover-runbook.md"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
    - "implementation/scripts/rehearse-failover.ps1"
    - "implementation/scripts/rehearse-failover.sh"
retained_files:
  - path: "implementation/artifacts/control-definition.json"
    consumer: "The Session 14 preflight scripts and regional rehearsal operators"
    operational_purpose: "Bind the approved scope to the customer health and routing controls."
  - path: "implementation/artifacts/regional/region.parameters.json"
    consumer: "The Session 14 preflight scripts and rehearsal wrappers"
    operational_purpose: "Supply both selectors and the values used to check each path."
  - path: "implementation/artifacts/regional/failover-runbook.md"
    consumer: "The service continuity and routing operators"
    operational_purpose: "Direct the preview, selector move, path check, and restore without retaining runtime results."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The PowerShell-based regional readiness operator"
    operational_purpose: "Check the scope, contract, customer controls, and active primary path."
  - path: "implementation/scripts/preflight.sh"
    consumer: "The Bash-based regional readiness operator"
    operational_purpose: "Run the same scope, contract, customer-control, and active-primary checks outside Windows."
  - path: "implementation/scripts/rehearse-failover.ps1"
    consumer: "The PowerShell-based regional failover operator"
    operational_purpose: "Preview the move, check the secondary path, restore the primary selector, and check it."
  - path: "implementation/scripts/rehearse-failover.sh"
    consumer: "The Bash-based regional failover operator"
    operational_purpose: "Run the same move, health, restore, and primary-path checks."
sources:
  - title: "Deploy an Azure API Management instance to multiple Azure regions"
    url: "https://learn.microsoft.com/en-us/azure/api-management/api-management-howto-deploy-multi-region"
    accessed: "2026-08-26"
    supports: "Premium multi-region replicates gateways only; management and developer portals remain in the primary region, internal mode needs customer routing, and rate and token counters operate per regional gateway."
  - title: "Reliability in Azure API Management"
    url: "https://learn.microsoft.com/en-us/azure/reliability/reliability-api-management"
    accessed: "2026-08-26"
    supports: "Premium (classic) supports multi-region deployment; Premium v2 supports zones but not multi-region deployment."
