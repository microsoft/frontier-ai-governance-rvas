schema_version: 2
session:
  id: "08"
  slug: "mcp-tool-security"
  title: "MCP and tool security"
  duration_minutes: 270
  status: "draft"
  last_verified: "2026-08-28"
  audience:
    - "API platform and Microsoft Foundry engineers"
    - "Identity, application security, and AI safety engineers"
    - "Release owners responsible for enabling agent tool access"
  prerequisites:
    - "Sessions 01-06 are complete in the approved nonproduction scope."
    - "The Session 05 policy assistant, Session 06 API Management instance, and Session 07 API Center inventory are available."
    - "An existing APIM-managed GET operation reads a synthetic policy record and performs no mutation."
    - "The Session 06 API Management instance has a system-assigned identity."
    - "The Session 06 API Management instance has an Application Insights logger with request and response body logging set to zero bytes."
    - "The Session 06 API Management instance uses Developer, Basic, Basic v2, Standard, Standard v2, Premium, or Premium v2, and is not an API Management workspace."
    - "The deployment operator has a time-bound Contributor role assignment on the exact resource group that contains the Session 06 API Management instance."
    - "The agent operator has Foundry User on the exact Session 05 Foundry project."
    - "An Entra application audience and app role are approved for the Foundry agent-to-APIM call."
    - "The API Management system-assigned identity has the approved backend role definition ID at the exact backend resource scope. The role contains only the read Actions or DataActions required by get_policy, and preflight rejects wildcard, write, delete, and action permissions."
    - "The release owner, data owner, security owner, and prohibited write action are recorded."
    - "All implementation file details are complete and the API Center metadata update process is agreed before the session."
  dependencies:
    - "Session 02 - Entra identity, RBAC, PIM, and workload identities"
    - "Session 05 - Governed Microsoft Foundry agent baseline"
    - "Session 06 - Azure API Management as the AI gateway"
    - "Session 07 - Azure API Center and the AI/MCP inventory"
  services_in_scope:
    - "azure-api-management"
    - "azure-api-center"
    - "azure-ai-foundry"
    - "microsoft-entra-id"
    - "application-insights"
  control_objective: "Configure an MCP path that exposes only get_policy, validates the candidate agent at APIM, uses a separate read-only managed identity from APIM to the backend, and emits payload-free telemetry. Keep the stable endpoint on the prior version until the release owner observes both checks."
implementation:
  mode: "extended"
  extended_reason: "The release owner must observe an approved read and a blocked prohibited write before the candidate agent version can enable the MCP path."
implementation_outcomes:
  - "Expose the existing read-only API operation as the only Streamable HTTP MCP tool through API Management."
  - "Validate the candidate agent's Entra identity and approved MCP audience and app role at APIM."
  - "Replace inbound authority with APIM's read-only managed identity for the exact backend scope."
  - "Record tool and correlation telemetry without arguments, results, prompts, responses, or bodies."
  - "Keep the agent-to-MCP binding and threat model, then hold the release checkpoint until an approved read succeeds and indirect prompt injection cannot trigger the prohibited write."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/apim/main.bicep"
    - "implementation/artifacts/apim/policies/mcp-policy.xml"
    - "implementation/artifacts/environments/sandbox.json"
    - "implementation/artifacts/governance/agent-mcp-binding.json"
    - "implementation/artifacts/governance/security-evaluation.md"
    - "implementation/artifacts/governance/threat-model.md"
    - "implementation/artifacts/operations/mcp-traffic.kql"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/deploy.ps1"
retained_files:
  - path: "implementation/artifacts/apim/main.bicep"
    consumer: "The Session 08 APIM deployment scripts"
    operational_purpose: "Deploy and update the MCP server, its only tool, identity settings, policy, and payload-free diagnostic."
  - path: "implementation/artifacts/apim/policies/mcp-policy.xml"
    consumer: "The API Management MCP runtime"
    operational_purpose: "Validate the agent token, throttle tool calls, add correlation, and replace caller authority with managed identity."
  - path: "implementation/artifacts/environments/sandbox.json"
    consumer: "The Session 08 preflight and deployment scripts"
    operational_purpose: "Bind APIM, Foundry, identity, backend authorization, telemetry, and synthetic checks to the approved scope."
  - path: "implementation/artifacts/governance/agent-mcp-binding.json"
    consumer: "The Foundry agent release owner"
    operational_purpose: "Configure the candidate agent with the approved MCP tool, mandatory approval, and no direct OpenAPI bypass."
  - path: "implementation/artifacts/governance/security-evaluation.md"
    consumer: "The security owner running the Foundry candidate-version checks"
    operational_purpose: "Guide the security owner's checks before every candidate enablement and after a security-relevant change."
  - path: "implementation/artifacts/governance/threat-model.md"
    consumer: "The security and identity owners"
    operational_purpose: "Maintain the authorization boundaries, abuse controls, disable switch, and restore order every 90 days and before a material design change."
  - path: "implementation/artifacts/operations/mcp-traffic.kql"
    consumer: "The APIM operations owner"
    operational_purpose: "Trace tool, client, correlation, latency, and status without reading arguments or results."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The APIM MCP deployment operator"
    operational_purpose: "Check that only the approved tool is exposed, along with identities, backend read role, payload-free diagnostics, scope, and ARM what-if."
  - path: "implementation/scripts/deploy.ps1"
    consumer: "The APIM MCP deployment operator"
    operational_purpose: "Deploy the marked Session 08 MCP API, tool, policy, APIM named values, and diagnostic."
sources:
  - title: "Overview of MCP servers in Azure API Management"
    url: "https://learn.microsoft.com/en-us/azure/api-management/mcp-server-overview"
    accessed: "2026-08-26"
    supports: "APIM supports MCP tools on Developer, Basic, Standard, Premium, and v2 tiers; policies govern all exposed tools; MCP resources and prompts and APIM workspaces are not supported."
  - title: "Manage MCP servers programmatically in API Management"
    url: "https://learn.microsoft.com/en-us/azure/api-management/manage-mcp-servers-rest-api"
    accessed: "2026-08-26"
    supports: "The 2025-09-01-preview management API models MCP servers, tool subresources, policies, product bindings, Streamable HTTP passthrough, Bicep, and idempotent CI/CD operations."
  - title: "Expose REST API as MCP server"
    url: "https://learn.microsoft.com/en-us/azure/api-management/export-rest-mcp-server"
    accessed: "2026-08-25"
    supports: "Existing APIM REST operations can be exposed as selected MCP tools; MCP policies apply to all tools and must not read response bodies because that breaks streaming."
  - title: "Secure access to MCP servers in Azure API Management"
    url: "https://learn.microsoft.com/en-us/azure/api-management/secure-mcp-servers"
    accessed: "2026-08-25"
    supports: "Inbound Entra token validation and a distinct outbound application-only authentication hop using APIM credential or managed-identity policies without forwarding the inbound token to the backend."
  - title: "Monitor MCP Server Traffic in Azure API Management"
    url: "https://learn.microsoft.com/en-us/azure/api-management/monitor-mcp-servers"
    accessed: "2026-08-28"
    supports: "Default MCP telemetry dimensions include operation, tool, conversation, client, service, auth, duration, and error fields; custom trace dimensions can add a client correlation value without payload capture."
  - title: "Application Insights telemetry data model"
    url: "https://learn.microsoft.com/en-us/azure/azure-monitor/app/data-model-complete"
    accessed: "2026-08-28"
    supports: "Application Insights operation_Id is the root operation identifier used to group telemetry across components, with operation_ParentId linking immediate parent spans."
  - title: "Forward request policy"
    url: "https://learn.microsoft.com/en-us/azure/api-management/forward-request-policy"
    accessed: "2026-08-28"
    supports: "With fail-on-error-status-code set to false, backend 4xx and 5xx responses remain on the normal response path instead of triggering the APIM on-error section."
  - title: "Connect agents to MCP server endpoints"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/model-context-protocol"
    accessed: "2026-08-25"
    supports: "Foundry agents support remote MCP tools, project connections, allowed_tools, approval settings, and guidance to treat tool metadata and results as untrusted input."
  - title: "Set up MCP server authentication"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/mcp-authentication"
    accessed: "2026-08-25"
    supports: "Foundry supports agent identity and project managed identity for shared, secretless, application-only MCP authentication; the downstream service must receive a role assignment at its exact resource scope."
  - title: "Transports - Model Context Protocol"
    url: "https://modelcontextprotocol.io/specification/2025-06-18/basic/transports"
    accessed: "2026-08-25"
    supports: "Streamable HTTP replaces HTTP+SSE, uses one MCP endpoint, and requires Origin validation plus authentication for remote deployments."
  - title: "Role-based access control for Microsoft Foundry"
    url: "https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry"
    accessed: "2026-08-26"
    supports: "Foundry User authorizes building and testing agents in the assigned Foundry project; Foundry Agent Consumer is for endpoint invocation only."
  - title: "Azure built-in roles for Privileged"
    url: "https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/privileged"
    accessed: "2026-08-26"
    supports: "Contributor can create and manage resources in the assigned scope but cannot create Azure role assignments."
