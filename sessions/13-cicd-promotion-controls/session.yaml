schema_version: 2
session:
  id: "13"
  slug: "cicd-promotion-controls"
  title: "CI/CD, policy as code, and controlled promotion"
  duration_minutes: 240
  status: "draft"
  last_verified: "2026-08-28"
  audience:
    - "AI application, platform, and release engineers"
    - "GitHub, Microsoft Entra, Azure, and API Management administrators"
    - "Quality, security, routing, production-approval, and delivery owners"
  prerequisites:
    - "Complete Sessions 04, 07, and 09-12, or verify the same immutable-agent, gateway, evaluation, adversarial, and observability control states with their named owners."
    - "Release metadata binds the prompt, agent, model, APIM policy, evaluation inputs, and Bicep parameters to one commit. Supply the approved full SHA through the protected workflow input, never inside that commit."
    - "The approved Session 10 release policy is enabled. Its temporary external baseline and candidate records match the policy run IDs, the callable gate passes the candidate, and the generated tool-process self-test returns BLOCK."
    - "The approved temporary workspace contains a confirmed, payload-free Session 11 security-release attestation for the same immutable agent and versions. It records external authorization and report locations, lower aggregate attack success, per-risk non-regression, and blocked prohibited actions. SOC delivery remains separate."
    - "The Session 12 PowerShell and Bash smoke executables verify the release commit, live Application Insights workspace binding, distinct normal and failure trace IDs, stable ingestion, separated tool and model failures, no sensitive input, and no retained payload."
    - "The unit-check, routing, release/security-store, and environment-parameter owners have accepted their files. The delivery owner has recorded those decisions."
    - "GitHub environments `nonproduction-preview`, `nonproduction`, `production-preview`, and `production` are configured. Both apply environments require reviewers and prevent self-review; production also restricts deployment refs and disables administrator bypass."
    - "Native secret scanning and push protection are enabled. The protected `nonproduction` environment holds the Session 12 URLs, Application Insights resource ID, Log Analytics workspace ID, bearer-token secret, and optional timeout and retry overrides."
    - "The nonproduction and production workload service principals each trust their exact preview and apply GitHub OIDC subjects. Each principal has only Contributor (role ID `b24988ac-6180-42a0-ab88-20f7382dd24c`) at its environment resource-group scope."
    - "GitHub and Entra administrators use temporary access for configuration and preflight. The preflight operator has temporary Directory Readers at tenant scope and Contributor at both exact environment resource-group scopes. Remove or expire human access after the ready check."
    - "The approved release/security-store interface retrieves temporary Session 10 and 11 records, and stages, approves, or retrieves a release record by exact release ID and SHA-256. Promotion approves the record only after routing; restore consumes an approved record."
    - "Release, quality, security, production-approval, routing, platform, observability, and delivery authorities are named and available for live decisions."
  dependencies:
    - "Session 04 - Governed Microsoft Foundry agent baseline"
    - "Session 07 - Azure API Management AI gateway implementation"
    - "Session 10 - Foundry evaluations and release quality gates"
    - "Session 11 - Red teaming, prompt injection, and Defender"
    - "Session 12 - Observability, cost, and operational controls"
  services_in_scope:
    - "github-actions"
    - "microsoft-entra-workload-id"
    - "azure-ai-foundry"
    - "azure-api-management"
    - "application-insights"
  control_objective: "Promote one immutable, gate-passing release through protected nonproduction and production environments. Tie approval, deployment, routing, and restore to the same commit SHA."
implementation:
  mode: "extended"
  extended_reason: "The delivery owner must observe the permitted promotion path and the blocked evaluation path before accepting the checkpoint."
implementation_outcomes:
  - "Prove the approved full SHA is reachable from the protected default branch, then deploy that same commit through environment-scoped Azure OIDC."
  - "Run unit, evaluation, adversarial, and observability gates before deployment, including the generated Session 10 blocked self-test."
  - "Run Bicep what-if in each preview environment and require approval in the matching apply environment."
  - "Tie approvals, both deployments, routing, the approved release record, and manual restore to one selected release SHA."
  - "Confirm the permitted path and blocked path, then pause for the delivery owner."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/control-definition.json"
    - "implementation/artifacts/github/promotion.yml"
    - "implementation/artifacts/github/restore-previous-release.yml"
    - "implementation/artifacts/pipeline/release-manifest.template.json"
    - "implementation/artifacts/pipeline/validate-release.ps1"
    - "implementation/artifacts/pipeline/validate-release.sh"
    - "implementation/artifacts/environments/nonproduction.parameters.json"
    - "implementation/artifacts/environments/production.parameters.json"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
    - "implementation/scripts/verify.ps1"
    - "implementation/scripts/verify.sh"
retained_files:
  - path: "implementation/artifacts/control-definition.json"
    consumer: "The Session 13 validators, preflight scripts, and GitHub Actions workflows"
    operational_purpose: "Define the GitHub environments, OIDC trust, Azure scopes, gates, routing settings, required fields for temporary external gate artifacts, and release-record lifecycle that the promotion workflows use."
  - path: "implementation/artifacts/github/promotion.yml"
    consumer: "GitHub Actions and the release operator"
    operational_purpose: "Run the gated preview, approval, deployment, smoke, routing, and release-record finalization sequence for one immutable release."
  - path: "implementation/artifacts/github/restore-previous-release.yml"
    consumer: "GitHub Actions and the production restore operator"
    operational_purpose: "Run a manual, production-approved restore to one selected immutable release."
  - path: "implementation/artifacts/pipeline/release-manifest.template.json"
    consumer: "The promotion workflow and approved release store"
    operational_purpose: "Define the small release record written by each successful production promotion and read by the manual restore workflow."
  - path: "implementation/artifacts/pipeline/validate-release.ps1"
    consumer: "The GitHub Actions workflow and PowerShell-based release operator"
    operational_purpose: "Enforce release-policy activation, temporary external gate-artifact binding, smoke, workflow, immutable metadata, and release-record checks without retaining runtime artifacts."
  - path: "implementation/artifacts/pipeline/validate-release.sh"
    consumer: "The Bash-based release operator"
    operational_purpose: "Apply the same release-policy, temporary external gate-artifact, smoke, workflow, immutable metadata, and release-record checks outside the Windows workflow without retaining runtime artifacts."
  - path: "implementation/artifacts/environments/nonproduction.parameters.json"
    consumer: "The nonproduction preview and apply jobs"
    operational_purpose: "Supply the approved nonproduction deployment inputs for the immutable release."
  - path: "implementation/artifacts/environments/production.parameters.json"
    consumer: "The production preview and apply jobs"
    operational_purpose: "Supply the matching production deployment inputs for the immutable release."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The PowerShell-based release readiness operator"
    operational_purpose: "Stop promotion when local definitions, required temporary external gate artifacts, GitHub protections, smoke input names, Entra federation, Azure roles, or what-if checks fail."
  - path: "implementation/scripts/preflight.sh"
    consumer: "The Bash-based release readiness operator"
    operational_purpose: "Apply the same local, temporary external gate-artifact, GitHub, smoke-input, Entra, Azure role, and what-if readiness checks."
  - path: "implementation/scripts/verify.ps1"
    consumer: "The PowerShell-based delivery owner"
    operational_purpose: "Verify the intended or generated blocked GitHub Actions run and confirm no protected stage was bypassed."
  - path: "implementation/scripts/verify.sh"
    consumer: "The Bash-based delivery owner"
    operational_purpose: "Apply the same intended or generated blocked run verification through GitHub APIs."
sources:
  - title: "Authenticate to Azure from GitHub Actions by OpenID Connect"
    url: "https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect"
    accessed: "2026-08-25"
    supports: "Azure Login can use Microsoft Entra workload identity federation and OIDC without a client secret; environment-scoped values can be supplied by GitHub environments."
  - title: "OpenID Connect reference"
    url: "https://docs.github.com/en/actions/reference/security/oidc"
    accessed: "2026-08-28"
    supports: "GitHub OIDC requires `id-token: write`, an explicit trust condition, and environment protection when the subject includes an environment. Repositories created, renamed, or transferred after 2026-07-15 use immutable owner and repository IDs in the default subject on GitHub.com."
  - title: "Bicep linter"
    url: "https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/linter"
    accessed: "2026-08-25"
    supports: "Bicep lint rules detect authoring issues before deployment and can be configured through bicepconfig.json."
  - title: "ARM template deployment what-if operation"
    url: "https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deploy-what-if"
    accessed: "2026-08-26"
    supports: "What-if predicts changes without applying them and requires `Microsoft.Resources/deployments/*` plus the same resource operations required for deployment."
  - title: "Deployments and environments"
    url: "https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments"
    accessed: "2026-08-26"
    supports: "GitHub environments can withhold secrets until protection rules pass; required reviewers, prevent self-review, branch or tag rules, and administrator bypass behavior depend on plan and repository visibility."
  - title: "Secret scanning"
    url: "https://docs.github.com/en/code-security/concepts/secret-security/secret-scanning"
    accessed: "2026-08-26"
    supports: "Secret scanning covers repository history and raises alerts; private and internal organization repositories require GitHub Secret Protection on a supported plan."
  - title: "Secure use reference"
    url: "https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions"
    accessed: "2026-08-26"
    supports: "Workflow credentials should use only the required permissions; action revisions must remain pinned to the reviewed full commit SHA in this control."
  - title: "Azure built-in roles for Privileged"
    url: "https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/privileged"
    accessed: "2026-08-26"
    supports: "Contributor can create and manage resources at its assignment scope, but it cannot create or delete Azure role assignments."
  - title: "Microsoft Entra built-in roles"
    url: "https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/permissions-reference"
    accessed: "2026-08-26"
    supports: "Directory Readers is the tenant role used by the temporary preflight operator to inspect application and service-principal configuration."
