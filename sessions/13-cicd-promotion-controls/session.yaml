schema_version: 2
session:
  id: "13"
  slug: "cicd-promotion-controls"
  title: "CI/CD, policy as code, and controlled promotion"
  duration_minutes: 300
  status: "draft"
  last_verified: "2026-08-26"
  audience:
    - "AI application, platform, and release engineers"
    - "GitHub, Microsoft Entra, Azure, and API Management administrators"
    - "AI quality, security, service, and delivery owners"
  prerequisites:
    - "Sessions 05, 06, 10, 11, and and 13 are complete. A focused route may use only the five substitute baselines below; each baseline must identify its owner, configuration or record, control state, and observable result."
    - "The immutable-agent substitute requires one release record for the prompt, agent, model, and Bicep inputs. The approved commit SHA is supplied through the protected workflow input instead of being stored inside that commit."
    - "The gateway substitute requires the versioned APIM policy and the stable and candidate selectors listed in the routing contract. The gateway owner confirms that preview changes only those selectors, the candidate route passes its read-only health check, and restore returns traffic to the exact previous selector."
    - "The evaluation substitute requires the evaluation definition, active threshold policy, enabled release policy, approved baseline, and passing candidate record. The release-policy baseline and candidate run IDs match those records, and the AI quality owner confirms that the callable release gate passes the candidate and blocks its generated self-test."
    - "The adversarial substitute requires a confirmed payload-free before/after report and risk/change handoff for the immutable agent version. The handoff matches the baseline and post-remediation versions. The security owner confirms that overall attack success is lower, every tracked risk passes non-regression, prohibited actions are blocked, and the report status is `confirmed`. SOC delivery remains a separate operational result."
    - "The observability substitute requires the Session 12 PowerShell and Bash smoke executables. The observability owner confirms that the result verifies the release commit in telemetry, verifies the live Application Insights workspace binding, uses distinct normal and failure trace IDs, waits for stable ingestion, separates tool failure from model failure, reports no sensitive input, and retains no payloads."
    - "The unit-check owner has accepted the customer unit script, the routing owner has accepted the customer routing script, the release owner has accepted the release-store script, and the platform owner has accepted both environment parameter contracts. The delivery owner has recorded these decisions before the session."
    - "The protected `nonproduction` GitHub environment defines the Session 12 normal and failure URLs, Application Insights resource ID, Log Analytics workspace ID, and the `SESSION12_SMOKE_BEARER_TOKEN` secret. Optional timeout and retry variables override the configured 180-second and 15-second defaults."
    - "GitHub environments `nonproduction-preview`, `nonproduction`, `production-preview`, and `production`, native secret scanning, and push protection are configured and accepted. The two apply environments require reviewers and prevent self-review."
    - "The nonproduction and production Microsoft Entra workload service principals each have a federated credential for their preview environment and another for their apply environment. Every credential subject exactly matches the repository's current GitHub OIDC subject format and environment name."
    - "Each workload service principal has only the built-in Contributor role (role ID `b24988ac-6180-42a0-ab88-20f7382dd24c`) at its exact environment resource-group scope. Contributor supplies deployment and what-if permissions but cannot assign Azure roles."
    - "The GitHub and Entra administrators use temporary administrative access only for configuration and preflight. That access expires or is removed after the ready check; the two workload service principals keep their environment-scoped Contributor assignments for pipeline operation."
    - "The approved release store can stage, approve, and retrieve one manifest by exact release ID and SHA-256."
    - "The release, quality, security, production-approval, routing, and delivery authorities are recorded and available for their live decisions."
  dependencies:
    - "Session 05 - Governed Microsoft Foundry agent baseline"
    - "Session 06 - Azure API Management as the AI gateway"
    - "Session 10 - Foundry evaluations and release quality gates"
    - "Session 11 - Red teaming, prompt injection, and Defender"
    - "Session 12 - Observability, cost, and operational controls"
  services_in_scope:
    - "github-actions"
    - "microsoft-entra-workload-id"
    - "azure-ai-foundry"
    - "azure-api-management"
    - "application-insights"
  control_objective: "Promote one immutable, gate-passing release through protected nonproduction and production environments, with approval, deployment, routing, and restore bound to the same commit SHA."
implementation:
  mode: "extended"
  extended_reason: "The delivery must prove both the permitted promotion path and the blocked evaluation path before a delivery-owner checkpoint."
implementation_outcomes:
  - "Keep one GitHub Actions workflow that proves the approved release SHA is reachable from the protected default branch before checkout, uses environment-scoped Azure OIDC, and deploys that same commit in both stages."
  - "Enforce the enabled Session 10 callable gate and generated blocked self-test before any Azure deployment, binding evaluation and adversarial results to the immutable agent name and version."
  - "Run each Bicep what-if in a preview environment and require approval in the matching apply environment before deployment."
  - "Bind protected approvals, both deployments, routing, the approved manifest, and manual previous-release restore to the selected release SHA and its recorded previous release."
  - "Run the generated blocked-tool-process self-test before deployment, complete the permitted promotion through the protected environments, then pause for the delivery owner."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/control-definition.json"
    - "implementation/artifacts/github/promotion.yml"
    - "implementation/artifacts/github/restore-previous-release.yml"
    - "implementation/artifacts/pipeline/release-manifest.template.json"
    - "implementation/artifacts/pipeline/validate-release.ps1"
    - "implementation/artifacts/pipeline/validate-release.sh"
    - "implementation/artifacts/environments/nonproduction.parameters.json"
    - "implementation/artifacts/environments/production.parameters.json"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
    - "implementation/scripts/verify.ps1"
    - "implementation/scripts/verify.sh"
retained_files:
  - path: "implementation/artifacts/control-definition.json"
    consumer: "The Session 13 validators, preflight scripts, and GitHub Actions workflows"
    operational_purpose: "Bind repository, protected-branch lineage, environment, OIDC, Azure scope, upstream gate, immutable release, routing, and ownership decisions."
  - path: "implementation/artifacts/github/promotion.yml"
    consumer: "GitHub Actions and the release operator"
    operational_purpose: "Run the gated preview, approval, deployment, smoke, routing, and manifest-finalization sequence for one immutable release."
  - path: "implementation/artifacts/github/restore-previous-release.yml"
    consumer: "GitHub Actions and the production restore operator"
    operational_purpose: "Run a manual, production-approved restore to one previously approved immutable release."
  - path: "implementation/artifacts/pipeline/release-manifest.template.json"
    consumer: "The promotion workflow and approved release store"
    operational_purpose: "Create the immutable release record that links component digests, deployment, routing, approval, and the previous release."
  - path: "implementation/artifacts/pipeline/validate-release.ps1"
    consumer: "The GitHub Actions workflow and PowerShell-based release operator"
    operational_purpose: "Enforce release-policy activation, upstream gate binding, smoke, workflow, immutable metadata, and manifest checks."
  - path: "implementation/artifacts/pipeline/validate-release.sh"
    consumer: "The Bash-based release operator"
    operational_purpose: "Apply the same release-policy, upstream gate, smoke, workflow, immutable metadata, and manifest checks outside the Windows workflow."
  - path: "implementation/artifacts/environments/nonproduction.parameters.json"
    consumer: "The nonproduction preview and apply jobs"
    operational_purpose: "Supply the approved nonproduction deployment inputs for the immutable release."
  - path: "implementation/artifacts/environments/production.parameters.json"
    consumer: "The production preview and apply jobs"
    operational_purpose: "Supply the matching production deployment inputs for the immutable release."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The PowerShell-based release readiness operator"
    operational_purpose: "Stop promotion when local contracts, GitHub protections, smoke input names, Entra federation, Azure roles, or what-if checks fail."
  - path: "implementation/scripts/preflight.sh"
    consumer: "The Bash-based release readiness operator"
    operational_purpose: "Apply the same local, GitHub, smoke-input, Entra, Azure role, and what-if readiness checks."
  - path: "implementation/scripts/verify.ps1"
    consumer: "The PowerShell-based delivery owner"
    operational_purpose: "Verify the intended or generated blocked GitHub Actions run and confirm no protected stage was bypassed."
  - path: "implementation/scripts/verify.sh"
    consumer: "The Bash-based delivery owner"
    operational_purpose: "Apply the same intended or generated blocked run verification through GitHub APIs."
sources:
  - title: "Authenticate to Azure from GitHub Actions by OpenID Connect"
    url: "https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect"
    accessed: "2026-08-25"
    supports: "Azure Login can use Microsoft Entra workload identity federation and OIDC without a client secret; environment-scoped values can be supplied by GitHub environments."
  - title: "Configuring OpenID Connect in Azure"
    url: "https://docs.github.com/en/actions/how-tos/secure-your-work/security-harden-deployments/oidc-in-azure"
    accessed: "2026-08-26"
    supports: "GitHub OIDC requires `id-token: write`, an explicit trust condition, and environment protection when the subject includes an environment. Repositories created or renamed after 2026-07-15 use immutable owner and repository IDs in the default subject."
  - title: "Bicep linter"
    url: "https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/linter"
    accessed: "2026-08-25"
    supports: "Bicep lint rules detect authoring issues before deployment and can be configured through bicepconfig.json."
  - title: "ARM template deployment what-if operation"
    url: "https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deploy-what-if"
    accessed: "2026-08-26"
    supports: "What-if predicts changes without applying them and requires `Microsoft.Resources/deployments/*` plus the same resource operations required for deployment."
  - title: "Deployments and environments"
    url: "https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments"
    accessed: "2026-08-26"
    supports: "GitHub environments can withhold secrets until protection rules pass; required reviewers, prevent self-review, branch or tag rules, and administrator bypass behavior depend on plan and repository visibility."
  - title: "Secret scanning"
    url: "https://docs.github.com/en/code-security/concepts/secret-security/secret-scanning"
    accessed: "2026-08-26"
    supports: "Secret scanning covers repository history and raises alerts; private and internal organization repositories require GitHub Secret Protection on a supported plan."
  - title: "Secure use reference"
    url: "https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions"
    accessed: "2026-08-26"
    supports: "Workflow credentials should use only the required permissions; action revisions must remain pinned to the reviewed full commit SHA in this control."
  - title: "Azure built-in roles for Privileged"
    url: "https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/privileged"
    accessed: "2026-08-26"
    supports: "Contributor can create and manage resources at its assignment scope, but it cannot create or delete Azure role assignments."
  - title: "Microsoft Entra built-in roles"
    url: "https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/permissions-reference"
    accessed: "2026-08-26"
    supports: "Directory Readers is the tenant role used by the temporary preflight operator to inspect application and service-principal configuration."
