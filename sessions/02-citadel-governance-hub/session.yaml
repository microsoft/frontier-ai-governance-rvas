schema_version: 2
session:
  id: "02"
  slug: "citadel-governance-hub"
  title: "Deploy the Citadel Governance Hub"
  duration_minutes: 300
  status: "draft"
  last_verified: "2026-09-04"
  audience:
    - "AI platform and API Management engineers"
    - "Network, security, privacy, operations, and FinOps owners"
  prerequisites:
    - "Session 01 has prepared the approved subscription, network path, private DNS ownership, required tags, and policy scope."
    - "The customer has cloned the Citadel Governance Hub repository at the commit recorded in `citadel/release.json`."
    - "The platform owner has approved the APIM SKU, Foundry regions and model capacity, API Center use, telemetry stores, PII handling, and optional services in `deployment-profile.json`."
    - "The deployment identity has the Azure roles required by the pinned Citadel release at the exact subscription and resource-group scopes."
  dependencies:
    - "Session 01 - Citadel platform foundation and landing-zone guardrails"
  services_in_scope:
    - "azure-api-management"
    - "azure-api-center"
    - "azure-ai-foundry"
    - "azure-ai-content-safety"
    - "azure-logic-apps"
    - "application-insights"
    - "log-analytics"
  control_objective: "Deploy one shared Citadel Governance Hub from a pinned upstream commit with customer-approved network, monitoring, safety, and cost choices."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Pin the reviewed Citadel Governance Hub source and record the customer deployment profile."
  - "Run preflight against the exact Git commit, Azure subscription, network, and monitoring choices."
  - "Provision the hub through the upstream Azure Developer CLI and Bicep implementation."
  - "Confirm that APIM, Foundry, telemetry, identity, and private connectivity reach their expected operating state."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/citadel/release.json"
    - "implementation/artifacts/citadel/deployment-profile.json"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
    - "implementation/scripts/deploy.ps1"
    - "implementation/scripts/deploy.sh"
retained_files:
  - path: "implementation/artifacts/citadel/release.json"
    consumer: "Citadel deployment and promotion pipelines"
    operational_purpose: "Pin the upstream repository, branch, commit, and deployment entry points reviewed by the platform owner."
  - path: "implementation/artifacts/citadel/deployment-profile.json"
    consumer: "Citadel deployment scripts and platform owner"
    operational_purpose: "Record the network, monitoring, feature, logging, location, and resource-group choices applied to the hub."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "PowerShell-based Citadel deployment operator"
    operational_purpose: "Reject an unpinned checkout, unresolved profile, wrong subscription, or missing deployment entry point."
  - path: "implementation/scripts/preflight.sh"
    consumer: "Bash-based Citadel deployment operator"
    operational_purpose: "Apply the same source, profile, scope, and tool checks outside Windows."
  - path: "implementation/scripts/deploy.ps1"
    consumer: "PowerShell-based Citadel deployment operator"
    operational_purpose: "Map the approved profile to upstream Citadel settings and run the reviewed azd deployment."
  - path: "implementation/scripts/deploy.sh"
    consumer: "Bash-based Citadel deployment operator"
    operational_purpose: "Run the same pinned Citadel deployment path outside Windows."
sources:
  - title: "Citadel Governance Hub"
    url: "https://github.com/Azure-Samples/ai-hub-gateway-solution-accelerator/tree/citadel-v1"
    accessed: "2026-09-04"
    supports: "Current Citadel Governance Hub architecture, Bicep entry point, Azure Developer CLI deployment, feature flags, contract modules, and operational guides."
  - title: "Generative AI gateway capabilities in Azure API Management"
    url: "https://learn.microsoft.com/azure/api-management/genai-gateway-capabilities"
    accessed: "2026-09-04"
    supports: "AI gateway policy capabilities for authentication, token limits, load balancing, semantic caching, content safety, and observability."
  - title: "Microsoft Foundry control plane overview"
    url: "https://learn.microsoft.com/azure/ai-foundry/control-plane/overview"
    accessed: "2026-09-04"
    supports: "Current control-plane inventory, governance, observability, evaluation, and fleet-management model."
