schema_version: 2
session:
  id: "06"
  slug: "agent-365-access-boundary"
  title: "Microsoft Agent 365 onboarding and access boundaries"
  duration_minutes: 90
  status: "draft"
  last_verified: "2026-08-28"
  audience:
    - "Microsoft 365 and Microsoft Agent 365 administrators"
    - "Microsoft Entra identity and application owners"
    - "Agent product owners and test-group sponsors"
  prerequisites:
    - "One approved nonproduction agent from Microsoft Foundry, Copilot Studio, or Agent Builder appears in Agent Registry with Available status and supports group installation through Microsoft 365 admin center."
    - "For a Foundry agent, complete Session 05. For a Copilot Studio or Agent Builder agent, the source-platform owner confirms the published agent, runtime owner, and approved lifecycle path."
    - "The Microsoft 365 administrator can inspect the registry entry and its installation path. The Entra owner has approved the requested permissions."
    - "The delivery owner has approved one nonproduction test group, one host product, the use case, and the post-DLP installation route."
    - "Do not install the agent for the test group until Session 10 confirms that its DLP policy is enabled and propagated."
  dependencies:
    - "One supported Agent 365 entry path: Session 05 for Microsoft Foundry, or an approved published Copilot Studio or Agent Builder agent"
  services_in_scope:
    - "agent-365"
    - "microsoft-365-copilot"
    - "microsoft-entra-id"
  control_objective: "Prepare one approved nonproduction Agent Registry deployment for a Foundry, Copilot Studio, or Agent Builder agent, keep it uninstalled, then hand it to Session 10 after DLP coverage is confirmed."
implementation:
  mode: "extended"
  extended_reason: "The deployment stays uninstalled until Session 10 confirms DLP coverage, so the delivery owner checks the prepared contract and any premature installation."
implementation_outcomes:
  - "Record the approved agent origin, Agent Registry entry, test group, host product, use case, and permission-consent decision."
  - "Confirm that Microsoft 365 has no installation for the test group."
  - "Hand the deployment contract and restore route to Session 10 for post-DLP installation and access checks."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/agent-deployment.json"
retained_files:
  - path: "implementation/artifacts/agent-deployment.json"
    consumer: "The Microsoft 365 administrator and Session 06 preflight scripts"
    operational_purpose: "Define the approved agent, test group, host product, consent, uninstalled state, and post-DLP installation route."
sources:
  - title: "Governance and Lifecycle actions for agents available in Microsoft 365 admin center"
    url: "https://learn.microsoft.com/en-us/microsoft-365/admin/manage/agent-actions"
    accessed: "2026-08-28"
    supports: "Agent Registry installation for selected users or groups, permission-consent flow, uninstall restore path, and the scope effects of agent availability actions."
  - title: "Agent Registry convergence with Microsoft Agent 365"
    url: "https://learn.microsoft.com/en-us/entra/agent-id/agent-registry-convergence"
    accessed: "2026-08-28"
    supports: "Agent 365 as the unified agent registry and control plane, with Microsoft Entra retaining agent identity and access management."
  - title: "Connect existing agents to Microsoft Agent 365"
    url: "https://learn.microsoft.com/en-us/microsoft-agent-365/connect-existing-agents"
    accessed: "2026-08-28"
    supports: "Automatic Agent 365 integration for Microsoft Foundry, Copilot Studio, and Agent Builder agents, plus supported paths for external agents."
