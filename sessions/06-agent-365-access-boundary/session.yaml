schema_version: 2
session:
  id: "06"
  slug: "agent-365-access-boundary"
  title: "Microsoft Agent 365 onboarding and access boundaries"
  duration_minutes: 180
  status: "draft"
  last_verified: "2026-08-28"
  audience:
    - "Microsoft 365 and Microsoft Agent 365 administrators"
    - "Microsoft Entra identity and application owners"
    - "Agent product owners and test-group sponsors"
  prerequisites:
    - "Session 05 has created the governed nonproduction agent, and the Agent 365 administrator has confirmed that the selected agent appears in Agent Registry with Available status."
    - "The selected agent supports installation through Microsoft 365 admin center and has an approved nonproduction test group."
    - "The Microsoft 365 administrator can inspect the selected Agent Registry entry and its proposed group-installation path. The Entra owner has approved the permission list."
    - "Do not install the agent for the test group until Session 10 confirms that its DLP policy is enabled and propagated."
    - "The delivery owner has approved the agent, group, requested permissions, host products, and post-DLP installation route in the customer change process."
  dependencies:
    - "Session 05 - Governed Microsoft Foundry agent baseline"
  services_in_scope:
    - "agent-365"
    - "microsoft-365-copilot"
    - "microsoft-entra-id"
  control_objective: "Prepare one approved nonproduction Agent Registry deployment for a named test group without granting availability, then hand it to Session 10 after DLP coverage is confirmed."
implementation:
  mode: "extended"
  extended_reason: "The deployment must not make the agent available before Session 10 confirms DLP coverage, so the delivery owner checks both the prepared state and the blocked installation path."
implementation_outcomes:
  - "Prepare the approved Agent Registry entry, test group, host product, and permission-consent decision without installing the agent."
  - "Confirm that Microsoft 365 has no group installation that makes the agent available before Session 10 confirms DLP coverage."
  - "Hand the prepared deployment contract to Session 10 for the post-DLP installation and access checks."
  - "Keep the scoped deployment configuration and post-DLP installation route for the Microsoft 365 administrator."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/agent-deployment.json"
retained_files:
  - path: "implementation/artifacts/agent-deployment.json"
    consumer: "The Microsoft 365 administrator and Session 06 preflight scripts"
    operational_purpose: "Define the approved Agent Registry entry, test group, permission consent, withheld-access state, and post-DLP installation route for the scoped deployment."
sources:
  - title: "Governance and Lifecycle actions for agents available in Microsoft 365 admin center"
    url: "https://learn.microsoft.com/en-us/microsoft-365/admin/manage/agent-actions"
    accessed: "2026-08-28"
    supports: "Agent Registry installation for selected users or groups, permission-consent flow, uninstall restore path, and the scope effects of agent availability actions."
  - title: "Agent Registry convergence with Microsoft Agent 365"
    url: "https://learn.microsoft.com/en-us/entra/agent-id/agent-registry-convergence"
    accessed: "2026-08-28"
    supports: "Agent 365 as the unified agent registry and control plane, with Microsoft Entra retaining agent identity and access management."
  - title: "Connect existing agents to Microsoft Agent 365"
    url: "https://learn.microsoft.com/en-us/microsoft-agent-365/connect-existing-agents"
    accessed: "2026-08-28"
    supports: "Automatic Agent 365 integration for Microsoft Foundry, Copilot Studio, and Agent Builder agents, plus supported paths for external agents."
