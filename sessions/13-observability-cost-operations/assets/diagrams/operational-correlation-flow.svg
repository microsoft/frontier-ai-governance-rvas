<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" width="1600" height="650"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs><rect width="1600" height="650" fill="#ffffff"/><text x="60" y="79" fill="#1e40af" font-family="Cascadia Code, Segoe UI, sans-serif" font-size="34" text-anchor="start"><tspan x="60" dy="0">One trace connects separate results</tspan></text><text x="60" y="118" fill="#64748b" font-family="Cascadia Code, Segoe UI, sans-serif" font-size="20" text-anchor="start"><tspan x="60" dy="0">Each span reports its own outcome. Source systems keep their own records.</tspan></text><ellipse cx="230.0" cy="262.5" rx="130.0" ry="52.5" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/><text x="230.0" y="257" fill="#374151" font-family="Cascadia Code, Segoe UI, sans-serif" font-size="22" text-anchor="middle"><tspan x="230.0" dy="0">Model</tspan><tspan x="230.0" dy="27.5">span</tspan></text><ellipse cx="230.0" cy="477.5" rx="130.0" ry="52.5" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/><text x="230.0" y="472" fill="#374151" font-family="Cascadia Code, Segoe UI, sans-serif" font-size="22" text-anchor="middle"><tspan x="230.0" dy="0">Tool</tspan><tspan x="230.0" dy="27.5">span</tspan></text><rect x="520" y="300" width="300" height="135" rx="18" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2"/><text x="670.0" y="362" fill="#374151" font-family="Cascadia Code, Segoe UI, sans-serif" font-size="22" text-anchor="middle"><tspan x="670.0" dy="0">Gateway and</tspan><tspan x="670.0" dy="27.5">agent trace</tspan></text><polyline points="370,262 510,335" fill="none" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="370,477 510,400" fill="none" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect