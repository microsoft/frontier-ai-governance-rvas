    supports: "Agent 365 Purview capability coverage, current DSPM AI observability, explicit policy targeting of agent instances, supported DLP interaction directions and locations, encrypted-label rights, risky-AI usage awareness through Insider Risk Management, audit coverage, and the lack of automatic label inheritance for newly created content."
  - title: "Use Microsoft Purview to manage data security and compliance for Microsoft Foundry"
