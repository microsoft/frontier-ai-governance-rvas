schema_version: 2
session:
  id: "07"
  slug: "api-center-ai-mcp-inventory"
  title: "Azure API Center and the AI/MCP inventory"
  duration_minutes: 210
  status: "draft"
  last_verified: "2026-08-28"
  audience:
    - "API platform and Microsoft Foundry engineers"
    - "API product, risk, and data owners"
    - "Developers responsible for agent and MCP discovery"
  prerequisites:
    - "Complete Sessions 01-05 in the approved nonproduction scope."
    - "Make the Session 05 agent endpoint and Session 06 API Management API available."
    - "Choose one approved remote read-only MCP server to register in the inventory."
    - "Approve an Azure region that currently supports API Center."
    - "Approve the Free or Standard API Center plan after reviewing its support and limit implications."
    - "Give the deployment operator a time-bound Contributor role assignment on the exact resource group where this session deploys API Center."
    - "Give the role-assignment operator a time-bound User Access Administrator role assignment on the exact Session 06 API Management instance."
    - "Complete metadata for the agent, APIM API, and MCP server before the first delivery window."
  dependencies:
    - "Session 02 - Entra identity, RBAC, PIM, and workload identities"
    - "Session 05 - Governed Microsoft Foundry agent baseline"
    - "Session 06 - Azure API Management as the AI gateway"
  services_in_scope:
    - "azure-api-center"
    - "azure-api-management"
    - "azure-ai-foundry"
    - "foundry-agent-service"
  control_objective: "Add three selected assets to API Center: deploy the Session 05 agent API, synchronize the Session 06 APIM API, and register an approved remote MCP server. Give each asset named owners plus lifecycle, classification, and runtime-location metadata."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Deploy and link a tagged API Center in the first delivery window."
  - "Link the Session 06 API Management instance so its APIs, definitions, and deployments synchronize to the inventory."
  - "Add the Session 05 agent API definition and register an approved remote MCP server. Give both lifecycle, risk, residency, and review metadata."
  - "Keep the direct agent definition in source control. Asset owners maintain metadata in API Center."
  - "After synchronization, check the three required Session 07 entries, their metadata, deployment locations, and source integration health. Owners must also complete required metadata for other APIs synchronized from the linked APIM instance."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/api-center/main.bicep"
    - "implementation/artifacts/api-center/apim-reader.bicep"
    - "implementation/artifacts/api-center/metadata-schemas.json"
    - "implementation/artifacts/api-center/agent-api-definition.json"
    - "implementation/artifacts/catalog/specs/policy-assistant-agent.openapi.json"
    - "implementation/artifacts/environments/sandbox.json"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/deploy.ps1"
    - "implementation/scripts/check-inventory.ps1"
retained_files:
  - path: "implementation/artifacts/api-center/main.bicep"
    consumer: "The Session 07 API Center deployment scripts"
    operational_purpose: "Deploy and update API Center, its metadata schema, the direct agent entry, and the APIM reader module."
  - path: "implementation/artifacts/api-center/apim-reader.bicep"
    consumer: "The Session 07 API Center deployment scripts"
    operational_purpose: "Assign API Management Service Reader to the API Center identity at the exact APIM service scope."
  - path: "implementation/artifacts/api-center/metadata-schemas.json"
    consumer: "The API Center metadata-schema resources"
    operational_purpose: "Require the twelve owner, lifecycle, risk, residency, and review properties on inventoried APIs."
  - path: "implementation/artifacts/api-center/agent-api-definition.json"
    consumer: "The Session 07 API Center deployment scripts"
    operational_purpose: "Deploy the direct Session 05 agent API and its required API Center metadata."
  - path: "implementation/artifacts/catalog/specs/policy-assistant-agent.openapi.json"
    consumer: "The API Center definition import"
    operational_purpose: "Publish the design-time OpenAPI definition for the direct Session 05 agent endpoint."
  - path: "implementation/artifacts/environments/sandbox.json"
    consumer: "The Session 07 preflight, deployment, and inventory-check scripts"
    operational_purpose: "Bind API Center operations to the approved service, workspace, APIM source, region, and tags."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The API Center deployment operator"
    operational_purpose: "Check metadata decisions, runtime coordinates, APIM scope, reader role, collisions, and ARM what-if."
  - path: "implementation/scripts/deploy.ps1"
    consumer: "The API Center deployment operator"
    operational_purpose: "Deploy API Center, import the agent definition, and create the APIM source integration."
  - path: "implementation/scripts/check-inventory.ps1"
    consumer: "The API program owner"
    operational_purpose: "Check required records and metadata against live API Center and inspect APIM integration state when exposed."
sources:
  - title: "Azure API Center overview"
    url: "https://learn.microsoft.com/en-us/azure/api-center/overview"
    accessed: "2026-08-25"
    supports: "API Center inventories and discovers APIs at design time; API Management governs calls at runtime. Current regions and plan behavior are documented."
  - title: "Azure API Center key concepts"
    url: "https://learn.microsoft.com/en-us/azure/api-center/key-concepts"
    accessed: "2026-08-25"
    supports: "Current inventory entities include APIs, versions, definitions, environments, deployments, local and remote MCP servers, and A2A agents."
  - title: "Use metadata to organize and govern APIs"
    url: "https://learn.microsoft.com/en-us/azure/api-center/metadata"
    accessed: "2026-08-25"
    supports: "Custom metadata can be required for API entities and used for filtering, governance, and automated schema validation."
  - title: "Synchronize APIs from Azure API Management instance"
    url: "https://learn.microsoft.com/en-us/azure/api-center/synchronize-api-management-apis"
    accessed: "2026-08-26"
    supports: "The GA API Management integration continuously synchronizes APIs, optional definitions, environments, deployments, MCP servers, and A2A agent APIs; synchronization is one-way and can take up to 24 hours."
  - title: "Inventory and discover MCP servers in your API Center"
    url: "https://learn.microsoft.com/en-us/azure/api-center/register-discover-mcp-server"
    accessed: "2026-08-25"
    supports: "Current portal registration for remote MCP servers, required environment association, generated transport definitions, registry discovery, and source synchronization options."
  - title: "Managed API linting and analysis"
    url: "https://learn.microsoft.com/en-us/azure/api-center/enable-managed-api-analysis-linting"
    accessed: "2026-08-25"
    supports: "API Center automatically analyzes OpenAPI and AsyncAPI definitions with a managed Spectral ruleset and supports saved custom rulesets."
  - title: "az apic integration create"
    url: "https://learn.microsoft.com/en-us/cli/azure/apic/integration/create"
    accessed: "2026-08-25"
    supports: "The current GA Azure CLI command, required parameters, optional definition import behavior, and Azure CLI 2.57.0 minimum."
  - title: "Microsoft.ApiCenter stable Bicep resource types"
    url: "https://learn.microsoft.com/en-us/azure/templates/microsoft.apicenter/allversions"
    accessed: "2026-08-25"
    supports: "Stable 2024-03-01 resource types for API Center services, metadata schemas, workspaces, APIs, versions, definitions, environments, and deployments."
  - title: "Azure built-in roles for Integration"
    url: "https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/integration#api-management-service-reader-role"
    accessed: "2026-08-26"
    supports: "API Management Service Reader Role definition ID 71522526-b88f-4d52-b57f-d31fc3546d0d and its read-only API Management permissions."
  - title: "Azure built-in roles for Privileged"
    url: "https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/privileged"
    accessed: "2026-08-26"
    supports: "Contributor can deploy resources but cannot assign Azure roles; User Access Administrator can create the API Management Service Reader assignment at the exact API Management scope."
  - title: "What is Toolbox in Foundry?"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/toolbox-overview"
    accessed: "2026-08-28"
    supports: "Foundry Toolbox centralizes reusable tools behind a managed MCP-compatible endpoint and supports OpenAPI tools."
  - title: "Discover APIs with the Azure API Center MCP server"
    url: "https://learn.microsoft.com/en-us/azure/api-center/discover-catalog-mcp-server"
    accessed: "2026-08-28"
    supports: "API Center can expose registry search and fetch tools through an MCP endpoint on the Standard tier when the portal and access model are configured."
  - title: "Register and manage agents in Azure API Center"
    url: "https://learn.microsoft.com/en-us/azure/api-center/register-manage-agents"
    accessed: "2026-08-28"
    supports: "API Center can register agents with definitions, A2A protocol metadata, and agent cards, or synchronize A2A agents from supported sources."
