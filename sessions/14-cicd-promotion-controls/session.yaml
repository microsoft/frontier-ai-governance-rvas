schema_version: 2
session:
  id: "14"
  slug: "cicd-promotion-controls"
  title: "CI/CD, policy as code, and controlled promotion"
  duration_minutes: 300
  status: "draft"
  last_verified: "2026-08-28"
  audience:
    - "AI application, platform, and release engineers"
    - "GitHub, Microsoft Entra, Azure, and API Management administrators"
    - "AI quality, security, service, and delivery owners"
  prerequisites:
    - "Complete Sessions 05, 07, and 10-13. If your team built the earlier controls outside this series, verify the five entry conditions below. Each names an owner, configuration or record, exact control, and observable result."
    - "The immutable-agent entry condition requires GitHub release and deployment metadata that bind the prompt, agent, model, and Bicep inputs to one commit. The approved commit SHA is supplied through the protected workflow input instead of being stored inside that commit."
    - "The gateway entry condition requires the versioned APIM policy and the stable and candidate selectors listed in the routing configuration. The gateway owner confirms that preview changes only those selectors, the candidate route passes its read-only health check, and restore returns traffic to the exact previous selector."
    - "The evaluation entry condition requires the evaluation definition, active threshold policy, enabled release policy, and approved baseline and candidate records retrieved from the approved external release platform into a temporary secure workspace. The release-policy baseline and candidate run IDs match those records, and the AI quality owner confirms that the callable release gate passes the candidate and blocks its generated self-test."
    - "The adversarial entry condition requires a confirmed, payload-free security-release attestation retrieved through the approved external release/security-store interface into a temporary secure workspace. Its external authorization status and report location must be present. It must match the baseline and remediated versions for the immutable release agent, confirm lower aggregate attack success and per-risk non-regression, confirm prohibited actions are blocked, and confirm no payload is present. SOC delivery remains a separate operational result."
    - "The observability entry condition requires the Session 13 PowerShell and Bash smoke executables. The observability owner confirms that the result verifies the release commit in telemetry and the live Application Insights workspace binding, uses distinct normal and failure trace IDs, waits for stable ingestion, separates tool and model failures, reports no sensitive input, and retains no payloads."
    - "The unit-check owner has accepted the customer unit script, the routing owner has accepted the customer routing script, the release owner has accepted the release-store script, and the platform owner has accepted both environment parameter files. The delivery owner has recorded these decisions before the session."
    - "The protected `nonproduction` GitHub environment defines the Session 13 normal and failure URLs, Application Insights resource ID, Log Analytics workspace ID, and the `SESSION13_SMOKE_BEARER_TOKEN` secret. Optional timeout and retry variables override the configured 180-second and 15-second defaults."
    - "GitHub environments `nonproduction-preview`, `nonproduction`, `production-preview`, and `production`, native secret scanning, and push protection are configured and accepted. The two apply environments require reviewers and prevent self-review."
    - "The nonproduction and production Microsoft Entra workload service principals each have a federated credential for their preview environment and another for their apply environment. Every credential subject exactly matches the repository's current GitHub OIDC subject format and environment name."
    - "Each workload service principal has only the built-in Contributor role (role ID `b24988ac-6180-42a0-ab88-20f7382dd24c`) at its exact environment resource-group scope. Contributor supplies deployment and what-if permissions but cannot assign Azure roles."
    - "The GitHub and Entra administrators use temporary administrative access only for configuration and preflight. That access expires or is removed after the ready check; the two workload service principals keep their environment-scoped Contributor assignments for pipeline operation."
    - "The approved release/security-store interface stages, approves, and retrieves one release record by exact release ID and SHA-256. It also retrieves Session 11 evaluation records and the Session 12 security-release attestation only into an approved temporary secure workspace. The promotion workflow writes the release record after production routing, and the manual restore workflow consumes it."
    - "The release, quality, security, production-approval, routing, and delivery authorities are named in the approved change process and available for their live decisions."
  dependencies:
    - "Session 05 - Governed Microsoft Foundry agent baseline"
    - "Session 07 - Azure API Management as the AI gateway"
    - "Session 11 - Foundry evaluations and release quality gates"
    - "Session 12 - Red teaming, prompt injection, and Defender"
    - "Session 13 - Observability, cost, and operational controls"
  services_in_scope:
    - "github-actions"
    - "microsoft-entra-workload-id"
    - "azure-ai-foundry"
    - "azure-api-management"
    - "application-insights"
  control_objective: "Promote one immutable, gate-passing release through protected nonproduction and production environments. Tie approval, deployment, routing, and restore to the same commit SHA."
implementation:
  mode: "extended"
  extended_reason: "The delivery owner must observe the permitted promotion path and the blocked evaluation path before accepting the checkpoint."
implementation_outcomes:
  - "Keep one GitHub Actions workflow that proves the approved release SHA is reachable from the protected default branch before checkout, uses environment-scoped Azure OIDC, and deploys that same commit in both stages."
  - "Run the enabled Session 11 callable gate and generated blocked self-test before any Azure deployment, and verify that the temporary external evaluation records and Session 12 security-release attestation identify the immutable agent name and version."
  - "Run each Bicep what-if in a preview environment and require approval in the matching apply environment before deployment."
  - "Tie protected approvals, both deployments, routing, the approved release record, and manual restore to one selected release SHA."
  - "Run the generated blocked-tool-process self-test before deployment, complete the permitted promotion through the protected environments, then pause for the delivery owner."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/control-definition.json"
    - "implementation/artifacts/github/promotion.yml"
    - "implementation/artifacts/github/restore-previous-release.yml"
    - "implementation/artifacts/pipeline/release-manifest.template.json"
    - "implementation/artifacts/pipeline/validate-release.ps1"
    - "implementation/artifacts/pipeline/validate-release.sh"
    - "implementation/artifacts/environments/nonproduction.parameters.json"
    - "implementation/artifacts/environments/production.parameters.json"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
    - "implementation/scripts/verify.ps1"
    - "implementation/scripts/verify.sh"
retained_files:
  - path: "implementation/artifacts/control-definition.json"
    consumer: "The Session 14 validators, preflight scripts, and GitHub Actions workflows"
    operational_purpose: "Define the GitHub environments, OIDC trust, Azure scopes, gates, routing settings, required fields for temporary external gate artifacts, and release-record lifecycle that the promotion workflows use."
    updater: "Release controls owner"
    review_cadence: "Before a workflow change and after a GitHub, Microsoft Entra, Azure, or routing-boundary change."
  - path: "implementation/artifacts/github/promotion.yml"
    consumer: "GitHub Actions and the release operator"
    operational_purpose: "Run the gated preview, approval, deployment, smoke, routing, and release-record finalization sequence for one immutable release."
    updater: "Release engineering owner"
    review_cadence: "Before release-process changes and when a protected environment or gate changes."
  - path: "implementation/artifacts/github/restore-previous-release.yml"
    consumer: "GitHub Actions and the production restore operator"
    operational_purpose: "Run a manual, production-approved restore to one selected immutable release."
    updater: "Release engineering owner"
    review_cadence: "Before restore-process changes and after a routing interface change."
  - path: "implementation/artifacts/pipeline/release-manifest.template.json"
    consumer: "The promotion workflow and approved release store"
    operational_purpose: "Define the small release record written by each successful production promotion and read by the manual restore workflow."
    updater: "Promotion workflow"
    review_cadence: "Created for every successful production promotion; reviewed before every manual restore."
  - path: "implementation/artifacts/pipeline/validate-release.ps1"
    consumer: "The GitHub Actions workflow and PowerShell-based release operator"
    operational_purpose: "Enforce release-policy activation, temporary external gate-artifact binding, smoke, workflow, immutable metadata, and release-record checks without retaining runtime artifacts."
    updater: "Release controls owner"
    review_cadence: "When a gate, release-record schema, or workflow requirement changes."
  - path: "implementation/artifacts/pipeline/validate-release.sh"
    consumer: "The Bash-based release operator"
    operational_purpose: "Apply the same release-policy, temporary external gate-artifact, smoke, workflow, immutable metadata, and release-record checks outside the Windows workflow without retaining runtime artifacts."
    updater: "Release controls owner"
    review_cadence: "When a gate, release-record schema, or workflow requirement changes."
  - path: "implementation/artifacts/environments/nonproduction.parameters.json"
    consumer: "The nonproduction preview and apply jobs"
    operational_purpose: "Supply the approved nonproduction deployment inputs for the immutable release."
    updater: "Platform owner"
    review_cadence: "Before a nonproduction configuration change."
  - path: "implementation/artifacts/environments/production.parameters.json"
    consumer: "The production preview and apply jobs"
    operational_purpose: "Supply the matching production deployment inputs for the immutable release."
    updater: "Platform owner"
    review_cadence: "Before a production configuration change."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The PowerShell-based release readiness operator"
    operational_purpose: "Stop promotion when local definitions, required temporary external gate artifacts, GitHub protections, smoke input names, Entra federation, Azure roles, or what-if checks fail."
    updater: "Release controls owner"
    review_cadence: "When a checked platform interface changes."
  - path: "implementation/scripts/preflight.sh"
    consumer: "The Bash-based release readiness operator"
    operational_purpose: "Apply the same local, temporary external gate-artifact, GitHub, smoke-input, Entra, Azure role, and what-if readiness checks."
    updater: "Release controls owner"
    review_cadence: "When a checked platform interface changes."
  - path: "implementation/scripts/verify.ps1"
    consumer: "The PowerShell-based delivery owner"
    operational_purpose: "Verify the intended or generated blocked GitHub Actions run and confirm no protected stage was bypassed."
    updater: "Release controls owner"
    review_cadence: "When the workflow job sequence changes."
  - path: "implementation/scripts/verify.sh"
    consumer: "The Bash-based delivery owner"
    operational_purpose: "Apply the same intended or generated blocked run verification through GitHub APIs."
    updater: "Release controls owner"
    review_cadence: "When the workflow job sequence changes."
sources:
  - title: "Authenticate to Azure from GitHub Actions by OpenID Connect"
    url: "https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect"
    accessed: "2026-08-25"
    supports: "Azure Login can use Microsoft Entra workload identity federation and OIDC without a client secret; environment-scoped values can be supplied by GitHub environments."
  - title: "OpenID Connect reference"
    url: "https://docs.github.com/en/actions/reference/security/oidc"
    accessed: "2026-08-28"
    supports: "GitHub OIDC requires `id-token: write`, an explicit trust condition, and environment protection when the subject includes an environment. Repositories created, renamed, or transferred after 2026-07-15 use immutable owner and repository IDs in the default subject on GitHub.com."
  - title: "Bicep linter"
    url: "https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/linter"
    accessed: "2026-08-25"
    supports: "Bicep lint rules detect authoring issues before deployment and can be configured through bicepconfig.json."
  - title: "ARM template deployment what-if operation"
    url: "https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deploy-what-if"
    accessed: "2026-08-26"
    supports: "What-if predicts changes without applying them and requires `Microsoft.Resources/deployments/*` plus the same resource operations required for deployment."
  - title: "Deployments and environments"
    url: "https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments"
    accessed: "2026-08-26"
    supports: "GitHub environments can withhold secrets until protection rules pass; required reviewers, prevent self-review, branch or tag rules, and administrator bypass behavior depend on plan and repository visibility."
  - title: "Secret scanning"
    url: "https://docs.github.com/en/code-security/concepts/secret-security/secret-scanning"
    accessed: "2026-08-26"
    supports: "Secret scanning covers repository history and raises alerts; private and internal organization repositories require GitHub Secret Protection on a supported plan."
  - title: "Secure use reference"
    url: "https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions"
    accessed: "2026-08-26"
    supports: "Workflow credentials should use only the required permissions; action revisions must remain pinned to the reviewed full commit SHA in this control."
  - title: "Azure built-in roles for Privileged"
    url: "https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/privileged"
    accessed: "2026-08-26"
    supports: "Contributor can create and manage resources at its assignment scope, but it cannot create or delete Azure role assignments."
  - title: "Microsoft Entra built-in roles"
    url: "https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/permissions-reference"
    accessed: "2026-08-26"
    supports: "Directory Readers is the tenant role used by the temporary preflight operator to inspect application and service-principal configuration."
