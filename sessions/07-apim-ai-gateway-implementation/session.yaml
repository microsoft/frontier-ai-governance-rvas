  - title: "LLM content safety policy"
    url: "https://learn.microsoft.com/en-us/azure/api-management/llm-content-safety-policy"
    accessed: "2026-08-28"
    supports: "Current Prompt Shields and harm-category policy syntax, required Content Safety backend, managed-identity access, supported tiers, and streaming behavior that stops forwarding later events without returning a normal 403."
  - title: "Azure API Management Backends"
    url: "https://learn.microsoft.com/en-us/azure/api-management/backends"
