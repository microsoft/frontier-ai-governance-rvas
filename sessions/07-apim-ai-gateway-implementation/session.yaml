schema_version: 2
session:
  id: "07"
  slug: "apim-ai-gateway-implementation"
  title: "Azure API Management AI gateway implementation"
  duration_minutes: 150
  status: "draft"
  last_verified: "2026-08-28"
  audience:
    - "AI platform and API Management engineers"
    - "Identity, application security, and safety engineers"
    - "Operations and service owners"
  prerequisites:
    - "The approved gateway design record has `recordStatus` `ready-for-implementation`, no open readiness gaps, `targetBackend.type` `foundry-agent-service`, `implementationVariant` `policy-assistant-responses`, and the APIM instance named in `sandbox.json`. The delivery owner confirms this record. (Session 06.)"
    - "The target Foundry Agent Service policy assistant exposes a pinned Entra-authorized Responses endpoint that matches the account, project, and agent values in `sandbox.json`. The Foundry platform owner confirms the endpoint and network path. (Sessions 02-04.)"
    - "Provide the existing API Management instance named in the design record and sandbox.json with a system-assigned managed identity. Use Developer, Basic, Basic v2, Standard, Standard v2, Premium, or Premium v2."
    - "Give the operator time-bound Contributor on the exact nonproduction resource group that contains API Management."
    - "Assign Foundry Agent Consumer, role ID eed3b665-ab3a-47b6-8f48-c9382fb1dad6, to the API Management identity on the individual Session 04 agent."
    - "Configure the approved Azure AI Content Safety backend in API Management for managed-identity authentication. Assign Cognitive Services User, role ID a97b65f3-24c7-4388-baec-2e87135dc908, to the API Management identity on that exact Content Safety resource."
    - "Configure the existing Application Insights logger in API Management with managed-identity credentials."
    - "Set the APIM virtual network mode and the Foundry and Content Safety public-network-access values in sandbox.json to the live values. They must agree with the inbound, backend, and private DNS paths in the approved design record."
    - "Approve the Microsoft Entra application registration, audience, client application, and app role. Issue one workload-specific controlled APIM product subscription for the live check."
  dependencies:
    - "Session 06 - Azure API Management AI gateway design"
    - "Session 02 - Private networking, DNS, and controlled egress"
    - "Session 04 - Governed Microsoft Foundry agent baseline"
  services_in_scope:
    - "azure-api-management"
    - "azure-ai-foundry"
    - "azure-ai-content-safety"
    - "application-insights"
  control_objective: "Configure one API Management route that validates the client token and product subscription, applies approved limits and Content Safety policies, and uses managed identity to call the pinned Foundry agent."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Deploy one version-controlled API Management API and controlled product for the Session 04 agent."
  - "Require a Microsoft Entra application identity and product subscription at ingress. Use the API Management managed identity for Foundry."
  - "Apply request-size, token, Content Safety, timeout, retry, circuit-breaker, and backend-selection controls before calling Foundry."
  - "Send correlation and token metrics to Application Insights without prompt or response bodies."
  - "Confirm that APIM rejects an invalid bearer identity before Content Safety or Foundry receives the request."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/gateway/main.bicep"
    - "implementation/artifacts/gateway/apis/policy-assistant-responses.openapi.json"
    - "implementation/artifacts/gateway/policies/policy.xml"
    - "implementation/artifacts/governance/gateway-control.json"
    - "implementation/artifacts/governance/model-routing-decision.md"
    - "implementation/artifacts/environments/sandbox.json"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/deploy.ps1"
retained_files:
  - path: "implementation/artifacts/gateway/main.bicep"
    consumer: "The Session 07 APIM deployment scripts"
    operational_purpose: "Deploy and update the API, product, APIM named values, backends, diagnostics, and attached policy."
  - path: "implementation/artifacts/gateway/apis/policy-assistant-responses.openapi.json"
    consumer: "The API Management API import"
    operational_purpose: "Define the client-facing POST responses operation and request format."
  - path: "implementation/artifacts/gateway/policies/policy.xml"
    consumer: "The API Management gateway runtime"
    operational_purpose: "Validate callers and apply size, token, safety, routing, managed-identity, and telemetry controls."
  - path: "implementation/artifacts/governance/gateway-control.json"
    consumer: "The Session 07 preflight and APIM deployment scripts"
    operational_purpose: "Supply the approved identity, limit, safety, routing, cache, and ownership decisions."
  - path: "implementation/artifacts/governance/model-routing-decision.md"
    consumer: "The API product, platform, safety, and operations owners"
    operational_purpose: "Record approved APIM routing modes, secondary-backend activation criteria, preview boundaries, and regional token-counter ownership."
  - path: "implementation/artifacts/environments/sandbox.json"
    consumer: "The Session 07 preflight and deployment scripts"
    operational_purpose: "Bind every APIM action to the approved nonproduction resources and implementation marker."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The API Management deployment operator"
    operational_purpose: "Check the APIM scope, identity roles, policy inputs, collisions, and ARM what-if before deployment."
  - path: "implementation/scripts/deploy.ps1"
    consumer: "The API Management deployment operator"
    operational_purpose: "Deploy the marked Session 07 child resources into the existing APIM service."
sources:
  - title: "AI gateway capabilities in Azure API Management"
    url: "https://learn.microsoft.com/en-us/azure/api-management/genai-gateway-capabilities"
    accessed: "2026-08-26"
    supports: "The AI gateway is an API Management capability set; supported backends, tier-dependent availability, token controls, safety policies, routing, and observability."
  - title: "Configure and share your Microsoft Foundry agent"
    url: "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/configure-agent"
    accessed: "2026-08-25"
