schema_version: 2
module:
  slug: "external-agent-inventory"
  title: "External agent inventory in Microsoft Agent 365"
  duration_minutes: 150
  status: "draft"
  last_verified: "2026-09-02"
  audience:
    - "Microsoft Agent 365 administrators and AI platform engineers"
    - "Runtime owners for agents built outside the Microsoft ecosystem"
    - "External platform administrators who issue connection credentials"
    - "Agent owners and the retirement coordinator"
  prerequisites:
    - "An agent built outside the Microsoft ecosystem runs in an approved nonproduction runtime, and its runtime owner controls the source repository or supported platform integration."
    - "The Agent 365 administrator has confirmed licensing, administrator access, and Agent Registry availability."
    - "The delivery team has selected one onboarding route: built-in integration, Registry sync from a supported connected platform, or a runtime-owned Agent 365 SDK integration."
    - "For Registry sync, the external platform administrator can issue and revoke a connection credential for that platform."
    - "The agent owner, runtime owner, and retirement coordinator can review the live Agent 365 record."
  related_content:
    - "Session 05 - Microsoft Agent 365 secure rollout and data controls"
    - "Session 07 - Azure API Center and the AI/MCP inventory"
  services_in_scope:
    - "agent-365"
  control_objective: "Onboard an existing external agent into Microsoft Agent 365 through one supported integration route, record the route, credential, owner, and retirement decisions, then review the live Agent Registry record."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Record the onboarding route, runtime source reference, owners, and retirement plan in one decision record."
  - "Decide who issues, stores, rotates, and revokes the connected-platform credential before any connection is created."
  - "Complete the selected built-in, Registry sync, or runtime-owned SDK path."
  - "Review the live Agent Registry record, its owner, and its lifecycle state."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/onboarding-decision.json"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
retained_files:
  - path: "implementation/artifacts/onboarding-decision.json"
    consumer: "The Agent 365 administrator, the retirement coordinator, and the module preflight scripts"
    operational_purpose: "Hold the onboarding route, runtime source reference, owner roles, connected-platform credential decision, and cross-platform retirement plan that Agent Registry does not store."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The PowerShell module delivery operator"
    operational_purpose: "Reject unresolved decisions, an unsafe source reference, and an incomplete credential or retirement decision before the platform change."
  - path: "implementation/scripts/preflight.sh"
    consumer: "The Bash module delivery operator"
    operational_purpose: "Apply the same route, source, credential, and retirement checks outside Windows."
sources:
  - title: "Connect existing agents to Microsoft Agent 365"
    url: "https://learn.microsoft.com/microsoft-agent-365/connect-existing-agents"
    accessed: "2026-09-02"
    supports: "Automatic integration for Microsoft-built agents, and Registry sync and Agent 365 SDK as the onboarding paths for agents built outside the Microsoft ecosystem."
  - title: "Choose an Agent 365 integration option"
    url: "https://learn.microsoft.com/microsoft-agent-365/developer/choose-integration-option"
    accessed: "2026-09-02"
    supports: "Built-in integration also covers third-party agents already integrated with Agent 365; Registry sync is in preview; the SDK is required only for code-level capabilities."
  - title: "Connected platforms in the Microsoft 365 agent registry"
    url: "https://learn.microsoft.com/microsoft-agent-365/admin/connected-platforms"
    accessed: "2026-09-02"
    supports: "Supported Registry sync platforms, the administrator-led connection and sync flow, the per-platform credentials and delete permissions a connection requires, and the documented revoke paths."
