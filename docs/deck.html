<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Facilitator deck — AI Governance Platform</title>
  <meta name="description" content="Facilitator slide deck for an AI Governance Platform session." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/vendor/reveal/reset.css" />
  <link rel="stylesheet" href="assets/vendor/reveal/reveal.css" />
  <link rel="stylesheet" href="assets/vendor/reveal/theme/white.css" id="theme" />
  <link rel="stylesheet" href="assets/vendor/reveal/plugin/highlight/monokai.css" />
  <link rel="stylesheet" href="assets/css/deck.css" />
  <link rel="icon" href="assets/img/logo-mark.png" />
</head>
<body>

  <div class="reveal">
    <div class="slides">
      <!-- Populated at runtime by deck.js (reveal markdown plugin loads the
           session deck from assets/data/decks/<slug>.md). -->
      <section data-markdown
               data-separator="^\r?\n---\r?\n"
               data-separator-vertical="^\r?\n>>>\r?\n"
               data-separator-notes="^Note:"
               data-charset="utf-8"></section>
    </div>
  </div>

  <div class="deck-brand" id="deckBrand" aria-hidden="true">
    <img src="assets/img/logo-full.png" alt="RVAP" height="26" />
    <span class="deck-brand-label" id="deckBrandLabel"></span>
  </div>

  <div class="deck-msft" id="deckMsft" aria-hidden="true">
    <img src="assets/img/microsoft-logo.svg" alt="Microsoft" />
  </div>

  <button type="button" class="deck-pdf-btn" id="deckPdfBtn" title="Open a print-ready view, then use your browser to Save as PDF">
    Print / PDF
  </button>

  <noscript>
    <p style="padding:2rem;font-family:sans-serif">This facilitator deck requires JavaScript.</p>
  </noscript>

  <script src="assets/vendor/reveal/reveal.js"></script>
  <script src="assets/vendor/reveal/plugin/markdown.js"></script>
  <script src="assets/vendor/reveal/plugin/notes.js"></script>
  <script src="assets/vendor/reveal/plugin/highlight.js"></script>
  <script src="assets/js/deck.js"></script>
</body>
</html>
