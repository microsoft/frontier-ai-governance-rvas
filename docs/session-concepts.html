<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Session concepts moved</title>
  <script>
    (() => {
      const session = new URLSearchParams(window.location.search).get('s');
      const target = new URL('session.html', window.location.href);
      if (session) target.searchParams.set('s', session);
      target.searchParams.set('chapter', 'concepts');
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <p>Session concepts have moved to the Concepts chapter.</p>
</body>
</html>
