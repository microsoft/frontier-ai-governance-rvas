schema_version: 2
module:
  slug: "ai-threat-protection-shadow-ai"
  title: "Defender for AI services, Sentinel detections, and shadow AI discovery"
  duration_minutes: 270
  status: "draft"
  last_verified: "2026-10-05"
  audience:
    - "Security operations and Microsoft Sentinel engineers"
    - "Microsoft Defender for Cloud and Defender XDR administrators"
    - "Microsoft Defender for Cloud Apps owners"
    - "AI platform and Microsoft Foundry owners"
  prerequisites:
    - "The approved AI-hosting subscription, target scope alias, Sentinel workspace, Sentinel resource group, and deployment location are recorded in the private implementation parameters."
    - "The deployment operator can run subscription-scope and resource-group Bicep what-if for the approved nonproduction scope."
    - "Microsoft Defender for Cloud is enabled for the approved subscription, and the security owner can approve the AI services plan and prompt-evidence decisions."
    - "The Sentinel workspace is onboarded, the Microsoft Copilot connector is enabled or approved for enablement, and the SOC owner accepts the analytics rule and hunting query."
    - "Defender for Cloud Apps receives Cloud Discovery data, and the security operations owner can tag generative AI apps as Sanctioned or Unsanctioned."
  related_content:
    - "Session 10 - Red teaming, prompt injection, and Defender"
    - "Session 11 - Observability, cost, and operational controls"
    - "Session 05 - Microsoft Agent 365 secure rollout and data controls"
  services_in_scope:
    - "microsoft-defender-for-cloud"
    - "microsoft-sentinel"
    - "microsoft-defender-xdr"
    - "azure-ai-foundry"
  control_objective: "Enable Defender for Cloud threat protection for AI services, deploy one Sentinel Copilot jailbreak detection and one hunting query, and record the monitor-first shadow AI sanction decisions."
implementation:
  mode: "standard"
implementation_outcomes:
  - "Record the subscription scope and the Defender AI services extension decisions before the plan changes."
  - "Deploy the Defender for Cloud `AI` plan as `Standard` with the approved prompt-evidence and Purview-sharing settings."
  - "Deploy the Copilot jailbreak analytics rule and external-IP hunting query to the approved Sentinel workspace."
  - "Record the generative AI app sanction decisions and apply Unsanctioned tags through Defender for Cloud Apps in monitor mode first."
  - "Confirm the Defender plan state, enabled analytics rule, and recorded shadow AI tags."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/defender/defender-ai-plan.bicep"
    - "implementation/artifacts/defender/defender-ai-plan.bicepparam"
    - "implementation/artifacts/defender/defender-ai-plan-decisions.json"
    - "implementation/artifacts/defender/defender-ai-alerts.kql"
    - "implementation/artifacts/sentinel/copilot-threat-detections.bicep"
    - "implementation/artifacts/sentinel/copilot-threat-detections.bicepparam"
    - "implementation/artifacts/sentinel/copilot-jailbreak-analytics.kql"
    - "implementation/artifacts/sentinel/copilot-external-ip-hunting.kql"
    - "implementation/artifacts/shadow-ai/shadow-ai-sanction-decisions.json"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
retained_files:
  - path: "implementation/artifacts/defender/defender-ai-plan.bicep"
    consumer: "The subscription security deployment pipeline"
    operational_purpose: "Enable and reconcile the Microsoft Defender for Cloud AI services plan with the approved extension settings."
  - path: "implementation/artifacts/defender/defender-ai-plan.bicepparam"
    consumer: "The subscription security deployment pipeline"
    operational_purpose: "Supply the approved scope alias and extension settings for the Defender AI services plan deployment."
  - path: "implementation/artifacts/defender/defender-ai-plan-decisions.json"
    consumer: "The Defender for Cloud owner, privacy owner, SOC owner, and preflight scripts"
    operational_purpose: "Record the AI services plan, prompt evidence, Purview sharing, SOC routing, and restore decisions that live service state does not explain."
  - path: "implementation/artifacts/defender/defender-ai-alerts.kql"
    consumer: "The SOC reporting owner"
    operational_purpose: "Summarize Defender for Cloud AI alert families for weekly triage and incident-routing review."
  - path: "implementation/artifacts/sentinel/copilot-threat-detections.bicep"
    consumer: "The Sentinel-as-code deployment pipeline"
    operational_purpose: "Deploy the Copilot jailbreak scheduled analytics rule and the external-IP hunting query to the approved workspace."
  - path: "implementation/artifacts/sentinel/copilot-threat-detections.bicepparam"
    consumer: "The Sentinel-as-code deployment pipeline"
    operational_purpose: "Supply the approved workspace and scope alias for the Sentinel detections deployment."
  - path: "implementation/artifacts/sentinel/copilot-jailbreak-analytics.kql"
    consumer: "The Copilot jailbreak scheduled analytics rule"
    operational_purpose: "Detect Copilot interactions whose event data reports a jailbreak attempt."
  - path: "implementation/artifacts/sentinel/copilot-external-ip-hunting.kql"
    consumer: "The Sentinel hunting library"
    operational_purpose: "Find Copilot activity from IP addresses outside the starter private-range filter for SOC tuning."
  - path: "implementation/artifacts/shadow-ai/shadow-ai-sanction-decisions.json"
    consumer: "The Defender for Cloud Apps owner and security operations owner"
    operational_purpose: "Record the generative AI app sanction decisions, monitor-first mode, tag owner, and restore reference before portal changes."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The PowerShell module delivery operator"
    operational_purpose: "Reject unresolved decisions, wrong scopes, invalid artifact syntax, and unsafe deployment previews before changes."
  - path: "implementation/scripts/preflight.sh"
    consumer: "The Bash module delivery operator"
    operational_purpose: "Apply the same artifact, scope, syntax, and read-only preview checks outside Windows."
sources:
  - title: "AI threat protection in Microsoft Defender for Cloud"
    url: "https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-threat-protection"
    accessed: "2026-10-05"
    supports: "Defender for Cloud AI threat protection scope, Defender XDR integration, GA state, supported services, text-token boundary, and cloud availability."
  - title: "Enable threat protection for AI services"
    url: "https://learn.microsoft.com/en-us/azure/defender-for-cloud/ai-onboarding"
    accessed: "2026-10-05"
    supports: "Portal enablement path, required roles, suspicious prompt evidence behavior, Purview-sharing behavior, and Foundry agent limitation."
  - title: "Microsoft.Security/pricings"
    url: "https://learn.microsoft.com/en-us/azure/templates/microsoft.security/pricings"
    accessed: "2026-10-05"
    supports: "Bicep schema for Defender for Cloud pricing resources and the `AIPromptEvidence` extension property."
  - title: "Configure Microsoft Defender threat protection for AI Services built-in policy"
    url: "https://github.com/Azure/azure-policy/blob/master/built-in-policies/policyDefinitions/Security%20Center/ASC_Azure_Defender_AI_Full_Features_DINE.json"
    accessed: "2026-10-05"
    supports: "Built-in policy name, ID, AI plan name, `Standard` tier, and `AIPromptEvidence` and `AIPromptSharingWithPurview` extension names."
  - title: "Alerts for AI services"
    url: "https://learn.microsoft.com/en-us/azure/defender-for-cloud/alerts-ai-workloads"
    accessed: "2026-10-05"
    supports: "Current Defender for Cloud AI alert type strings and SOC triage families."
  - title: "Microsoft.SecurityInsights/alertRules"
    url: "https://learn.microsoft.com/en-us/azure/templates/microsoft.securityinsights/alertrules"
    accessed: "2026-10-05"
    supports: "Bicep schema for Microsoft Sentinel scheduled analytics rules."
  - title: "Microsoft.OperationalInsights/workspaces/savedSearches"
    url: "https://learn.microsoft.com/en-us/azure/templates/microsoft.operationalinsights/workspaces/savedsearches"
    accessed: "2026-10-05"
    supports: "Bicep schema for Log Analytics saved searches used by Sentinel hunting queries."
  - title: "Copilot jailbreak analytics rule"
    url: "https://github.com/Azure/Azure-Sentinel/blob/master/Solutions/Microsoft%20Copilot/Analytic%20Rules/CopilotJailbreakAttempt.yaml"
    accessed: "2026-10-05"
    supports: "Source KQL, rule metadata, severity, tactics, and entity mapping for the Copilot jailbreak detection."
  - title: "Copilot external IP hunting query"
    url: "https://github.com/Azure/Azure-Sentinel/blob/master/Solutions/Microsoft%20Copilot/Hunting%20Queries/CopilotExternalIPAccess.yaml"
    accessed: "2026-10-05"
    supports: "Source KQL, hunting-query metadata, severity, tactic, and entity mappings for Copilot external-IP access."
  - title: "Manage generative AI apps for your organization"
    url: "https://learn.microsoft.com/en-us/microsoft-365/copilot/manage-generative-ai-apps"
    accessed: "2026-10-05"
    supports: "Defender for Cloud Apps generative AI category, discovery policy, sanction and unsanction tags, and automatic blocking on Defender for Endpoint-onboarded devices."
  - title: "How do I discover AI apps and the sensitive data these use in my organization?"
    url: "https://learn.microsoft.com/en-us/security/security-for-ai/discover"
    accessed: "2026-10-05"
    supports: "Security for AI discovery sequence and Defender for Cloud Apps role in discovering, sanctioning, and blocking SaaS AI apps."
  - title: "Bicep What-If: Preview Changes Before Deployment"
    url: "https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-what-if"
    accessed: "2026-10-05"
    supports: "Read-only deployment preview behavior used by preflight before Bicep deployment."
  - title: "Regulation (EU) 2024/1689 (Artificial Intelligence Act)"
    url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng"
    accessed: "2026-10-05"
    supports: "Article 5 (prohibited AI practices), Article 15(5) (resilience of high-risk AI systems against attempts to alter their use, outputs, or performance), and Article 73 (reporting of serious incidents), cited in the module's EU AI Act line."
  - title: "Regulation (EU) 2026/1744 (Digital Omnibus on AI)"
    url: "https://eur-lex.europa.eu/eli/reg/2026/1744/oj/eng"
    accessed: "2026-10-05"
    supports: "Amends Article 5 of Regulation (EU) 2024/1689 without renumbering it."
