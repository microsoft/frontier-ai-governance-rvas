schema_version: 2
module:
  slug: "claude-foundry-ai-gateway"
  title: "Claude Code and Desktop through a Foundry AI gateway"
  duration_minutes: 270
  status: "draft"
  last_verified: "2026-10-05"
  audience:
    - "API Management and Microsoft Foundry platform engineers"
    - "Microsoft Entra identity and endpoint-management engineers"
    - "Security, finance, and developer-tool owners"
  prerequisites:
    - "An approved nonproduction API Management v2 instance has a system-assigned managed identity."
    - "The Foundry owner has deployed approved Claude models, accepted the Marketplace terms, and confirmed the deployment names, hosting location, and region scope."
    - "The gateway operator has time-bound Contributor on the exact API Management resource group and Reader on the Foundry resource for preflight."
    - "The role-assignment owner has User Access Administrator on the Foundry resource and can grant Cognitive Services User to the APIM identity."
    - "An Application Administrator can configure two single-tenant Entra applications, consent, app roles, and assigned users."
    - "An endpoint-management owner can distribute Claude Code settings and an exported Claude Desktop third-party inference profile."
    - "The gateway owner has approved the public or private network path, body-free Application Insights diagnostics, and the restore change."
  related_content:
    - "Session 03 - Model governance, data residency, quota, and lifecycle"
    - "Session 06 - Azure API Management AI gateway design and implementation"
    - "Session 11 - Observability, cost, and operational controls"
  services_in_scope:
    - "azure-api-management"
    - "azure-ai-foundry"
    - "microsoft-entra-id"
    - "application-insights"
  control_objective: "Route Claude Code and Desktop inference through API Management with assigned Entra identities, per-user model budgets, and managed-identity access to Foundry."
implementation:
  mode: "extended"
  extended_reason: "The two clients use different token contracts. The delivery owner must observe both permitted clients and a rejected identity or model assignment before rollout."
implementation_outcomes:
  - "Configure separate Entra token contracts for Claude Code and Claude Desktop."
  - "Apply an API-scoped policy that validates identity, resolves a user-model budget, and replaces client credentials with APIM managed identity."
  - "Configure both clients with explicit Foundry deployment names and one consistent gateway base URL."
  - "Confirm streaming responses, shared user-model counters, and rejection before backend invocation."
  - "Hand the gateway, client configuration, and restore path to their operating owners."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/gateway-inputs.json"
    - "implementation/artifacts/api-policy.xml"
    - "implementation/artifacts/budget-fragment.xml"
    - "implementation/artifacts/claude-code-settings.json"
    - "implementation/artifacts/get-entra-token.sh"
    - "implementation/artifacts/get-entra-token.ps1"
retained_files:
  - path: "implementation/artifacts/gateway-inputs.json"
    consumer: "The preflight scripts and gateway operator"
    operational_purpose: "Bind the change to approved resources, client identities, owners, network choice, and restore reference."
  - path: "implementation/artifacts/api-policy.xml"
    consumer: "The API Management gateway runtime"
    operational_purpose: "Validate each client token contract, reject unassigned user-model pairs, enforce monthly token budgets, and call Foundry without client credentials."
  - path: "implementation/artifacts/budget-fragment.xml"
    consumer: "The API Management gateway runtime"
    operational_purpose: "Supply model defaults and explicit per-user overrides on every invocation of the API-scoped policy."
  - path: "implementation/artifacts/claude-code-settings.json"
    consumer: "The endpoint-management owner and Claude Code"
    operational_purpose: "Select the gateway, token helper, and exact Foundry deployments for the supported model aliases."
  - path: "implementation/artifacts/get-entra-token.sh"
    consumer: "Claude Code on Bash-capable developer devices"
    operational_purpose: "Acquire a tenant-bound gateway token from Azure CLI and print only the credential to stdout."
  - path: "implementation/artifacts/get-entra-token.ps1"
    consumer: "Claude Code on PowerShell developer devices"
    operational_purpose: "Acquire the same tenant-bound gateway token on Windows without distributing a provider key."
sources:
  - title: "Deploy and use Claude models in Microsoft Foundry"
    url: "https://learn.microsoft.com/azure/foundry/foundry-models/how-to/use-foundry-models-claude"
    accessed: "2026-10-05"
    supports: "Marketplace prerequisites, hosting and region-scope choices, deployment-name routing, native Anthropic endpoints, and https://ai.azure.com/.default for Entra authentication."
  - title: "Configure keyless authentication with Microsoft Entra ID"
    url: "https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/configure-entra-id"
    accessed: "2026-10-05"
    supports: "Cognitive Services User at the Foundry resource scope and role-assignment permissions."
  - title: "Limit large language model API token usage"
    url: "https://learn.microsoft.com/en-us/azure/api-management/llm-token-limit-policy"
    accessed: "2026-10-05"
    supports: "Anthropic schema support on v2 tiers, UTC monthly quota windows, 403 quota rejection, gateway-local counters, and streaming and concurrency estimation limits."
  - title: "Subscriptions in Azure API Management"
    url: "https://learn.microsoft.com/en-us/azure/api-management/api-management-subscriptions"
    accessed: "2026-10-05"
    supports: "Subscription-free API access and the effect of subscription and open-product contexts on product policy execution."
  - title: "Policies in Azure API Management"
    url: "https://learn.microsoft.com/en-us/azure/api-management/api-management-howto-policies"
    accessed: "2026-10-05"
    supports: "API scope, inherited policies, evaluation order, and explicit error handling."
  - title: "Authenticate and authorize access to LLM APIs"
    url: "https://learn.microsoft.com/azure/api-management/api-management-authenticate-authorize-ai-apis"
    accessed: "2026-10-05"
    supports: "JWT validation with issuer, audience, and required claims, followed by separate backend authentication."
  - title: "Server-sent events in Azure API Management"
    url: "https://learn.microsoft.com/azure/api-management/how-to-server-sent-events"
    accessed: "2026-10-05"
    supports: "Disable forward-request response buffering to relay SSE incrementally."
  - title: "Emit metrics for consumption of large language model tokens"
    url: "https://learn.microsoft.com/en-us/azure/api-management/llm-emit-token-metric-policy"
    accessed: "2026-10-05"
    supports: "Anthropic support on v2 tiers, Application Insights custom-metric prerequisites, interrupted-stream limits, and dimension cardinality limits."
  - title: "Web Application Firewall exclusion lists"
    url: "https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/application-gateway-waf-configuration"
    accessed: "2026-10-05"
    supports: "Application Gateway v2 WAF exclusions scoped to request attributes and managed rules."
  - title: "Connect Claude Code to an LLM gateway"
    url: "https://code.claude.com/docs/en/llm-gateway-connect"
    accessed: "2026-10-05"
