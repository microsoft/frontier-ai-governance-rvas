schema_version: 2
session:
  id: "04"
  slug: "citadel-contract-governance"
  title: "Govern Citadel backends, access, tools, and agents"
  duration_minutes: 330
  status: "draft"
  last_verified: "2026-09-04"
  audience:
    - "AI platform, API Management, model, and integration engineers"
    - "Security, tool, API Center, and workload owners"
  prerequisites:
    - "Session 02 has deployed the Citadel Governance Hub, or an existing pinned Citadel hub is approved for this workload."
    - "Session 03 has produced the policy-assistant agent, or another approved workload has the same identity, model, and read-only tool boundary."
    - "The platform owner has approved one model backend, one workload access boundary, and one read-only MCP tool."
    - "The service owner has decided whether to use the preview Citadel publish contract. The access contract remains required."
  dependencies:
    - "Session 02 - Deploy the Citadel Governance Hub"
    - "Session 03 - Deploy a Citadel Agent Spoke and governed agent"
  services_in_scope:
    - "azure-api-management"
    - "azure-api-center"
    - "azure-ai-foundry"
    - "azure-key-vault"
  control_objective: "Deploy customer-owned Citadel backend and access contracts, then optionally publish one read-only MCP tool through the hub and API Center."
implementation:
  mode: "extended"
  extended_reason: "The workload owner must observe the approved model and tool path and a prohibited tool action that remains absent or denied."
implementation_outcomes:
  - "Pin the Citadel contract modules and complete one backend, access, and optional publish overlay."
  - "Onboard the approved model through managed identity with a circuit breaker and stable gateway alias."
  - "Create one workload-specific APIM product and store its generated access material in the approved Key Vault."
  - "Publish and register one read-only MCP tool when the preview boundary is accepted."
  - "Confirm the intended model and tool path and the blocked prohibited action."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/citadel-release.json"
    - "implementation/artifacts/contracts/backend/main.bicepparam"
    - "implementation/artifacts/contracts/access/main.bicepparam"
    - "implementation/artifacts/contracts/publish/main.bicepparam"
    - "implementation/artifacts/governance/agent-mcp-binding.json"
    - "implementation/artifacts/governance/security-evaluation.md"
    - "implementation/artifacts/governance/threat-model.md"
    - "implementation/artifacts/operations/mcp-traffic.kql"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
    - "implementation/scripts/deploy.ps1"
    - "implementation/scripts/deploy.sh"
retained_files:
  - path: "implementation/artifacts/citadel-release.json"
    consumer: "Citadel contract deployment pipeline"
    operational_purpose: "Pin the reviewed contract templates and record the publish-contract preview boundary."
  - path: "implementation/artifacts/contracts/backend/main.bicepparam"
    consumer: "Citadel backend-contract deployment"
    operational_purpose: "Declare the approved model endpoint, identity, deployment version, capacity, and routing settings."
  - path: "implementation/artifacts/contracts/access/main.bicepparam"
    consumer: "Citadel access-contract deployment"
    operational_purpose: "Declare the workload product, granted APIs, Key Vault destination, and access-policy boundary."
  - path: "implementation/artifacts/contracts/publish/main.bicepparam"
    consumer: "optional Citadel publish-contract deployment"
    operational_purpose: "Declare the read-only MCP asset, managed-identity backend, ownership metadata, and API Center registration."
  - path: "implementation/artifacts/governance/agent-mcp-binding.json"
    consumer: "agent deployment and release process"
    operational_purpose: "Bind the approved agent version to the published tool name and permitted operation."
  - path: "implementation/artifacts/governance/security-evaluation.md"
    consumer: "security and tool owners"
    operational_purpose: "Record the live intended-path and prohibited-action observations."
  - path: "implementation/artifacts/governance/threat-model.md"
    consumer: "workload security owner"
    operational_purpose: "Keep the trust boundaries and abuse cases that govern contract changes."
  - path: "implementation/artifacts/operations/mcp-traffic.kql"
    consumer: "operations and security teams"
    operational_purpose: "Query payload-free MCP traffic, failures, throttling, and correlation identifiers."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "PowerShell-based contract operator"
    operational_purpose: "Reject unresolved overlays, an unpinned Citadel checkout, or an invalid target resource group."
  - path: "implementation/scripts/preflight.sh"
    consumer: "Bash-based contract operator"
    operational_purpose: "Apply the same source, overlay, tool, and scope checks outside Windows."
  - path: "implementation/scripts/deploy.ps1"
    consumer: "PowerShell-based contract operator"
    operational_purpose: "Preview and deploy backend, optional publish, and access contracts in dependency order."
  - path: "implementation/scripts/deploy.sh"
    consumer: "Bash-based contract operator"
    operational_purpose: "Run the same Citadel contract deployment outside Windows."
sources:
  - title: "Citadel Governance Hub"
    url: "https://github.com/Azure-Samples/ai-hub-gateway-solution-accelerator/tree/citadel-v1"
    accessed: "2026-09-04"
    supports: "Backend, access, and preview publish contract modules, deployment order, policy surfaces, API Center integration, and validation notebooks."
  - title: "Model Context Protocol support in Azure API Management"
    url: "https://learn.microsoft.com/azure/api-management/mcp-server-overview"
    accessed: "2026-09-04"
    supports: "Current MCP server exposure, policy, authorization, and API Management behavior."
  - title: "Azure API Center overview"
    url: "https://learn.microsoft.com/azure/api-center/overview"
    accessed: "2026-09-04"
    supports: "Current API Center inventory, metadata, environment, and governance model."
