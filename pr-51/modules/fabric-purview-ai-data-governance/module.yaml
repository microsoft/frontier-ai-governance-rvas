schema_version: 2
module:
  slug: "fabric-purview-ai-data-governance"
  title: "Microsoft Fabric and Microsoft Purview governance for AI data"
  duration_minutes: 420
  status: "draft"
  last_verified: "2026-10-05"
  audience:
    - "Fabric administrators and data platform engineers"
    - "Microsoft Purview compliance and information protection operators"
    - "Data product owners for AI grounding data"
    - "AI application owners who consume governed Fabric data"
  prerequisites:
    - "One approved nonproduction Microsoft Fabric workspace contains the gold lakehouse used for AI grounding, and the workspace is hosted on a Fabric or Premium capacity that supports the planned DLP scope."
    - "The Fabric administrator can read tenant settings and operate OneLake security roles for the selected lakehouse."
    - "The Microsoft Entra AI consumer group and restricted consumer group are created and approved for this module."
    - "The Purview operator can apply the selected sensitivity label and create a Fabric DLP policy in simulation mode through the approved Purview change path."
    - "The delivery owner can observe one permitted consumer identity and one restricted consumer identity during the access checks."
  related_content:
    - "Session 05 - Microsoft Agent 365 secure rollout and data controls"
    - "Responsible AI impact assessment, transparency, and human oversight"
    - "Defender for AI services, Sentinel detections, and shadow AI discovery"
  services_in_scope:
    - "microsoft-fabric"
    - "microsoft-purview"
    - "microsoft-entra-id"
  control_objective: "Record and check Fabric Copilot and AI tenant settings, configure one gold lakehouse access role and Purview label/DLP decision, then confirm permitted and restricted AI consumer access."
implementation:
  mode: "extended"
  extended_reason: "Data access must be confirmed for both a permitted AI consumer identity and a restricted consumer identity before the lakehouse is used for grounding."
implementation_outcomes:
  - "Compare the Fabric Copilot and AI tenant settings group with the recorded baseline."
  - "Create one OneLake security role for the approved AI consumer group and remove restricted principals from DefaultReader."
  - "Record the selected sensitivity label and portal-led Fabric DLP policy in simulation mode."
  - "Confirm the intended consumer can reach the approved gold data path and the restricted consumer cannot."
  - "Assign operating owners for tenant-setting drift, lakehouse access, label coverage, DLP simulation, and removal."
deliverables:
  implementation: "implementation/README.md"
  deck: "deck.md"
  leave_behind:
    - "implementation/artifacts/fabric/tenant-settings-baseline.json"
    - "implementation/artifacts/fabric/onelake-ai-consumer-role.json"
    - "implementation/artifacts/purview/fabric-label-dlp-decision.json"
    - "implementation/artifacts/verification/access-check-plan.json"
    - "implementation/scripts/preflight.ps1"
    - "implementation/scripts/preflight.sh"
    - "implementation/scripts/check-tenant-settings.ps1"
    - "implementation/scripts/check-tenant-settings.sh"
    - "implementation/scripts/verify-access.ps1"
    - "implementation/scripts/verify-access.sh"
retained_files:
  - path: "implementation/artifacts/fabric/tenant-settings-baseline.json"
    consumer: "The Fabric administrator and tenant-settings drift check scripts"
    operational_purpose: "Define the approved Copilot and AI tenant settings baseline and owner decision for drift review."
  - path: "implementation/artifacts/fabric/onelake-ai-consumer-role.json"
    consumer: "The Fabric administrator and OneLake access verification scripts"
    operational_purpose: "Define the OneLake security role payload, AI consumer group, restricted-principal review, and approved gold lakehouse coordinates."
  - path: "implementation/artifacts/purview/fabric-label-dlp-decision.json"
    consumer: "The Purview operator and data product owner"
    operational_purpose: "Record the approved Fabric item label, DLP policy scope, simulation state, alert owner, and portal restore reference."
  - path: "implementation/artifacts/verification/access-check-plan.json"
    consumer: "The delivery owner and AI application owner"
    operational_purpose: "Record the permitted and restricted consumer checks that confirm the lakehouse access boundary."
  - path: "implementation/scripts/preflight.ps1"
    consumer: "The PowerShell module delivery operator"
    operational_purpose: "Reject unresolved decisions, wrong target scope, invalid artifacts, and missing local tools before any Fabric or Purview change."
  - path: "implementation/scripts/preflight.sh"
    consumer: "The Bash module delivery operator"
    operational_purpose: "Run the same local readiness, scope, artifact, and unresolved-decision checks outside Windows."
  - path: "implementation/scripts/check-tenant-settings.ps1"
    consumer: "The PowerShell Fabric administrator"
    operational_purpose: "Read Fabric tenant settings through the Fabric Admin REST API and compare the Copilot and AI group with the recorded baseline."
  - path: "implementation/scripts/check-tenant-settings.sh"
    consumer: "The Bash Fabric administrator"
    operational_purpose: "Run the same Fabric Admin REST tenant-settings drift check with Azure CLI, curl, and jq."
  - path: "implementation/scripts/verify-access.ps1"
    consumer: "The PowerShell Fabric administrator and delivery owner"
    operational_purpose: "Read OneLake security roles through the Fabric REST API and confirm the approved AI consumer group and restricted-principal review before the live user checks."
  - path: "implementation/scripts/verify-access.sh"
    consumer: "The Bash Fabric administrator and delivery owner"
    operational_purpose: "Run the same read-only OneLake role check with Azure CLI, curl, and jq."
sources:
  - title: "Tenants - List Tenant Settings"
    url: "https://learn.microsoft.com/en-us/rest/api/fabric/admin/tenants/list-tenant-settings"
    accessed: "2026-10-05"
    supports: "Fabric Admin REST endpoint, permissions, paging, and supported identities for reading tenant settings."
  - title: "Copilot and Agent admin settings"
    url: "https://learn.microsoft.com/en-us/fabric/admin/service-admin-portal-copilot"
    accessed: "2026-10-05"
    supports: "Fabric Copilot and AI tenant settings, processing and storage controls, Copilot capacities, and conversation history behavior."
  - title: "OneLake security roles: create and manage"
    url: "https://learn.microsoft.com/en-us/fabric/onelake/security/create-manage-roles"
    accessed: "2026-10-05"
    supports: "OneLake role creation, Read roles, RLS/CLS support, member assignment, and DefaultReader review guidance."
  - title: "OneLake Data Access Security - Create Or Update Data Access Roles"
    url: "https://learn.microsoft.com/en-us/rest/api/fabric/core/onelake-data-access-security/create-or-update-data-access-roles"
    accessed: "2026-10-05"
    supports: "REST payload shape, dryRun behavior, If-Match ETag header, Microsoft Entra members, and role constraints."
  - title: "OneLake Data Access Security - List Data Access Roles"
    url: "https://learn.microsoft.com/en-us/rest/api/fabric/core/onelake-data-access-security/list-data-access-roles"
    accessed: "2026-10-05"
    supports: "Read-only OneLake role listing endpoint and OneLake.Read.All scope for verification."
  - title: "Information protection in Fabric"
    url: "https://learn.microsoft.com/en-us/fabric/governance/information-protection"
    accessed: "2026-10-05"
    supports: "Sensitivity label prerequisites, Fabric item support, inheritance behavior, and label coverage governance."
  - title: "Get started with DLP for Fabric and Power BI"
    url: "https://learn.microsoft.com/en-us/purview/dlp-powerbi-get-started"
    accessed: "2026-10-05"
    supports: "Fabric DLP scope, supported item types, actions, custom-policy requirement, and capacity limitation."
  - title: "Create and deploy a data loss prevention policy"
    url: "https://learn.microsoft.com/en-us/purview/dlp-create-deploy-policy"
    accessed: "2026-10-05"
    supports: "Purview DLP deployment states, simulation mode, simulation with policy tips, and full enforcement behavior."
  - title: "Use Microsoft Purview with Microsoft Fabric"
    url: "https://learn.microsoft.com/en-us/fabric/governance/microsoft-purview-fabric"
    accessed: "2026-10-05"
    supports: "Microsoft Purview and Microsoft Fabric integration points for sensitivity labels, DLP, audit, risk, and compliance scenarios."
  - title: "Regulation (EU) 2024/1689 (Artificial Intelligence Act)"
    url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng"
    accessed: "2026-10-05"
    supports: "Article 10 (data and data governance) covers training, validation, and testing data, and Article 10(6) limits it to testing data for systems that do not train models. Article 26(4) requires deployers to keep input data under their control relevant and sufficiently representative. Cited in the module's EU AI Act line."
  - title: "Regulation (EU) 2026/1744 (Digital Omnibus on AI)"
    url: "https://eur-lex.europa.eu/eli/reg/2026/1744/oj/eng"
    accessed: "2026-10-05"
    supports: "Amends Article 10 of Regulation (EU) 2024/1689 without renumbering it."
