name: lab-lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep && sudo mv bicep /usr/local/bin/bicep
      - name: Build & lint all Bicep
        run: |
          shopt -s globstar nullglob
          found=0
          for f in labs/**/*.bicep; do
            found=1
            echo "::group::bicep build $f"
            bicep build "$f" --stdout > /dev/null
            echo "::endgroup::"
          done
          [ "$found" = 0 ] && echo "No .bicep files yet — skipping." || true

  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Analyze PowerShell
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Path labs -Include *.ps1 -File
          if (-not $files) { Write-Host "No .ps1 files yet — skipping."; exit 0 }
          $issues = $files | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error }
          if ($issues) { $issues | Format-Table; throw "PSScriptAnalyzer found errors." }

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Lint & compile Python
        run: |
          shopt -s globstar nullglob
          pyfiles=(labs/**/*.py)
          if [ ${#pyfiles[@]} -eq 0 ]; then echo "No .py files yet — skipping."; exit 0; fi
          ruff check labs
          python -m py_compile "${pyfiles[@]}"

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          shopt -s globstar nullglob
          shfiles=(labs/**/*.sh)
          if [ ${#shfiles[@]} -eq 0 ]; then echo "No .sh files yet — skipping."; exit 0; fi
          shellcheck "${shfiles[@]}"

  json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON policy files
        run: |
          shopt -s globstar nullglob
          jsonfiles=(labs/**/policies/*.json)
          if [ ${#jsonfiles[@]} -eq 0 ]; then echo "No policy JSON yet — skipping."; exit 0; fi
          for f in "${jsonfiles[@]}"; do
            echo "Validating $f"
            python -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done

  pipelines-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run mock-target pipeline checks
        run: |
          shopt -s globstar nullglob
          runners=(labs/**/pipelines/run_mock.py)
          if [ ${#runners[@]} -eq 0 ]; then echo "No mock pipeline runners yet — skipping."; exit 0; fi
          for f in "${runners[@]}"; do
            echo "::group::mock run $f"
            python "$f"
            echo "::endgroup::"
          done
